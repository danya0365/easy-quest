<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }

<script type="module">
// DEMO — P09: THE CAMERA. The real field, the real map, the real hero — and nothing else — so every frame here is
// the camera's work: the spring follow, the 360° orbit, the ease-behind, the lead, the modes, the cutscene camera,
// and the clean alpha fade of whatever comes between the lens and Bram.
//
// Controls for a human: arrows walk, shift runs, Q/E orbit, 1-5 pick a mode (field/town/world/interior/dungeon),
// F toggles the occluder fade (A/B against the old dither), T frames a conversation, C plays a cutscene shot,
// W runs the scripted walk through the trees and the cottage.
//
// For a critic (__DQ): cameraOrbit cameraZoom cameraAuto cameraRig cameraMode cameraShot cameraRelease cameraFade
// cameraFrame cameraOccluders — plus this page's p09cover (stand behind something and WAIT for the camera to
// report a clean 42% ghost), p09fade (what is ghosting, in numbers), p09stand, p09walk, p09objects, p09talk,
// p09panel. The panel's top line is the whole point of the piece: the boy as a percentage of frame height.
import { App } from '/src/engine/app.js';
import { Scenes } from '/src/engine/states.js';
import { Bus } from '/src/engine/events.js';
import { Loop } from '/src/engine/loop.js';
import { Debug, reportError } from '/src/engine/debug.js';
import { Input } from '/src/engine/input.js';
import { applyCssVars } from '/src/art/palette.js';
import { Maps } from '/src/world/map.js';
import { Field } from '/src/world/field.js';
import { preloadHero } from '/src/world/player.js';

applyCssVars();
Input.init();
App.start({ canvas: document.getElementById('game-canvas'), version: '0.9.0-P09', beforeUpdate: Input.update });

const panel = document.getElementById('cam');
const talkBox = document.getElementById('talk');
let showPanel = true;

// A stand-in for the dialogue scene (P12 owns the real one): the field's camera settles lower while it is on top,
// which is the "talk framing" this demo shows. It renders nothing 3D, so the field keeps drawing underneath.
Scenes.register('dialogue', () => ({
  opaque: false, updateBelow: true,
  enter() { talkBox.style.display = 'block'; },
  exit() { talkBox.style.display = 'none'; },
  update() {}, render() {},
  onInput(btn) { if (btn === 'confirm' || btn === 'cancel') Scenes.pop(); return true; },
}));

// ── the scripted walk: real input, injected, so the camera is doing exactly what it does for a player ──────────
const WALK = { path: null, at: 0, name: null, done: true };
function pressToward(wx, wz) {
  const w = Field.world();
  if (!w) return;
  const p = w.player.p;
  const dx = wx - p.x, dz = wz - p.z;
  const yaw = w.cameraRig.yaw;                       // the frame the player walks in
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const fwd = dx * fx + dz * fz, side = dx * rx + dz * rz;
  const m = Math.max(1e-4, Math.hypot(fwd, side));
  if (fwd / m > 0.38) Input.inject('up', 40);
  if (fwd / m < -0.38) Input.inject('down', 40);
  if (side / m > 0.38) Input.inject('right', 40);
  if (side / m < -0.38) Input.inject('left', 40);
}
Field.on('update', () => {
  try {
    if (WALK.done || !WALK.path || !WALK.path.length) return;
    const w = Field.world();
    if (!w) return;
    const p = w.player.p, t = WALK.path[WALK.at];
    if (Math.hypot(t[0] - p.x, t[1] - p.z) < 1.3) {
      WALK.at++;
      if (WALK.at >= WALK.path.length) { WALK.done = true; return; }
    }
    pressToward(WALK.path[WALK.at][0], WALK.path[WALK.at][1]);
  } catch (e) { reportError('P09 walk', e); }
});

/** Objects the fade pass can see (biggest first): trees, cottages, fences — with where they are. */
const objects = (n = 40) => {
  const w = Field.world();
  return w && w.cameraRig.fade ? w.cameraRig.fade.objects(n) : [];
};
/**
 * Where to stand so an occluder really covers Bram AND the lens stays clear of it. The field camera is the DQV
 * boom the map's composition solves (≈6 units at 26°, the boy 20% of frame height), so the flat run between the
 * lens and the boy is only ~5.4 units: a 1.5-unit-wide signpost or hedge fits between them and GHOSTS at 42%,
 * while a 7-unit cottage cannot — the lens would be inside it, which is the near-melt case (it goes entirely,
 * on purpose: you can never be shut inside a roof). So a stance states both numbers:
 *   `back` how far past the thing he stands, and `need` the boom a 42% ghost of it wants.
 * p09stand keeps the map's own boom when the thing fits inside it, and only zooms out when it does not.
 *   'prop'  a signpost / fence / hedge / small tree: fades at 42% WITH the map's own framing
 *   'tree'  a canopy: he stands past it, the crown crosses the sight line
 *   'house' a building-sized merged cluster
 *   'reset' put the boom back where the map's composition wants it
 * Solved from the camera's own geometry, so it keeps working while P23 and P04 rebuild the map underneath.
 */
const CLEAR = 2.6;                        // the lens must stay this far off the surface (camera.js FADE.near)
function stancesFor(kind = 'tree', orbit = 0) {
  const cam = window.__DQ.state().field.camera || {};
  const w = Field.world();
  const p = w ? w.player.p : { x: 0, y: 0, z: 0 };
  const pitch = (cam.pitch || 26) * Math.PI / 180;
  const flatNow = (cam.dist || 6) * Math.max(0.3, Math.cos(pitch));     // the flat run the lens has right now
  const yaw = (Number(orbit) || 0) * Math.PI / 180;
  const list = objects(900).filter((o) => Math.hypot(o.x, o.z) < 34);
  const out = [];
  for (const o of list) {
    const solid = o.kind === 'solid';
    const half = solid ? Math.max(o.w || 0, o.r) * 0.5 : o.r;
    const up = Math.max(0.5, o.y - p.y);
    if (kind === 'prop') {
      // it must fit between the lens and the boy at the map's OWN boom, and still be tall enough to cover him
      if (!(half * 2 + CLEAR < flatNow) || o.h < 1.1) continue;
    } else if (kind === 'house' || kind === 'solid') {
      // a "house" is a cluster that is actually BUILDING-sized: a 2.8-tall fence post is not a cottage
      if (!solid || !(o.h > 3.2 && (o.w || 0) > 4)) continue;
    } else if (solid || !(o.r > 0.9)) continue;
    // he stands `back` past it; the lens then sits (flat - back) beyond it and must clear its surface
    const back = half + 1.6;
    const flat = back + half + CLEAR;                          // the flat run the lens needs
    const need = +(flat / Math.max(0.3, Math.cos(pitch))).toFixed(2);
    // ... and the LENS must land in the open. A stance with a fruit tree where the camera will sit shows that
    // canopy melting at the lens instead of the thing he is hiding behind, which is not the shot we are after.
    const boom = Math.max(need, cam.dist || 6) * Math.max(0.3, Math.cos(pitch));
    const lx = o.x - Math.sin(yaw) * (back - boom), lz = o.z - Math.cos(yaw) * (back - boom);
    let clearLens = true;
    for (const q of list) {
      // instanced only: a tree's sphere is a real volume, while a merged row of fence panels reports one huge
      // box whose "radius" would rule out every stance in the village
      if (q === o || q.kind !== 'inst') continue;
      if (Math.hypot(q.x - lx, q.z - lz) < q.r + 1.1) { clearLens = false; break; }
    }
    if (!clearLens) continue;
    out.push({ o, back: +back.toFixed(2), need, up: +up.toFixed(2), size: solid ? o.h : o.r, fits: need <= (cam.dist || 6) * 1.02,
      score: (kind === 'prop' ? o.h / (half + 0.35) + o.h * 0.25 : (solid ? o.h + (o.w || 0) * 0.3 : o.r)) - need * 0.08 });
  }
  out.sort((a, b) => b.score - a.score);
  return out;
}
const stanceFor = (kind) => stancesFor(kind)[0] || null;
let standAt = 0, standKind = null, standExtra = 0, standName = null;

// ── __DQ controls ─────────────────────────────────────────────────────────────────────────────────────────────
/**
 * Stand behind an occluder so the fade is in frame: __DQ.p09stand('prop'|'tree'|'house'|'reset', orbitDeg).
 * Call it again and it CORRECTS itself from what the camera actually reports: nothing covering him -> the next
 * candidate; the thing melted at the lens (alpha under 0.15) -> step another 1.4 units clear of it. So the shot
 * a critic sees is a measured 42% ghost, not a guess.
 */
Debug.expose('p09stand', (kind = 'tree', orbit = 0, index) => {
  if (kind === 'reset') { window.__DQ.cameraMode(window.__DQ.state().field.camera.mode); window.__DQ.cameraAuto(true); return { ok: true, reset: true }; }
  const cand = stancesFor(kind, orbit);
  if (!cand.length) return { ok: false, reason: 'nothing to stand behind yet' };
  const covering = ((window.__DQ.state().field.camera.fade || {}).occluding) || 0;
  const mine = standName ? (window.__DQ.cameraOccluders() || []).find((o) => o.name === standName) : null;
  // The candidate list is re-sorted every call (instance bounds refresh as the camera moves), so a stance is
  // remembered by NAME, not by index: "stay behind the tree you chose" has to mean the same tree.
  const held = standKind === kind && standName ? cand.findIndex((c2) => c2.o.name === standName) : -1;
  if (index !== undefined) { standAt = Math.max(0, +index || 0) % cand.length; standExtra = 0; }
  else if (standKind !== kind || held < 0) { standAt = held < 0 ? 0 : held; standExtra = 0; }
  else if (mine && mine.alpha < 0.15 && standExtra < 4.3) { standAt = held; standExtra += 1.4; }  // melted: back off
  else if (mine && mine.alpha < 0.62) standAt = held;                     // it IS ghosting: stay put
  else { standAt = (held + 1) % cand.length; standExtra = 0; }            // nothing covering him: the next one
  standKind = kind;
  const yaw = (Number(orbit) || 0) * Math.PI / 180;
  // Stand him somewhere he can actually STAND: inside a wall or a stream the collision slides him off the stance
  // over the next second and the shot becomes the camera following him away from the thing. He must also stay
  // INSIDE the flat run between the lens and himself, or the thing he is hiding behind ends up behind the lens.
  const camNow = window.__DQ.state().field.camera;
  const flatNow = (camNow.dist || 6) * Math.max(0.3, Math.cos((camNow.pitch || 26) * Math.PI / 180));
  const w2 = Field.world();
  const mp = w2 ? w2.map : null;
  const standable = (tx, tz) => !mp || typeof mp.clear !== 'function' || mp.clear(tx, tz, 0.5);
  let st = null, back = 0;
  for (let t = 0; t < Math.min(6, cand.length); t++) {
    const c2 = cand[(standAt + t) % cand.length];
    const room = Math.max(c2.back, Math.min(c2.need > (camNow.dist || 6) * 1.02 ? 99 : flatNow - 1.0, c2.back + 4.2));
    for (let b = c2.back + standExtra; b <= room + 0.01; b += 0.7) {
      if (standable(c2.o.x - Math.sin(yaw) * b, c2.o.z - Math.cos(yaw) * b)) { st = c2; back = b; break; }
    }
    if (st) { standAt = (standAt + t) % cand.length; break; }
  }
  if (!st) { st = cand[Math.min(standAt, cand.length - 1)]; back = st.back + standExtra; }
  const o = st.o;
  standName = o.name;
  const x = o.x - Math.sin(yaw) * back, z = o.z - Math.cos(yaw) * back;
  const here = Field.map ? Field.map.id : 'meadow';
  const r = Field.teleport(here, +x.toFixed(2), +z.toFixed(2), Number(orbit) || 0);
  window.__DQ.cameraOrbit(Number(orbit) || 0, true);
  window.__DQ.cameraAuto(false);
  // the map's own framing first — then pull the boom back ONLY if the thing cannot fit inside it
  window.__DQ.cameraMode(window.__DQ.state().field.camera.mode);
  const boom = window.__DQ.cameraZoom();
  if (st.need > boom * 1.02) window.__DQ.cameraZoom(st.need + standExtra);
  return { ok: !!(r && r.ok), behind: o, candidate: standAt, of: cand.length, back: +back.toFixed(2),
    boom: window.__DQ.cameraZoom(), fits: !!st.fits, stepped: standExtra, player: r && r.player };
});
/** What the fade is doing right now, in one line a scenario can assert on: the ghost nearest the lens. */
Debug.expose('p09fade', () => {
  const list = window.__DQ.cameraOccluders() || [];
  const f = (window.__DQ.state().field.camera.fade) || {};
  const top = list[0] || null;
  const ghosting = list.filter((o) => o.alpha > 0.2 && o.alpha < 0.62);
  const one = (o) => ({ name: o.name, alpha: o.alpha, inside: o.inside, surf: o.surf });
  return { occluding: f.occluding || 0, fading: f.fading || 0, ghosts: f.ghosts || 0, ms: f.ms,
    top: top ? one(top) : null, ghosting: ghosting.slice(0, 3).map(one), stance: standName,
    ghost: ghosting.length ? 'alpha-ghost' : (top ? (top.alpha <= 0.2 ? 'gone-at-the-lens' : 'solid') : 'nothing') };
});
/**
 * THE SELF-VERIFYING STANCE: __DQ.p09cover('prop'|'tree'|'house', orbitDeg) -> Promise
 * Tries candidate stances and WAITS for the camera to report what happened, so it only comes back when the
 * thing he is hiding behind is measurably a clean alpha ghost (0.2-0.62) — a critic's screenshot is then never
 * of a stance that happened not to work. Returns every attempt it made, with the numbers.
 */
Debug.expose('p09cover', async (kind = 'tree', orbit = 0, tries = 7) => {
  const cand = stancesFor(kind, orbit);
  if (!cand.length) return { ok: false, reason: 'nothing to stand behind yet' };
  const log = [];
  // Judge only once the springs have ARRIVED: a boom still easing out reads as a 42% ghost one moment and a
  // melted one the next, and the screenshot would catch whichever the wait happened to land on.
  const settle = async (name, steps = 16) => {
    let f = window.__DQ.p09fade();
    for (let w = 0; w < steps; w++) {
      await new Promise((res) => setTimeout(res, 130));
      f = window.__DQ.p09fade();
      if (!window.__DQ.state().field.camera.settled) continue;
      if (f.ghosting.some((o) => o.name === name)) return f;
      if (w >= 5) return f;
    }
    return f;
  };
  for (let i = 0; i < Math.min(tries, cand.length); i++) {
    const r = window.__DQ.p09stand(kind, orbit, i);
    const name = r.behind && r.behind.name;
    let f = await settle(name);
    if (f.top && f.top.name === name && f.top.alpha < 0.15) {       // it melted at the lens: step further out
      window.__DQ.p09stand(kind, orbit);
      f = await settle(name);
    }
    log.push({ candidate: i, behind: name, ghost: f.ghost, alpha: f.top ? f.top.alpha : null, occluding: f.occluding });
    if (f.ghosting.some((o) => o.name === name)) return { ok: true, behind: name, candidate: i, of: cand.length, fade: f, tried: log };
  }
  return { ok: false, reason: 'no stance in this map ghosted', of: cand.length, tried: log };
});
/** The scripted walk: 'trees' through the copse, 'village' past the cottage, 'stop'. */
Debug.expose('p09walk', (name = 'trees') => {
  if (name === 'stop') { WALK.done = true; WALK.path = null; return { ok: true, walking: false }; }
  const ts = stanceFor('tree'), hs = stanceFor('house');
  const tree = ts && ts.o, house = hs && hs.o;
  const w = Field.world();
  const p = w ? w.player.p : { x: 0, z: 0 };
  let path = [];
  if (name === 'village' && house) path = [[house.x, house.z + (house.r + 3)], [house.x, house.z - (house.r + 2.5)], [house.x + house.r + 4, house.z]];
  else if (tree) path = [[tree.x, tree.z + tree.r + 3], [tree.x, tree.z - tree.r - 3], [tree.x + tree.r + 4, tree.z - tree.r - 1], [p.x, p.z]];
  if (!path.length) return { ok: false, reason: 'no path yet' };
  WALK.path = path; WALK.at = 0; WALK.done = false; WALK.name = name;
  if (window.__DQ) window.__DQ.cameraAuto(true);
  return { ok: true, name, path };
});
Debug.expose('p09objects', (n) => objects(n === undefined ? 12 : n));
/** Open / close the stand-in dialogue, to show the talk framing. */
Debug.expose('p09talk', (on) => {
  const open = Scenes.top() === 'dialogue';
  if (on === false || (on === undefined && open)) { if (open) Scenes.pop(); return { open: false }; }
  if (!open) Scenes.push('dialogue', {});
  return { open: true };
});
Debug.expose('p09panel', (on) => { showPanel = on === undefined ? !showPanel : !!on; panel.style.display = showPanel ? 'block' : 'none'; return showPanel; });
Debug.provide('demo', () => ({ piece: 'P09', walk: WALK.done ? null : { name: WALK.name, at: WALK.at, of: WALK.path ? WALK.path.length : 0 } }));

// ── keys a human can use ──────────────────────────────────────────────────────────────────────────────────────
const MODES = ['field', 'town', 'world', 'interior', 'dungeon'];
addEventListener('keydown', (ev) => {
  const rig = (Field.world() || {}).cameraRig;
  if (!rig) return;
  const k = ev.key;
  try {
    if (k >= '1' && k <= '5') rig.mode(MODES[+k - 1]);
    else if (k === 'f' || k === 'F') rig.fade.enabled = !rig.fade.enabled;
    else if (k === 't' || k === 'T') window.__DQ.p09talk();
    else if (k === 'w' || k === 'W') window.__DQ.p09walk(WALK.done ? 'trees' : 'stop');
    else if (k === 'r' || k === 'R') window.__DQ.p09stand('reset');
    else if (k === 'c' || k === 'C') {
      const p = Field.world().player.p;
      rig.shot({ from: { orbit: 150, pitch: 8, dist: 9, of: { x: p.x, y: p.y, z: p.z } },
        to: { orbit: 20, pitch: 34, dist: 7, of: { x: p.x, y: p.y, z: p.z } },
        lookAt: 'hero', duration: 4, ease: 'inOut', hold: false });
    }
  } catch (e) { reportError('P09 keys', e); }
});

// ── the panel: everything the camera is doing, so a critic can see it without reading code ───────────────────
function bar(v, max) { return `<div class="bar" style="width:${Math.round(Math.max(0, Math.min(1, v / max)) * 100)}%"></div>`; }
Field.on('render', () => {
  if (!showPanel) return;
  try {
    const s = window.__DQ.state();
    const cam = s.field && s.field.camera;
    if (!cam) return;
    const f = cam.fade || {};
    const fr = window.__DQ.cameraFrame() || {};
    const list = (window.__DQ.cameraOccluders() || []).slice(0, 4);
    panel.innerHTML =
      `<div class="row"><b>P09 camera</b><span class="dim">${cam.mode}</span></div>` +
      `<div class="row"><b>the boy</b><span>${(fr.heroPct || 0).toFixed(0)}% of frame <span class="dim">(${fr.heroPx || 0}px)</span></span></div>` +
      `<div class="row"><span>his feet / horizon</span><span>${(fr.feetPct || 0).toFixed(0)}% / ${(fr.horizonPct || 0).toFixed(0)}% down</span></div>` +
      `<div class="row"><span>orbit</span><span>${cam.orbit.toFixed(0)}° <span class="dim">walk ${cam.walk.toFixed(0)}° drift ${cam.drift.toFixed(0)}°</span></span></div>` +
      `<div class="row"><span>pitch / fov</span><span>${cam.pitch.toFixed(1)}° / ${cam.fov.toFixed(0)}°</span></div>` +
      `<div class="row"><span>boom / lift</span><span>${cam.dist.toFixed(2)} / ${cam.lift.toFixed(2)} <span class="dim">eye ${(fr.eyeAboveFeet || 0).toFixed(2)}</span></span></div>` +
      `<div class="row"><span>lead</span><span>${cam.lead[0].toFixed(2)}, ${cam.lead[1].toFixed(2)}</span></div>` +
      `<div class="row"><span>auto / swing</span><span>${cam.auto ? 'on' : 'off'} / ${cam.swing.toFixed(0)}°/s</span></div>` +
      (cam.shot ? `<div class="row"><span>shot</span><span>${cam.shot.t.toFixed(1)}s / ${cam.shot.duration.toFixed(1)}s${cam.shot.releasing ? ' (release)' : ''}</span></div>` : '') +
      `<div class="row"><b>fade ${f.on ? 'on' : 'OFF'}</b><span class="dim">${f.ms}ms · ${f.objects} objs</span></div>` +
      `<div class="row"><span>covering hero</span><span>${f.occluding} <span class="dim">(ghosts ${f.ghosts})</span></span></div>` +
      list.map((o) => `<div class="row"><span class="dim">${o.name.slice(0, 22)}</span><span>${Math.round(o.alpha * 100)}%${o.inside ? ' <span class="dim">at lens</span>' : ''}</span></div>${bar(1 - o.alpha, 1)}`).join('') +
      `<div class="row dim"><span>${s.player ? 'x ' + s.player.x.toFixed(1) + ' z ' + s.player.z.toFixed(1) : ''}</span><span>${s.fps} fps</span></div>`;
  } catch (e) { void e; }
});

// ── boot the real field ───────────────────────────────────────────────────────────────────────────────────────
(async () => {
  try {
    await Promise.all([
      Maps.loadAll().catch((e) => { reportError('P09 maps', e); return []; }),
      preloadHero().catch(() => false),
    ]);
    Field.install();
    // the meadow is the camera's home ground; Puddlewick (when P23 has built it) is one __DQ.teleport away
    const maps = Maps.list();
    Scenes.push('field', { map: maps.includes('meadow') ? 'meadow' : (maps[0] || 'meadow') });
    Bus.emit('app.booted', { scene: 'field' });
  } catch (e) { reportError('P09 boot', e); }
})();
void Loop;
</script></body></html>
