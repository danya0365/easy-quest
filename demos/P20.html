<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>P20 — Spells &amp; spell VFX</title>
<link rel="stylesheet" href="/src/ui/ui.css"/>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}
#game-canvas{display:block;width:100vw;height:100vh}#ui-root{position:fixed;inset:0;pointer-events:none}
.p20-card{position:absolute;left:calc(22 * var(--u,1px));top:calc(20 * var(--u,1px));
  min-width:calc(330 * var(--u,1px));padding:calc(14 * var(--u,1px)) calc(20 * var(--u,1px));
  border-radius:calc(14 * var(--u,1px));font-size:calc(23 * var(--u,1px));line-height:1.35;
  background:linear-gradient(180deg,var(--pal-ui-winTop,#2c4fb8),var(--pal-ui-winBottom,#132a78));
  border:calc(4 * var(--u,1px)) solid var(--pal-ui-border,#f4f1ea);
  box-shadow:0 calc(6 * var(--u,1px)) calc(18 * var(--u,1px)) rgba(5,10,32,.55);
  color:var(--pal-ui-text,#fff);font-family:var(--dq-font,system-ui,sans-serif);text-shadow:0 2px 0 rgba(5,10,32,.6)}
.p20-card b{color:var(--pal-ui-cursor,#ffe98a)}
.p20-card .dim{color:var(--pal-ui-textDim,#c9d4f2);font-size:calc(19 * var(--u,1px))}
.p20-tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;
  font-family:var(--dq-font,system-ui,sans-serif);font-size:calc(17 * var(--u,1px));color:#fff;
  text-shadow:0 2px 0 rgba(5,10,32,.85),0 0 6px rgba(5,10,32,.9);pointer-events:none}
</style>
</head><body>
<canvas id="game-canvas"></canvas><div id="ui-root"></div>
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
</script>
<script type="module">
// DEMO — P20: every spell in CANON §7 and every effect in src/art/fx.js, fired on command over a warm meadow.
//
//   __DQ.fx('fire_burst')           one effect at the middle pad
//   __DQ.fxAt('lightning', x,y,z)   one effect anywhere
//   __DQ.showAll(band)              a BAND of 8 effects on a 4-wide grid with the camera at 14 units, so a pad is
//                                   ~128 px across and the quiet effects (dust, smoke, sparkle) can be judged.
//                                   4 bands cover the library; showAll() with no argument is band 0.
//   __DQ.tour(i)                    one pad, camera right on top of it (the closest look there is)
//   __DQ.cast('kascorcha')          a SPELL: looks its fx up in src/data/spells.js and plays it, with its sound
//   __DQ.castAll()                  all 28 spells in a ring, one every 120 ms
//   __DQ.spells()                   the audit: 28 spells, every school, nothing missing
//   __DQ.page(n)                    step through the effects six at a time (readable close-ups)
//   __DQ.fxHold('fire_burst', 90)   play it, then FREEZE the effect clock 90 ms in — a measurable still frame
//   __DQ.fxResume()                 let the clock run again
import * as THREE from 'three';
import { App } from '/src/engine/app.js';
import { Scenes } from '/src/engine/states.js';
import { Debug, reportError } from '/src/engine/debug.js';
import { Input } from '/src/engine/input.js';
import { PAL, C3, applyCssVars } from '/src/art/palette.js';
import { Toon, makeLightRig, makeFog } from '/src/art/toon.js';
import { FX } from '/src/art/fx.js';
import { SPELLS, list as spellList, audit, fxFor } from '/src/data/spells.js';
import { Sfx } from '/src/audio/sfx.js';
import { Audio } from '/src/audio/audio.js';

applyCssVars();
Input.init();
App.start({ canvas: document.getElementById('game-canvas'), version: '0.1.0-P20', beforeUpdate: Input.update });

const IDS = FX.ids();
const state = { last: null, page: 0, band: 0, mode: 'single', plays: 0, tags: [] };

// ── the little blue card, so a critic always knows what is on screen ────────────────────────────────────────
const card = document.createElement('div');
card.className = 'p20-card';
document.getElementById('ui-root').appendChild(card);
const tagLayer = document.createElement('div');
tagLayer.style.cssText = 'position:absolute;inset:0;pointer-events:none';
document.getElementById('ui-root').appendChild(tagLayer);
function setCard(title, sub) {
  const u = Math.min(innerWidth / 1280, innerHeight / 720);
  card.style.setProperty('--u', u + 'px');
  tagLayer.style.setProperty('--u', u + 'px');
  card.innerHTML = `<b>${title}</b><br><span class="dim">${sub}</span>`;
}
setCard('P20 — spells &amp; VFX', `${IDS.length} effects · ${spellList().length} spells`);

// ── where things stand ──────────────────────────────────────────────────────────────────────────────────────
// 4 wide, 2 deep, one BAND per screenshot. At 14 units a 1.8-unit pad projects ~128 px across, which is what it
// takes to judge footstep_dust or chest_sparkle; the old 6-wide grid at 21 units gave 72 px and hid them.
const GRID = { cols: 4, rows: 2, gapX: 4.7, gapZ: 4.5, dist: 14 };
const PER_BAND = GRID.cols * GRID.rows;
function padAt(i) {
  const c = i % GRID.cols, r = ((i / GRID.cols) | 0) % GRID.rows;
  return { x: (c - (GRID.cols - 1) / 2) * GRID.gapX, y: 0, z: (r - (GRID.rows - 1) / 2) * GRID.gapZ };
}
const BANDS = Math.ceil(IDS.length / PER_BAND);

Scenes.register('demo', () => {
  const scene = new THREE.Scene();
  scene.background = C3(PAL.sky.page);
  const camera = new THREE.PerspectiveCamera(46, App.aspect(), 0.3, 1400);
  let offResize = null, t = 0, shakes = 0;
  const cam = { orbit: 0, zoom: 1, tx: 0, tz: 0, ty: 1.4, dist: 11, shakeAmp: 0, shakeMs: 0, shakeT: 0, ox: 0, oy: 0 };

  return {
    opaque: true,
    enter() {
      offResize = App.onResize(() => { camera.aspect = App.aspect(); camera.updateProjectionMatrix(); });
      try {
        makeLightRig({ scene, preset: 'day', extent: 40 });
        makeFog(scene, 'day');
        // a gentle meadow to stand the effects on, so nothing is judged against black
        const g = new THREE.CircleGeometry(60, 56); g.rotateX(-Math.PI / 2);
        const ground = new THREE.Mesh(g, Toon.surface('grass', { worldPlanar: true }));
        ground.receiveShadow = true; ground.name = 'meadow';
        scene.add(ground);
        const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 26, 16),
          new THREE.MeshBasicMaterial({ color: C3(PAL.sky.upper), side: THREE.BackSide, fog: false }));
        scene.add(sky);
        // pale stone pads mark where each effect will go
        const padGeo = new THREE.CylinderGeometry(0.85, 0.9, 0.12, 26);
        const padMat = Toon.surface ? Toon.surface('stone') : new THREE.MeshLambertMaterial({ color: C3(PAL.stone.mid) });
        const pads = new THREE.InstancedMesh(padGeo, padMat, PER_BAND);
        pads.name = 'pads'; pads.receiveShadow = true; pads.castShadow = false;
        const m = new THREE.Matrix4();
        for (let i = 0; i < PER_BAND; i++) { const p = padAt(i); m.makeTranslation(p.x, 0.06, p.z); pads.setMatrixAt(i, m); }
        pads.count = 0;                                     // only shown in showAll
        scene.add(pads);
        scene.userData.pads = pads;
        // cap 1400: castAll and a band of eight together put ~600 particles in flight, and the pool must never drop
        FX.attach(scene, { cap: 1400, camera, sound: (id, o) => { try { if (Audio.ready) Sfx.play(id, o); } catch (_) {} } });
        // WEIGHT: the heavy effects ask for a camera shake (FX.setShake). In the real game src/world/camera.js (P09)
        // and the battle rig (P15) must answer it off the Bus event fx.shake; here the demo answers it itself, so the
        // ask is provably wired end to end and a critic can see the camera move on a Kascorcha.
        FX.setShake(({ amp, ms }) => { cam.shakeAmp = Math.max(cam.shakeAmp || 0, +amp || 0); cam.shakeMs = Math.max(cam.shakeMs || 0, +ms || 200); cam.shakeT = 0; shakes++; });
      } catch (e) { reportError('P20 demo build', e); }
    },
    exit() { if (offResize) offResize(); FX.detach(); },
    update(dt) {
      t += dt;
      // the shake FX asked for: a fast decaying wobble across the view, exactly what P09/P15 should do off the Bus
      cam.ox = cam.oy = 0;
      if (cam.shakeAmp > 0) {
        cam.shakeT += dt * 1000;
        const k = Math.max(0, 1 - cam.shakeT / cam.shakeMs);
        if (k <= 0) { cam.shakeAmp = 0; }
        else {
          const w = cam.shakeAmp * k * k;
          cam.ox = Math.sin(cam.shakeT * 0.075) * w * 0.7;
          cam.oy = Math.cos(cam.shakeT * 0.093) * w * 0.5;
        }
      }
      const a = cam.orbit * Math.PI / 180;
      const d = cam.dist * cam.zoom;
      camera.position.set(cam.tx + Math.sin(a) * d + cam.ox, 6.4 * cam.zoom + cam.oy, cam.tz + Math.cos(a) * d);
      camera.lookAt(cam.tx + cam.ox * 0.5, cam.ty + cam.oy * 0.5, cam.tz);
      FX.setCamera(camera);
      FX.update(dt);
      layTags(camera);
    },
    render() { App.render(scene, camera); },
    onInput() { return true; },
    cam, scene, shookAt() { return { shakes, amp: cam.shakeAmp, ox: +cam.ox.toFixed(4), oy: +cam.oy.toFixed(4) }; },
  };
});
Scenes.push('demo');
const S = () => Scenes.topScene();

let tagKey = '';
function layTags(camera) {
  if (!state.tags.length) { if (tagLayer.childElementCount) { tagLayer.innerHTML = ''; tagKey = ''; } return; }
  const key = state.tags.map((x) => x.text).join('|');
  if (key !== tagKey) {
    tagKey = key;
    tagLayer.innerHTML = state.tags.map((x) => `<div class="p20-tag">${x.text}</div>`).join('');
  }
  const v = new THREE.Vector3();
  const kids = tagLayer.children;
  for (let i = 0; i < state.tags.length; i++) {
    const p = state.tags[i];
    v.set(p.x, p.y, p.z).project(camera);
    const el = kids[i];
    if (!el) continue;
    el.style.left = ((v.x * 0.5 + 0.5) * innerWidth) + 'px';
    el.style.top = ((-v.y * 0.5 + 0.5) * innerHeight) + 'px';
    el.style.opacity = v.z > 1 ? '0' : '1';
  }
}

function camTo(x, z, dist, orbit) {
  const s = S(); if (!s || !s.cam) return;
  s.cam.tx = x; s.cam.tz = z; s.cam.dist = dist; if (orbit != null) s.cam.orbit = orbit;
}
function showPads(n) { const s = S(); if (s && s.scene && s.scene.userData.pads) s.scene.userData.pads.count = n; }

// ── the controls a critic drives ────────────────────────────────────────────────────────────────────────────
function one(id, at, scale) {
  const r = FX.play(id, { at: at || { x: 0, y: 0.6, z: 0 }, scale: scale || 1, dir: { x: 0, z: -1 } });
  state.last = r.id; state.plays++;
  return r;
}

const TALL = { lightning: 15, level_pillar: 16, holy_light: 11, warp_swirl: 11, frost: 9, fire_big: 9.5, lantern_glow: 10 };
Debug.expose('fx', (id, o) => { state.mode = 'single'; state.tags = []; showPads(0); FX.pause(false); camTo(0, 0, TALL[id] || 8.5);
  const r = FX.play(id, Object.assign({ at: { x: 0, y: 0.6, z: 0 }, dir: { x: 0, z: -1 } }, o || {}));
  state.last = r.id; state.plays++; setCard(r.ok ? r.id : `unknown "${id}"`, FX.spec(id) ? `sound: ${FX.spec(id).sfx || 'none'} · ${FX.spec(id).ms} ms` : 'not an effect');
  return r; });

Debug.expose('fxAt', (id, x, y, z, scale) => one(id, { x, y, z }, scale));

Debug.expose('showAll', (band) => {
  state.mode = 'all';
  state.band = ((band | 0) % BANDS + BANDS) % BANDS;
  const slice = IDS.slice(state.band * PER_BAND, state.band * PER_BAND + PER_BAND);
  FX.pause(false);
  showPads(slice.length);
  camTo(0, 0, GRID.dist, 0);
  state.tags = slice.map((id, i) => { const p = padAt(i); return { x: p.x, y: 0.2, z: p.z, text: id }; });
  slice.forEach((id, i) => { const p = padAt(i); FX.play(id, { at: { x: p.x, y: 0.35, z: p.z }, scale: 0.9, dir: { x: 0, z: -1 }, sound: false, flash: false }); });
  state.plays += slice.length;
  setCard(`effects — band ${state.band + 1} of ${BANDS}`, `${slice.length} of ${IDS.length}, a pad is ~128 px across`);
  return { band: state.band, bands: BANDS, effects: slice.length, ids: slice, total: IDS.length };
});

/** The closest look there is: one pad, camera 4.5 units off it. */
Debug.expose('tour', (i) => {
  const n = ((i | 0) % IDS.length + IDS.length) % IDS.length;
  const id = IDS[n];
  state.mode = 'tour'; state.last = id;
  FX.pause(false); FX.clear();
  showPads(0);                                            // the band pads are laid out off-centre; no pad here
  camTo(0, 0, TALL[id] ? TALL[id] * 0.55 : 4.6, 0);
  state.tags = [];
  FX.play(id, { at: { x: 0, y: 0.35, z: 0 }, scale: 0.9, dir: { x: 0, z: -1 }, sound: false, flash: false });
  state.plays++;
  setCard(`${n + 1} / ${IDS.length} — ${id}`, 'camera right on the pad');
  return { i: n, id, of: IDS.length };
});

Debug.expose('page', (n) => {
  state.mode = 'page';
  const per = 6, pages = Math.ceil(IDS.length / per);
  state.page = ((n | 0) % pages + pages) % pages;
  const slice = IDS.slice(state.page * per, state.page * per + per);
  FX.pause(false);
  showPads(0);
  camTo(0, 0, 10.5, 0);
  state.tags = slice.map((id, i) => { const x = (i % 3 - 1) * 4.2, z = ((i / 3) | 0) * 4.0 - 2.0; return { x, y: 0.2, z, text: id }; });
  slice.forEach((id, i) => { const x = (i % 3 - 1) * 4.2, z = ((i / 3) | 0) * 4.0 - 2.0;
    FX.play(id, { at: { x, y: 0.4, z }, scale: 0.95, dir: { x: 0, z: -1 }, sound: false, flash: false }); });
  state.plays += slice.length;
  setCard(`effects ${state.page + 1} / ${pages}`, slice.join(' · '));
  return { page: state.page, pages, ids: slice };
});

Debug.expose('cast', (id) => {
  const sp = SPELLS[id];
  if (!sp) return { ok: false, unknown: id };
  const f = fxFor(id);
  state.mode = 'spell'; state.tags = []; showPads(0); camTo(0, 0, TALL[f.fx] || 8.5);
  FX.play(f.fx, { at: { x: 0, y: 0.6, z: 0 }, scale: f.scale, dir: { x: 0, z: -1 }, sound: f.sfx });
  state.last = f.fx; state.plays++;
  setCard(sp.name, `${sp.blurb} <br>${sp.mp} MP · ${sp.school} · fx ${f.fx}`);
  return { ok: true, id, fx: f.fx, sfx: f.sfx, mp: sp.mp, school: sp.school };
});

Debug.expose('castAll', () => {
  const all = spellList();
  state.mode = 'spells'; showPads(0); camTo(0, 0, 19, 0);
  state.tags = all.map((sp, i) => { const a = i / all.length * Math.PI * 2, R = 7.4;
    return { x: Math.sin(a) * R, y: 0.2, z: Math.cos(a) * R, text: sp.name }; });
  all.forEach((sp, i) => {
    const a = i / all.length * Math.PI * 2, R = 7.4;
    const f = fxFor(sp.id);
    setTimeout(() => { try { FX.play(f.fx, { at: { x: Math.sin(a) * R, y: 0.4, z: Math.cos(a) * R }, scale: 0.7, dir: { x: Math.sin(a), z: Math.cos(a) }, sound: false, flash: false }); } catch (_) {} }, i * 40);
  });
  state.plays += all.length;
  setCard('all 28 spells', all.map((s) => s.name).join(' · '));
  return { spells: all.length };
});

Debug.expose('travel', (id) => {
  state.mode = 'travel'; showPads(0); camTo(0, 0, 9.5, 20);
  const from = { x: -4.5, y: 1.0, z: 3.2 }, to = { x: 3.2, y: 0.7, z: -2.0 };
  state.tags = [{ x: from.x, y: 1.6, z: from.z, text: 'caster' }, { x: to.x, y: 1.4, z: to.z, text: 'monster' }];
  const r = FX.play(id || 'fire_burst', { at: to, from, travelMs: 260, scale: 1, sound: false, flash: false });
  state.last = r.id; state.plays++;
  setCard('a spell that flies', `${r.id} leaves the caster and lands ${r.travelMs} ms later`);
  return r;
});
// hold an effect still at a chosen millisecond so a critic can MEASURE the frame rather than race it
Debug.expose('fxSpec', (id) => FX.spec(id));
Debug.expose('fxHold', (id, ms, o) => {
  state.mode = 'hold'; state.tags = []; showPads(0); camTo(0, 0, TALL[id] || 8.5);
  FX.pause(false); FX.clear();
  const r = FX.play(id, Object.assign({ at: { x: 0, y: 0.6, z: 0 }, dir: { x: 0, z: -1 }, sound: false, flash: false }, o || {}));
  FX.pause(true);
  FX.step(ms != null ? ms : (r.peak || 90));
  state.last = r.id; state.plays++;
  setCard(`${r.id} held`, `frozen ${ms != null ? ms : r.peak} ms in · fxResume() to let it run`);
  return r;
});
Debug.expose('fxResume', () => { FX.pause(false); return true; });
Debug.expose('shakeState', () => { const s = S(); return s && s.shookAt ? s.shookAt() : null; });
Debug.expose('spells', () => audit());
Debug.expose('spellTable', () => spellList().map((s) => ({ id: s.id, name: s.name, mp: s.mp, school: s.school, kind: s.kind, target: s.target, fx: s.fx, sfx: s.sfx })));
Debug.expose('fxClear', () => { FX.pause(false); FX.clear(); state.tags = []; return true; });
Debug.expose('orbit', (deg) => { const s = S(); if (s && s.cam) s.cam.orbit = +deg || 0; return deg; });
Debug.implement('cameraOrbit', (deg) => { const s = S(); if (s && s.cam) s.cam.orbit = +deg || 0; return deg; });
Debug.implement('cameraZoom', (n) => { const s = S(); if (s && s.cam) s.cam.zoom = Math.max(0.35, Math.min(3, +n || 1)); return n; });

Debug.provide('demo', () => { const s = S(); return { piece: 'P20', mode: state.mode, last: state.last, plays: state.plays,
  effects: IDS.length, bands: BANDS, band: state.band, spells: spellList().length, audit: audit().problems.length,
  shake: s && s.shookAt ? s.shookAt() : null }; });
Debug.provide('fx', () => FX.state());
</script></body></html>
