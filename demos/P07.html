<canvas id="game-canvas"></canvas>
<div id="ui-root">

<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }

<script type="module">
// P07 + P08 — every character on a little village green in the locked house style. Scenery is built with the
// integrator's scenery kit (F3 materials only); the characters are src/art/chars.js animated by src/art/anim.js.
import * as THREE from 'three';
import { App } from '/src/engine/app.js';
import { Scenes } from '/src/engine/states.js';
import { Loop } from '/src/engine/loop.js';
import { Debug, reportError } from '/src/engine/debug.js';
import { PAL, css, smooth, applyCssVars } from '/src/art/palette.js';
import { Tex, mulberry, vnoise } from '/src/art/tex.js';
import { Toon, makeToon, makeLightRig, makeAOMask, makeBlobShadows } from '/src/art/toon.js';
import { createKit, buildSky, ringHill, buildGround, paintMasks, OAK, BUSH, POPLAR } from '/src/world/scenery.js';
import { Chars } from '/src/art/chars.js';

applyCssVars();
document.documentElement.style.setProperty('--p07-shadow', css(PAL.ui.shadow, 0.45));
document.documentElement.style.setProperty('--p07-inner', css(PAL.ui.border, 0.35));

const TAU = Math.PI * 2, DEG = Math.PI / 180;
const LOOKS = {
  'hero|6': 'Round-headed boy in a too-big green travelling cloak, half a green ribbon knotted on his left wrist.',
  'hero|26': 'Grown broad and sun-browned, still wearing that frayed green ribbon.',
  'halvard': 'Enormous shaggy bear of a man in a patched blue surcoat, grey at the temples, greatsword carried like a walking stick.',
  'willow': 'Straw-blonde plait with one green ribbon, sunburnt, scabby-kneed, slingshot in her pocket.',
  'sera': 'Small and dark-eyed in good clothes you cannot climb in.',
  'barty': 'Small, wide, bald old man in an apron worn over armour, a ladle in his belt where a dagger should be.',
  'farmer': 'Straw hat, dungarees, a stalk of hay and a pitchfork.', 'baker': 'Tall puffy hat, flour on the apron, a loaf he is proud of.',
  'granny': 'Spectacles, a bun, a knitted shawl and a cane she mostly waves.', 'child': 'Ginger, freckled, cap on crooked, a lollipop.',
  'guard': 'Kettle helmet, red plume, a spear, and a moustache that means business.', 'innkeeper': 'A handlebar moustache, a waistcoat, and a tankard.',
  'nun': 'A kind face in a white wimple, hands folded.', 'merchant': 'A turban, a feather, and a mountain of pans on his back.',
};

// ── the green ────────────────────────────────────────────────────────────────────────────────────────────────
const TRACK = { x: 0, z: 6.4, r: 3.9 };
const STAGE = { x: 0, z: TRACK.z - TRACK.r };
function heightAt(x, z) {
  const r = Math.hypot(x, z * 1.1);
  return smooth(12, 34, r) * (1.4 + 2.6 * vnoise(x * 0.06 + 3, z * 0.06 + 7, 5)) + smooth(34, 70, r) * 4 + (1 - smooth(12, 20, r)) * 0.0;
}
let scene, camera, rig, sky, kit, blobs, stool;
const cast = [];
const S = { mode: 'cast', focus: -1, orbit: 0, zoom: 1, speed: 0, treadmill: false, theta: 0, life: true, lifeT: 1.5, camYaw: 0, camT: new THREE.Vector3(), camInit: false, lastPlay: 'idle', buildMs: 0 };

function build() {
  const t0 = performance.now();
  scene = new THREE.Scene(); scene.name = 'P07 green';
  camera = new THREE.PerspectiveCamera(40, App.aspect(), 0.1, 1400);
  rig = makeLightRig({ scene, preset: 'day', extent: 16 });
  sky = buildSky(scene, rig);
  ringHill(scene, 'mid', 110, 145, 200, 6, 24, 71, PAL.hill.midLow, PAL.hill.mid, 0.2);
  ringHill(scene, 'far', 240, 300, 380, 14, 80, 81, PAL.hill.farLow, PAL.hill.far, 0.25, { fogged: false, peaky: 1.7 });
  const circle = []; for (let i = 0; i <= 96; i++) { const a = (i / 96) * TAU; circle.push([TRACK.x + Math.sin(a) * TRACK.r, TRACK.z - Math.cos(a) * TRACK.r]); }
  const lane = []; for (let i = 0; i <= 40; i++) { const t = i / 40; lane.push([Math.sin(t * 3) * 1.4 + 0.4, TRACK.z + TRACK.r + t * 34]); }
  const back = []; for (let i = 0; i <= 30; i++) { const t = i / 30; back.push([-2 + t * 1.5 + Math.sin(t * 4) * 1.2, -7.5 - t * 22]); }
  const masks = paintMasks({ N: 1024, span: 96, center: [0, 0], strokes: [{ pts: circle, w: 1.5, channel: 0 }, { pts: lane, w: 1.8, channel: 0 }, { pts: back, w: 1.7, channel: 0 }] });
  const ao = makeAOMask({ span: 96, size: 1024, center: [0, 0] });
  kit = createKit({ scene, heightAt, ao });
  kit.cottage({ x: -9.5, z: -14.5, rot: 0.35, W: 5.0, D: 3.8, H: 2.3, roof: 'thatch', pitch: 0.74, doorX: -0.4, frontWindows: [1.3], sideWindows: [0], shutter: PAL.paint.shutterGreen, chimney: 'stone', chimneyX: -1.2 });
  kit.cottage({ x: 3.5, z: -17.5, rot: -0.05, W: 5.6, D: 4.0, H: 2.5, roof: 'tile', pitch: 0.6, doorX: 0, frontWindows: [-1.7, 1.7], sideWindows: [0], shutter: PAL.paint.shutterBlue, chimney: 'brick', chimneyX: 1.6 });
  kit.cottage({ x: 15.5, z: -12.5, rot: -0.6, W: 4.6, D: 3.7, H: 2.3, roof: 'thatch', pitch: 0.74, doorX: 0.5, frontWindows: [-1.2], sideWindows: [], shutter: PAL.paint.shutterGreen, chimney: 'stone', chimneyX: 1.0 });
  kit.picket([[-13.5, -10.6], [-10.5, -9.4], [-7.2, -9.2]]);
  kit.flowerBed(-11.2, -10.9, 3.0, 0.9, 0.35, 7);
  kit.bench(8.6, -7.8, -0.35);
  kit.barrel(-6.4, -11.4, 1, 0.3); kit.barrel(-5.6, -12.3, 0.9, 1.1); kit.crate(6.6, -13.2, 0.4);
  kit.woodpile(19.5, -8.5, -0.7);
  kit.fence([[-20, 4], [-17, -3], [-15.5, -8]], { seed: 4 });
  const R = mulberry(4242), oak = [], poplar = [], bush = [];
  for (const [x, z, s] of [[-17.5, -17, 1.2], [-22, -6, 1.1], [-19, 9, 1.25], [21, -20, 1.2], [24, -4, 1.15], [20, 12, 1.1], [-8, -24, 1.0], [11, -26, 1.2], [-26, 18, 1.1], [27, 20, 1.2]]) oak.push({ x, z, s, r: R() * TAU, c: 0.88 + R() * 0.2 });
  for (const [x, z, s] of [[-13, -20, 1.0], [9.5, -21, 1.1], [17.5, -16, 0.95]]) poplar.push({ x, z, s, r: R() * TAU, c: 0.9 + R() * 0.15 });
  for (const [x, z, s] of [[-12.5, -7.5, 0.8], [11.5, -9.5, 0.9], [-15, 2, 0.8], [14.5, 3.5, 0.85], [-1.5, -12.5, 0.7], [7.5, -10.5, 0.65], [-9, 12, 0.8], [10, 13, 0.9]]) bush.push({ x, z, s, r: R() * TAU, c: 0.9 + R() * 0.15 });
  kit.forest('oak', OAK, oak, { detail: 1, spherize: 0.72, trunkH: 1.7 });
  kit.forest('poplar', POPLAR, poplar, { detail: 1, spherize: 0.6, trunkH: 1.3, light: PAL.foliage.light });
  kit.forest('bush', BUSH, bush, { detail: 1, spherize: 0.6, trunkH: 0, light: PAL.foliage.light, wind: 0.02, windBase: 0.2, shadows: false, aoR: 1.1, aoS: 0.55 });
  kit.forestBelt({ radius: 44, rows: 3, rowGap: 6.5, seed: 777, threshold: 0.4, step: 0.075 });
  kit.flush();
  const pathAt = (x, z) => masks.sample(0, x, z);
  const clearOfCast = (x, z) => !(Math.abs(x) < 11.5 && z > -7.5 && z < 0.8) && Math.hypot(x - TRACK.x, z - TRACK.z) > TRACK.r + 4.5;
  kit.tufts({ count: 650, radius: 34, seed: 999, accept: (x, z) => pathAt(x, z) < 0.3 && clearOfCast(x, z), rimOf: (x, z) => { const p = pathAt(x, z); return smooth(0.08, 0.3, p) * (1 - smooth(0.3, 0.42, p)); } });
  const clusters = [{ x: 5.5, z: 1.5, hue: PAL.flower.yellow, n: 14 }, { x: -6.5, z: 2.5, hue: PAL.flower.white, n: 16 }, { x: 0.2, z: 6.4, hue: PAL.flower.pink, n: 10 }, { x: 7.5, z: 9, hue: PAL.flower.white, n: 14 }, { x: -7, z: 9.5, hue: PAL.flower.blue, n: 12 }, { x: -12, z: -4, hue: PAL.flower.yellow, n: 14 }, { x: 12.5, z: -3.5, hue: PAL.flower.pink, n: 14 }];
  kit.flowers(clusters, { accept: (x, z) => pathAt(x, z) < 0.2 && clearOfCast(x, z) });
  buildGround(scene, { heightAt, masks, ao, inner: 40, step: 0.9, outer: 132, rings: 9 });
  kit.birds(3, { centre: [0, -6], height: 12, radius: 16, seed: 91 });
  kit.butterflies([{ x: 5, z: 1.5, hue: PAL.flower.yellow }, { x: -6.5, z: 3, hue: PAL.char.white }, { x: 7, z: 9, hue: PAL.flower.pink }]);
  blobs = makeBlobShadows(24, { opacity: 0.42 });
  scene.add(blobs.mesh);
  // a stool for the sit clip
  const wood = makeToon({ color: new THREE.Color(PAL.wood.light) }, 'wood');
  stool = new THREE.Group();
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.06, 14), wood); top.position.y = -0.03; top.castShadow = true; stool.add(top);
  for (let i = 0; i < 3; i++) { const a = (i / 3) * TAU; const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 1, 6), wood); leg.position.set(Math.sin(a) * 0.13, -0.5, Math.cos(a) * 0.13); leg.castShadow = true; stool.add(leg); }
  stool.visible = false; scene.add(stool);

  // ── the cast: the family in front, the villagers behind ──
  const front = [{ id: 'hero', age: 26 }, { id: 'halvard' }, { id: 'hero', age: 6 }, { id: 'willow' }, { id: 'sera' }, { id: 'barty' }];
  const backRow = Chars.variants('villager').map(v => ({ id: 'villager', variant: v }));
  front.forEach((d, i) => addCast(d, (i - (front.length - 1) / 2) * 1.75, -2.6));
  backRow.forEach((d, i) => addCast(d, (i - (backRow.length - 1) / 2) * 1.62 + 0.4, -5.4));
  S.buildMs = Math.round(performance.now() - t0);
}

function addCast(d, x, z) {
  const ch = Chars.build(d.id, { age: d.age, variant: d.variant });
  const yaw = Math.atan2(-x * 0.12, 1);
  const e = { d, ch, slot: { x, z: z + x * x * 0.012, yaw }, key: d.variant || (d.id === 'hero' ? `hero|${d.age}` : d.id) };
  ch.root.position.set(e.slot.x, heightAt(e.slot.x, e.slot.z), e.slot.z);
  ch.setFacing(yaw, true);
  scene.add(ch.root);
  cast.push(e);
}

// ── modes ────────────────────────────────────────────────────────────────────────────────────────────────────
function findCast(id, arg) {
  const want = String(id || '').toLowerCase();
  let best = -1;
  cast.forEach((e, i) => {
    if (best >= 0) return;
    if (e.key === want) best = i;
    else if (e.d.id === want && (arg == null || e.d.variant === arg || (e.d.id === 'hero' && ((+arg < 12 || /boy|child/.test(String(arg))) ? e.d.age === 6 : e.d.age === 26)))) best = i;
    else if (e.d.variant === want) best = i;
  });
  return best;
}
function resetToSlot(e) {
  e.ch.setMove(0); e.ch.play('idle', { fade: 0.1 });
  e.ch.root.position.set(e.slot.x, heightAt(e.slot.x, e.slot.z), e.slot.z);
  e.ch.setFacing(e.slot.yaw, true);
}
function show(id, arg) {
  const i = findCast(id, arg);
  if (i < 0) return { ok: false, reason: 'no such character', known: cast.map(e => e.key) };
  if (S.focus >= 0 && S.focus !== i) resetToSlot(cast[S.focus]);
  S.mode = 'focus'; S.focus = i; S.speed = 0; S.theta = 0; S.camInit = false; S.lastPlay = 'idle';
  const e = cast[i];
  e.ch.setMove(0); e.ch.play('idle', { fade: 0.05 });
  e.ch.root.position.set(STAGE.x, heightAt(STAGE.x, STAGE.z), STAGE.z);
  e.ch.setFacing(0, true);
  label();
  return { ok: true, label: e.ch.label, height: +e.ch.height.toFixed(3) };
}
function showCast() {
  if (S.focus >= 0) resetToSlot(cast[S.focus]);
  S.mode = 'cast'; S.focus = -1; S.speed = 0; S.camInit = false; S.lastPlay = 'idle';
  for (const e of cast) resetToSlot(e);
  label();
  return cast.map(e => e.ch.label);
}
function label() {
  const n = document.getElementById('t-name'), l = document.getElementById('t-look');
  if (S.mode === 'cast') { n.innerHTML = 'The cast of <b>Puddlewick</b>'; l.textContent = 'Everyone out on the green on a sunny morning.'; return; }
  const e = cast[S.focus];
  n.innerHTML = `<b>${e.ch.label}</b>`;
  l.textContent = LOOKS[e.key] || LOOKS[e.d.id] || '';
}
const focused = () => (S.focus >= 0 ? cast[S.focus] : null);

// ── per frame ────────────────────────────────────────────────────────────────────────────────────────────────
const tmpV = new THREE.Vector3(), tgt = new THREE.Vector3();
function update(dt) {
  const t = App.clock.time;
  const f = focused();
  if (f && S.speed > 0.01 && !S.treadmill) {
    // walk the dirt ring
    S.theta += (S.speed * dt) / TRACK.r;
    const x = TRACK.x + Math.sin(S.theta) * TRACK.r, z = TRACK.z - Math.cos(S.theta) * TRACK.r;
    f.ch.root.position.set(x, heightAt(x, z), z);
    f.ch.setFacing(Math.atan2(Math.cos(S.theta), Math.sin(S.theta)));
  }
  if (S.mode === 'cast' && S.life) {
    S.lifeT -= dt;
    if (S.lifeT <= 0) {
      S.lifeT = 1.4 + ((Math.sin(t * 12.9898) * 43758.5453) % 1 + 1) % 1 * 1.6;
      const e = cast[Math.floor(((Math.sin(t * 78.233) * 43758.5453) % 1 + 1) % 1 * cast.length)];
      const acts = ['wave', 'nod', 'talk', 'surprised', 'wave', 'nod'];
      const a = acts[Math.floor(((Math.sin(t * 3.17) * 9173.13) % 1 + 1) % 1 * acts.length)];
      if (e && !e.ch.anim.state().action) { if (a === 'talk') { e.ch.play('talk'); setTimeout(() => e.ch.stop(0.4), 2400); } else e.ch.play(a); }
    }
  }
  let bi = 0;
  for (const e of cast) {
    e.ch.update(dt);
    const p = e.ch.root.position;
    if (bi < blobs.capacity) blobs.set(bi++, p.x, heightAt(p.x, p.z), p.z, 0.75 * Math.max(0.75, e.ch.height / 1.6) + (e.ch.clip === 'sleep' ? 0.5 : 0));
  }
  blobs.commit();
  // stool under a sitter
  if (f && f.ch.clip === 'sit') {
    const m = f.ch.metrics, seat = m.L2 + m.ankle;
    const p = f.ch.root.position, yaw = f.ch.facing;
    stool.visible = true; stool.position.set(p.x - Math.sin(yaw) * 0.06, p.y + seat - 0.02, p.z - Math.cos(yaw) * 0.06);
    stool.scale.set(1, seat, 1); stool.children[0].scale.y = 1 / seat; stool.children[0].position.y = -0.03 / seat;
  } else stool.visible = false;
  kit.update(t, dt, camera);
  const clip = f ? f.ch.clip : 'cast';
  const el = document.getElementById('t-clip'); if (el.textContent !== clip) el.textContent = clip;
}

function placeCamera(dt) {
  const f = focused();
  let yaw, pitch, dist, fov = 40;
  if (f) {
    const h = f.ch.height;
    tgt.copy(f.ch.root.position); tgt.y += h * 0.52;
    yaw = (S.speed > 0.05 && !S.treadmill ? f.ch.facing : 0) + S.orbit * DEG; pitch = 9 * DEG; dist = (h * 2.3 + 1.4) * S.zoom; fov = 38;
    if (f.ch.clip === 'sleep') { tgt.y = f.ch.root.position.y + 0.25; pitch = 32 * DEG; }
  } else {
    tgt.set(0, 1.0, -3.6); yaw = S.orbit * DEG; pitch = 11 * DEG; dist = 15.5 * S.zoom; fov = 40;
  }
  if (!S.camInit) { S.camT.copy(tgt); S.camYaw = yaw; S.camInit = true; }
  const k = Math.min(1, dt * 8);
  S.camT.lerp(tgt, k);
  let dy = yaw - S.camYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  S.camYaw += dy * Math.min(1, dt * 6);
  camera.fov = fov; camera.aspect = App.aspect(); camera.updateProjectionMatrix();
  camera.position.set(S.camT.x + Math.sin(S.camYaw) * Math.cos(pitch) * dist, S.camT.y + Math.sin(pitch) * dist, S.camT.z + Math.cos(S.camYaw) * Math.cos(pitch) * dist);
  const gy = heightAt(camera.position.x, camera.position.z) + 0.3; if (camera.position.y < gy) camera.position.y = gy;
  camera.lookAt(S.camT);
}

let lastRenderT = -1;
Scenes.register('stage', {
  opaque: true,
  enter() { try { build(); } catch (e) { reportError('P07 build', e); } },
  update(dt) { if (scene) { try { update(dt); } catch (e) { reportError('P07 update', e); } } },
  render() {
    if (!scene) return;
    const t = App.clock.time;
    const dt = lastRenderT < 0 ? 1 / 60 : Math.min(0.1, Math.max(0, t - lastRenderT)); lastRenderT = t;
    Toon.tick(t);
    placeCamera(dt || 1 / 60);
    rig.follow(S.camT);
    sky.sky.position.copy(camera.position);
    sky.clouds.rotation.y = t * 0.003;
    App.render(scene, camera);
  },
});

App.start({ version: '0.1.0-p07-demo' });
Scenes.push('stage');

// ── critic controls ──────────────────────────────────────────────────────────────────────────────────────────
Debug.implement('cameraOrbit', (deg) => { if (deg === undefined) return S.orbit; S.orbit = +deg || 0; return S.orbit; });
Debug.implement('cameraZoom', (n) => { if (n === undefined) return S.zoom; S.zoom = Math.max(0.3, Math.min(4, +n || 1)); return S.zoom; });
Debug.expose('show', (id, age) => show(id, age));
Debug.expose('cast', () => showCast());
Debug.expose('play', (name, opts = {}) => {
  S.lastPlay = name;
  const targets = S.mode === 'cast' ? cast : [focused()];
  let ok = false;
  for (const e of targets) {
    if (!e) continue;
    if (name === 'walk' || name === 'run') { if (S.mode === 'focus') { S.speed = name === 'run' ? 5.4 : 2.0; e.ch.setMove(S.treadmill ? 0 : S.speed, { run: name === 'run' }); if (S.treadmill) e.ch.play(name); ok = true; continue; } e.ch.play(name); ok = true; continue; }
    if (name === 'idle') { S.speed = 0; e.ch.setMove(0); }
    ok = e.ch.play(name, opts) || ok;
  }
  return ok;
});
Debug.expose('pose', (name, opts) => window.__DQ.play(name, opts));
Debug.expose('setMove', (speed, opts = {}) => {
  const f = focused(); if (!f) return { ok: false, reason: 'show(id) a character first' };
  S.speed = Math.max(0, +speed || 0);
  if (S.treadmill) { f.ch.setMove(0); f.ch.play(S.speed > 4.4 ? 'run' : S.speed > 0.05 ? 'walk' : 'idle'); }
  else f.ch.setMove(S.speed, opts);
  return S.speed;
});
Debug.expose('treadmill', (on = true) => { S.treadmill = !!on; const f = focused(); if (f && S.speed > 0) { window.__DQ.setMove(S.speed); } return S.treadmill; });
Debug.expose('turn', (deg = 180) => { const f = focused(); if (!f) return false; f.ch.setFacing(f.ch.facing + deg * DEG); return true; });
Debug.expose('face', (deg = 0) => { const f = focused(); if (!f) return false; f.ch.setFacing(deg * DEG); return true; });
Debug.expose('emote', (name) => { const targets = S.mode === 'cast' ? cast : [focused()]; return targets.map(e => e && e.ch.emote(name)); });
Debug.expose('life', (on = true) => { S.life = !!on; return S.life; });
Debug.expose('list', () => ({ cast: cast.map(e => ({ key: e.key, id: e.d.id, age: e.d.age ?? null, variant: e.d.variant ?? null, label: e.ch.label })), clips: Chars.CLIPS, emotes: Chars.EMOTES, ids: Chars.list(), variants: Chars.variants('villager') }));
Debug.expose('ui', (on = true) => { for (const id of ['title', 'clip']) document.getElementById(id).hidden = !on; return on; });
Debug.expose('charStats', () => Chars.stats());
/** Build every look fresh, run each clip for a moment, dispose: proves the contract end to end. */
Debug.expose('buildTest', () => {
  const out = { built: 0, clips: 0, disposed: 0, heights: {} };
  for (const c of Chars.catalog()) {
    const ch = Chars.build(c.id, { age: c.age, variant: c.variant });
    scene.add(ch.root); ch.root.position.set(0, -50, 0);
    out.built++; out.heights[c.variant || `${c.id}|${c.age}`] = +ch.height.toFixed(2);
    ch.setFacing(1.2); ch.setMove(3); for (let i = 0; i < 20; i++) ch.update(1 / 60);
    ch.setMove(0);
    for (const clip of Chars.CLIPS) { if (ch.play(clip)) out.clips++; ch.update(1 / 30); }
    ch.emote('love'); ch.update(1 / 30);
    ch.dispose(); out.disposed++;
  }
  return out;
});
Debug.provide('chars', () => {
  const f = focused();
  const info = App.renderer ? App.renderer.info.render : {};

    castSize: cast.length, castClips: cast.map(e => e.ch.clip), fps: Loop.fps, calls: info.calls, triangles: info.triangles,
    drawCallsPerChar: cast.map(e => e.ch.drawCalls), buildMs: S.buildMs,
  };
});
