<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>DEMO — F1 engine spine</title>
<link rel="stylesheet" href="/src/ui/ui.css"/>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
#game-canvas{display:block;width:100vw;height:100vh}#ui-root{position:fixed;inset:0;pointer-events:none}
#hud{position:fixed;top:14px;right:14px;min-width:300px;padding:12px 16px;border-radius:10px;
  background:linear-gradient(#1c3a8f,#0f2160);border:3px solid #f4f1ea;box-shadow:0 0 0 2px #0a1540,0 6px 18px rgba(0,0,0,.35);
  color:#fff;font:600 15px/1.45 ui-rounded,"SF Pro Rounded","Trebuchet MS",system-ui,sans-serif;white-space:pre}
#banner{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:10px 18px;border-radius:10px;
  background:#8a1d1d;border:3px solid #ffe3d6;color:#fff;font:700 17px/1.3 ui-rounded,system-ui,sans-serif}
</style>
</head><body>
<canvas id="game-canvas"></canvas><div id="ui-root"><div id="hud"></div><div id="banner" hidden></div></div>
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
</script>
<script type="module">
// F1 — engine spine demo. Proves: scene push/pop/replace + lifecycle order, bottom-up rendering (field under menu),
// opaque scenes, __DQ.advance determinism across chunkings, freeze, timeScale, interpolation, a scene that throws
// every tick without killing rendering, and fps. Colours here are demo-only placeholders (ART-DIRECTION §7 values).
import * as THREE from 'three';
import { App } from '/src/engine/app.js';
import { Loop } from '/src/engine/loop.js';
import { Scenes } from '/src/engine/states.js';
import { Bus } from '/src/engine/events.js';
import { Debug, reportError } from '/src/engine/debug.js';
import { Assets } from '/src/engine/assets.js';
import { makeRng, hashSeed, RNG } from '/src/engine/rng.js';

const PAL = { sky: '#9fd0ee', haze: '#cbdfe8', grass: '#62a04a', grassDeep: '#3f7a3a', dirt: '#dcbc8a', sun: '#fff0d2',
  hemiSky: '#c3cff0', hemiGround: '#bba374', slimes: ['#3b8fea', '#e8535a', '#ffd64a', '#86b85a', '#f59bbd', '#8fb0ff'],
  outline: '#2b1d1a', stone: '#d7cfbd', tile: '#cc603d', winTop: '#2c4fb8', winBot: '#132a78', winEdge: '#f4f1ea',
  curtainBg: '#2a1f3d', text: '#ffffff' };
const C3 = (h) => new THREE.Color(h);

const lifecycle = [];
let renderedThisFrame = [];
let lastRendered = [];
const hudEl = document.getElementById('hud');
const bannerEl = document.getElementById('banner');

// ── field: seeded random-walk slimes around a stone pillar (deterministic sim, interpolated render) ─────────────
function makeField() {
  const scene = new THREE.Scene();
  scene.background = C3(PAL.sky);
  scene.fog = new THREE.Fog(C3(PAL.haze), 30, 90);
  const camera = new THREE.PerspectiveCamera(45, App.aspect(), 0.3, 400);
  let rng, bodies = [], ticks = 0, seed = 1234, meshes = [], offResize = null;
  const N = 12, R = 7.5;
  return {
    name: 'field',
    enter(ctx = {}) {
      lifecycle.push('enter:field');
      seed = ctx.seed ?? 1234;
      rng = makeRng(seed);
      ticks = 0;
      const sun = new THREE.DirectionalLight(C3(PAL.sun), 1.9);
      sun.position.set(0.55 * 40, 0.72 * 40, 0.42 * 40); sun.castShadow = true;
      sun.shadow.mapSize.set(App.tier.shadowMapSize, App.tier.shadowMapSize);
      Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 100 });
      sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
      scene.add(sun, new THREE.HemisphereLight(C3(PAL.hemiSky), C3(PAL.hemiGround), 1.55));
      const ground = new THREE.Mesh(Assets.circle(40, 64), Assets.material('f1:grass', () => new THREE.MeshToonMaterial({ color: C3(PAL.grass) })));
      ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
      const ring = new THREE.Mesh(Assets.torus(R + 0.6, 0.35, 8, 64), Assets.material('f1:dirt', () => new THREE.MeshToonMaterial({ color: C3(PAL.dirt) })));
      ring.rotation.x = -Math.PI / 2; ring.scale.z = 0.08; ring.receiveShadow = true; scene.add(ring);
      const pillar = new THREE.Mesh(Assets.cylinder(0.9, 1.1, 3.2, 20), Assets.material('f1:stone', () => new THREE.MeshToonMaterial({ color: C3(PAL.stone) })));
      pillar.position.y = 1.6; pillar.castShadow = pillar.receiveShadow = true; scene.add(pillar);
      const cap = new THREE.Mesh(Assets.cone(1.5, 1.2, 20), Assets.material('f1:tile', () => new THREE.MeshToonMaterial({ color: C3(PAL.tile) })));
      cap.position.y = 3.8; cap.castShadow = true; scene.add(cap);
      const bodyGeo = Assets.geometry('f1:slime-body', () => {
        const geo = new THREE.SphereGeometry(0.5, 28, 18), p = geo.attributes.position;
        for (let i = 0; i < p.count; i++) {
          let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
          if (y < -0.2) y = -0.2 - (y + 0.2) * 0.25;
          if (y > 0.24) { const k = (y - 0.24) / 0.26; x *= 1 - 0.55 * k; z *= 1 - 0.55 * k; y += 0.2 * k * k; }
          p.setXYZ(i, x, y, z);
        }
        geo.computeVertexNormals();
        return geo;
      });
      const hullMat = Assets.material('f1:outline', () => new THREE.MeshBasicMaterial({ color: C3(PAL.outline), side: THREE.BackSide }));
      const eyeWhite = Assets.material('f1:eye-white', () => new THREE.MeshBasicMaterial({ color: C3(PAL.text) }));
      const eyeDark = Assets.material('f1:eye-dark', () => new THREE.MeshBasicMaterial({ color: C3(PAL.outline) }));
      bodies = []; meshes = [];
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2, r = rng.float(2.5, R - 0.5);
        const b = { x: Math.cos(a) * r, z: Math.sin(a) * r, vx: 0, vz: 0, hop: rng.float(0, 1), px: 0, pz: 0, ph: 0 };
        b.px = b.x; b.pz = b.z; b.ph = b.hop;
        bodies.push(b);
        const col = PAL.slimes[i % PAL.slimes.length];
        const m = new THREE.Mesh(bodyGeo, Assets.material('f1:slime:' + col, () => new THREE.MeshToonMaterial({ color: C3(col) })));
        m.castShadow = true;
        const hull = new THREE.Mesh(bodyGeo, hullMat); hull.scale.setScalar(1.05); m.add(hull);
        for (const sx of [-1, 1]) {
          const w = new THREE.Mesh(Assets.sphere(0.1, 12, 10), eyeWhite); w.scale.set(1, 1.3, 0.6); w.position.set(sx * 0.16, 0.02, 0.43); m.add(w);
          const d = new THREE.Mesh(Assets.sphere(0.055, 10, 8), eyeDark); d.position.set(sx * 0.15, 0.0, 0.49); m.add(d);
        }
        scene.add(m); meshes.push(m);
      }
      offResize = App.onResize(() => { camera.aspect = App.aspect(); camera.updateProjectionMatrix(); });
      camera.aspect = App.aspect(); camera.updateProjectionMatrix();
    },
    exit() {
      lifecycle.push('exit:field');
      if (offResize) offResize();
      Assets.disposeObject(scene);
      scene.clear();
    },
    pause() { lifecycle.push('pause:field'); },
    resume() { lifecycle.push('resume:field'); },
    update(dt) {
      ticks++;
      for (const b of bodies) {
        b.px = b.x; b.pz = b.z; b.ph = b.hop;
        b.vx += rng.float(-1, 1) * 6 * dt; b.vz += rng.float(-1, 1) * 6 * dt;
        b.vx *= 0.985; b.vz *= 0.985;
        b.x += b.vx * dt; b.z += b.vz * dt;
        const d = Math.hypot(b.x, b.z);
        if (d > R) { b.x *= R / d; b.z *= R / d; b.vx *= -0.6; b.vz *= -0.6; }
        if (d < 1.7) { b.x *= 1.7 / d; b.z *= 1.7 / d; b.vx *= -0.6; b.vz *= -0.6; }
        b.hop = (b.hop + dt * 1.4) % 1;
      }
    },
    render(alpha) {
      renderedThisFrame.push('field');
      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i], m = meshes[i];
        const x = b.px + (b.x - b.px) * alpha, z = b.pz + (b.z - b.pz) * alpha;
        const h = (b.ph + (((b.hop - b.ph) + 1) % 1) * alpha) % 1;
        const up = Math.max(0, Math.sin(h * Math.PI * 2)), sq = Math.max(0, -Math.sin(h * Math.PI * 2));
        m.position.set(x, 0.38 + up * 0.35, z);
        m.rotation.y = Math.atan2(b.vx, b.vz);
        m.scale.set(1 + sq * 0.15, 0.9 - sq * 0.15 + up * 0.08, 1 + sq * 0.15);
      }
      const t = App.clock.time;
      const orb = 0.4 + Math.sin(t * 0.1) * 0.15;
      camera.position.set(Math.sin(orb) * 17, 9.5, Math.cos(orb) * 17);
      camera.lookAt(0, 1.2, 0);
      App.render(scene, camera);
    },
    snapshot() {
      const parts = [ticks, rng.state];
      for (const b of bodies) parts.push(b.x, b.z, b.vx, b.vz, b.hop);
      return { ticks, rngState: rng.state, hash: hashSeed(parts.join(',')), sample: [+bodies[0].x.toFixed(6), +bodies[0].z.toFixed(6)] };
    },
  };
}

// ── menu: transparent overlay (field keeps rendering underneath); pops itself on cancel ────────────────────────
function makeMenu() {
  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(0, 1, 1, 0, -10, 10);
  const tex = Assets.canvasTexture('f1:menu-window', {
    w: 512, h: 320, wrap: 'clamp', mipmaps: false,
    draw(ctx, w, h) {
      const r = 26, inset = 10;
      const rr = (x, y, ww, hh, rad) => { ctx.beginPath(); ctx.moveTo(x + rad, y); ctx.arcTo(x + ww, y, x + ww, y + hh, rad); ctx.arcTo(x + ww, y + hh, x, y + hh, rad); ctx.arcTo(x, y + hh, x, y, rad); ctx.arcTo(x, y, x + ww, y, rad); ctx.closePath(); };
      const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, PAL.winTop); g.addColorStop(1, PAL.winBot);
      rr(inset, inset, w - inset * 2, h - inset * 2, r); ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 9; ctx.strokeStyle = PAL.winEdge; ctx.stroke();
      rr(inset + 12, inset + 12, w - (inset + 12) * 2, h - (inset + 12) * 2, r - 10); ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = PAL.text; ctx.font = '700 40px ui-rounded, "Trebuchet MS", system-ui, sans-serif'; ctx.textBaseline = 'middle';
      const items = ['Talk', 'Items', 'Spells', 'Status'];
      items.forEach((s, i) => ctx.fillText(s, 110, 78 + i * 56));
      ctx.beginPath(); ctx.moveTo(62, 62); ctx.lineTo(90, 78); ctx.lineTo(62, 94); ctx.closePath(); ctx.fill();
    },
  });
  const quad = new THREE.Mesh(Assets.plane(1, 1), Assets.material('f1:menu-mat', () => new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false })));
  scene.add(quad);
  return {
    name: 'menu',
    enter() { lifecycle.push('enter:menu'); },
    exit() { lifecycle.push('exit:menu'); },
    onInput(btn) { if (btn === 'cancel') Scenes.pop(); },
    update() {},
    render() {
      renderedThisFrame.push('menu');
      const w = App.width, h = App.height, pw = 400, ph = 250;
      cam.left = 0; cam.right = w; cam.top = h; cam.bottom = 0; cam.updateProjectionMatrix();
      quad.scale.set(pw, ph, 1); quad.position.set(28 + pw / 2, 28 + ph / 2, 0);
      App.render(scene, cam);
    },
  };
}

// ── curtain: an OPAQUE scene — nothing below it renders ─────────────────────────────────────────────────────
function makeCurtain() {
  const scene = new THREE.Scene(); scene.background = C3(PAL.curtainBg);
  const cam = new THREE.PerspectiveCamera(45, 16 / 9, 0.1, 50); cam.position.set(0, 0, 6);
  const knot = new THREE.Mesh(Assets.torus(1.2, 0.42, 20, 64), Assets.material('f1:curtain-knot', () => new THREE.MeshToonMaterial({ color: C3(PAL.slimes[2]) })));
  scene.add(knot, new THREE.HemisphereLight(C3(PAL.hemiSky), C3(PAL.hemiGround), 1.55));
  const key = new THREE.DirectionalLight(C3(PAL.sun), 1.9); key.position.set(3, 4, 5); scene.add(key);
  return {
    name: 'curtain', opaque: true,
    enter() { lifecycle.push('enter:curtain'); },
    exit() { lifecycle.push('exit:curtain'); },
    update(dt) { knot.rotation.y += dt * 0.9; knot.rotation.x += dt * 0.4; },
    render() { renderedThisFrame.push('curtain'); cam.aspect = App.aspect(); cam.updateProjectionMatrix(); App.render(scene, cam); },
  };
}

// ── boom: throws in update, render and onInput, every time. The field below must keep drawing AND updating. ───
function makeBoom() {
  return {
    name: 'boom', updateBelow: true,
    enter() { lifecycle.push('enter:boom'); bannerEl.textContent = 'boom scene on top: it throws in update + render every tick'; bannerEl.hidden = false; },
    exit() { lifecycle.push('exit:boom'); bannerEl.hidden = true; },
    update() { throw new Error('boom: deliberate update failure'); },
    render() { renderedThisFrame.push('boom'); throw new Error('boom: deliberate render failure'); },
    onInput() { throw new Error('boom: deliberate input failure'); },
  };
}

// ── boot ─────────────────────────────────────────────────────────────────────────────────────────────────────
App.start({ version: '0.1.0-f1-demo' });
Scenes.register('field', makeField);
Scenes.register('menu', makeMenu);
Scenes.register('curtain', makeCurtain);
Scenes.register('boom', makeBoom);
Scenes.push('field', { seed: 1234 });

Loop.onFrame(() => { lastRendered = renderedThisFrame; renderedThisFrame = []; });

// HUD (DOM, updated a few times a second)
let hudT = 0;
Loop.onFrame(() => {
  const now = performance.now();
  if (now - hudT < 200) return;
  hudT = now;
  const s = __DQ.state();
  hudEl.textContent =
    `F1 ENGINE SPINE\n` +
    `stack   ${s.sceneStack.join(' > ') || '(empty)'}\n` +
    `drawn   ${lastRendered.join(' + ')}\n` +
    `tick    ${s.loop.tick}   sim ${(s.loop.simMs / 1000).toFixed(2)}s\n` +
    `fps     ${s.fps}   frames ${s.render ? s.render.framesDrawn : 0}\n` +
    `speed   x${s.loop.timeScale}${s.loop.frozen ? '   FROZEN' : ''}\n` +
    `calls   ${s.render ? s.render.calls : 0}   tris ${s.render ? s.render.tris : 0}\n` +
    `errors  ${s.errors} caught (${__DQ.errors.length} listed)`;
});

// ── demo controls for critics ─────────────────────────────────────────────────────────────────────────────────
Debug.provide('demo', () => ({ lastRendered, lifecycle: lifecycle.slice(-12), field: Scenes.get('field') && Scenes.get('field').snapshot ? Scenes.get('field').snapshot() : null }));
Debug.expose('lifecycle', () => lifecycle.slice());
Debug.expose('lastRendered', () => lastRendered.slice());
Debug.expose('popScene', () => Scenes.pop());
Debug.expose('snapshot', () => { const f = Scenes.get('field'); return f && f.snapshot ? f.snapshot() : null; });

/** Run the field from a fixed seed in several different advance() chunkings; all must agree exactly. */
Debug.expose('determinism', () => {
  const wasFrozen = Loop.frozen;
  Loop.freeze(true);
  const run = (seed, chunks) => {
    Scenes.reset('field', { seed });
    Loop.resetCarry();
    for (const ms of chunks) __DQ.advance(ms);
    return Scenes.get('field').snapshot();
  };
  const a = run(1234, [1000]);
  const b = run(1234, Array(40).fill(25));        // 40 x 25 ms   = 1000 ms
  const c = run(1234, Array(143).fill(7));        // 143 x 7 ms   = 1001 ms -> still 60 ticks
  const d = run(1234, [333, 333, 334]);
  const e = run(4321, [1000]);                    // different seed must diverge
  Scenes.reset('field', { seed: 1234 });
  Loop.resetCarry();
  Loop.freeze(wasFrozen);
  const equal = [b, c, d].every(x => x.hash === a.hash && x.ticks === a.ticks && x.rngState === a.rngState);
  return { equal, ticks: a.ticks, seedMatters: e.hash !== a.hash, a, b, c, d, e };
});

/** Collect Loop.alpha over n frames: interpolation means alpha takes several distinct values. */
Debug.expose('sampleAlpha', (n = 40) => new Promise((res) => {
  const vals = new Set(); let k = 0;
  const off = Loop.onFrame((alpha) => { vals.add(Math.round(alpha * 100) / 100); if (++k >= n) { off(); res({ frames: k, distinct: vals.size, values: Array.from(vals).slice(0, 12) }); } });
}));

/** Ticks run during `ms` of real time (proves timeScale / freeze). */
Debug.expose('measureTicks', (ms = 1000) => new Promise((res) => {
  const t0 = Loop.tick, f0 = Loop.frame, p0 = performance.now();
  setTimeout(() => res({ ticks: Loop.tick - t0, frames: Loop.frame - f0, realMs: Math.round(performance.now() - p0), timeScale: Loop.timeScale, frozen: Loop.frozen }), ms);
}));

/** Every engine utility the spine exports, exercised once (throws are caught and returned). */
Debug.expose('engineSelfTest', () => {
  const out = {};
  const r1 = makeRng(42), r2 = makeRng(42);
  const seq1 = Array.from({ length: 5 }, () => r1.int(1, 3)), seq2 = Array.from({ length: 5 }, () => r2.int(1, 3));
  const counts = { a: 0, b: 0, c: 0 };
  const r3 = makeRng('weights');
  for (let i = 0; i < 3000; i++) counts[r3.weighted([{ id: 'a', weight: 1 }, { id: 'b', weight: 2 }, { id: 'c', weight: 0 }]).id]++;
  out.rng = { sameSeedSame: JSON.stringify(seq1) === JSON.stringify(seq2), intInclusive: seq1.every(v => v >= 1 && v <= 3),
    weightedZeroNeverWins: counts.c === 0, weightedRatio: +(counts.b / counts.a).toFixed(2),
    pick: makeRng(1).pick(['x']), chanceZero: makeRng(1).chance(0), pairs: makeRng(3).weighted([['only', 5]]) };
  let got = [];
  const off = Bus.on('f1.*', (p, evt) => got.push(evt));
  Bus.on('f1.test', () => { throw new Error('f1 bus listener deliberate throw'); });
  Bus.once('f1.test', () => got.push('once'));
  const errBefore = __DQ.state().errors;
  Bus.emit('f1.test', {}); Bus.emit('f1.test', {});
  off(); Bus.off('f1.test');
  out.bus = { got, listenerThrowCaught: __DQ.state().errors === errBefore + 2, remaining: Bus.count('f1.test') };
  const g1 = Assets.box(1, 2, 3), g2 = Assets.box(1, 2, 3);
  out.assets = { memoised: g1 === g2, shared: !!g1.userData.shared, stats: Assets.stats() };
  return out;
});
</script></body></html>
