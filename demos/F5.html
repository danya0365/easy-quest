/* ── the DQ window ─────────────────────────────────────────────────────────────── */
.dqw{position:absolute;box-sizing:border-box;border-radius:14px;padding:12px 18px;pointer-events:auto;

  box-shadow:0 0 0 2px rgba(10,18,56,.9),inset 0 0 0 3px rgba(10,22,70,.75),inset 0 0 0 4.5px rgba(255,255,255,.34),

  text-shadow:0 2px 0 rgba(4,10,40,.55);animation:dqw-open .18s cubic-bezier(.2,1.45,.45,1) both}

  background:linear-gradient(#1f3c9c,#122a78);border:2px solid #f6f1e4;box-shadow:0 0 0 2px rgba(10,18,56,.9);color:#ffe9a8}
@keyframes dqw-open{from{transform:scale(.92,.6);opacity:0}to{transform:none;opacity:1}}
@keyframes dqw-flash{0%{box-shadow:0 0 0 2px rgba(10,18,56,.9),inset 0 0 0 200px rgba(255,248,214,.55),0 0 26px 6px rgba(255,236,160,.8)}100%{}}
@keyframes dqw-shake{0%,100%{translate:0 0}20%{translate:-7px 0}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:3px 0}}
.dqw.opened{animation:none}
.dqw.opened.flash{animation:dqw-flash .7s ease-out}
.dqw.opened.shake{animation:dqw-shake .38s ease-out}

/* cursor: a chunky white arrow that nudges */
.cur{position:absolute;width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:15px solid #fff;
  filter:drop-shadow(0 2px 0 rgba(4,10,40,.6));animation:nudge .7s ease-in-out infinite;visibility:hidden}
.sel>.cur,.opt.sel>.cur{visibility:visible}

  border:1.5px solid rgba(255,255,255,.28);text-shadow:none;display:flex;align-items:center;gap:6px}

  background:rgba(4,10,44,.6);color:#eaffd6;font:15px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:10px 12px;word-break:break-all;outline:none;pointer-events:auto}

<script type="module">
// F5 — the book of tales. Proves: three slots + autosave, a registry of subsystems, playtime, slot summaries,
// write-then-swap with a second copy and a spare, recovery from every kind of damage, versioned migrations,
// the export/import escape hatch, and that nothing — not even 200 random mishaps — throws.
import * as THREE from 'three';
import { App } from '/src/engine/app.js';
import { Scenes } from '/src/engine/states.js';
import { Bus } from '/src/engine/events.js';
import { Debug, reportError } from '/src/engine/debug.js';
import { Assets } from '/src/engine/assets.js';
import { makeRng } from '/src/engine/rng.js';
import { Save, formatPlaytime } from '/src/engine/save.js';

const PAL = { zenith: '#2a74d0', upper: '#4f9ae2', horizon: '#bfe2f2', cloudLit: '#fffdf6', cloudMid: '#e9edf6', cloudShade: '#b8c3dd',
  sun: '#fff0d2', hemiSky: '#c3cff0', hemiGround: '#bba374', hillFar: '#bccde4', hillFarLow: '#86a6cc', hillMid: '#86b088',
  hillMidLow: '#4e8868', hillNear: '#76a852', hillNearLow: '#4f8c40', grass: '#62a04a', grassDeep: '#3f7a3a', slime: '#3b8fea',
  slimeLight: '#9bd2ff', mouth: '#7a1f2e', tongue: '#f07a8a', eye: '#1c1418', white: '#ffffff', outline: '#2b1d1a',
  leafOutline: '#1e3219', page: '#fdf4e0', pageShade: '#dcc7a2', leather: '#7a4c2c', leatherDark: '#523622', contact: '#23301c', ribbon: '#d8483b' };
const C3 = (h) => new THREE.Color(h);

// ── audio (P28), optional: never required for the page to work ───────────────────────────────────────────────
let Sfx = null, AudioM = null;
import('/src/audio/sfx.js').then(m => { Sfx = m.Sfx || m.default || null; }).catch(() => {});
import('/src/audio/audio.js').then(m => { AudioM = m.Audio || m.default || null; }).catch(() => {});
const snd = (id, o) => { try { if (Sfx && AudioM && AudioM.ready) Sfx.play(id, o); } catch (_) {} };
const unlockAudio = () => { try { if (AudioM) AudioM.unlock(); } catch (_) {} };
addEventListener('pointerdown', unlockAudio); addEventListener('keydown', unlockAudio);

// ── the pretend game that the book writes down ──────────────────────────────────────────────────────────────
const STOPS = [
  [1, 'hollybank', 1], [1, 'puddlewick', 2], [1, 'aldenmoor', 3], [1, 'saltmarrow', 4], [1, 'cobwell_manor', 6], [1, 'coddleston', 7], [1, 'grey_ruins', 8],
  [2, 'quiet_quarry', 9], [2, 'whistling_caves', 10], [2, 'parchmouth', 11], [2, 'gogglestone_caves', 12], [2, 'puddlewick', 13], [2, 'port_pelican', 14],
  [2, 'marbleford', 16], [2, 'sighing_grotto', 18], [2, 'marbleford_chapel', 19], [2, 'ambergarde_keep', 20],
  [3, 'stone_garden', 20], [3, 'ambergarde_keep', 21], [3, 'coldcomfort', 23], [3, 'glasswing_grotto', 24], [3, 'highfeather', 25], [3, 'whistfell_abbey', 26], [3, 'quiet_deep', 28],
].map(([chapter, map, lvl]) => ({ chapter, map, lvl }));
const FLAG_AT = { hollybank: 'ch1.awake', puddlewick: 'ch1.left_home', cobwell_manor: 'ch1.manor_cleared', coddleston: 'ch1.pass_open',
  grey_ruins: 'ch1.halvard_fallen', quiet_quarry: 'ch2.quarry_escape', gogglestone_caves: 'ch2.pip_return', port_pelican: 'ch2.sera_grown',
  sighing_grotto: 'ch2.pearl', marbleford_chapel: 'ch2.married', ambergarde_keep: 'ch2.ambergarde', stone_garden: 'ch3.awake',
  coldcomfort: 'item.wolfscarf', glasswing_grotto: 'ch3.shield', highfeather: 'ch3.sunlark', whistfell_abbey: 'ch3.elowen', quiet_deep: 'ch3.mortmain_fallen' };

function companions(stop) {
  const s = STOPS[stop], L = s.lvl;
  const m = (id, name, d) => ({ id, name, lvl: Math.max(1, L - d) });
  if (s.chapter === 1) return [stop >= 2 && m('bobble', 'Bobble', 1), stop >= 4 && m('pip', 'Pip', 2)].filter(Boolean);
  if (s.chapter === 2) return [m('bobble', 'Bobble', 2), stop >= 10 && m('pip', 'Pip', 1), stop >= 11 && m('barty', 'Barty', 3), m('digby', 'Digby', 4)].filter(Boolean).slice(0, 3);
  return [m('rowan', 'Rowan', 5), m('linnet', 'Linnet', 5), m('bobble', 'Bobble', 3)];
}

const fresh = (hero = 'Bram') => ({ hero, stop: 0, lvl: 1, gold: 0, flags: { 'ch1.awake': true }, inventory: [{ id: 'herb', n: 1 }], pos: { x: 12, z: 8, facing: 0 }, textSpeed: 'normal', extra: [] });
let game = fresh();
const hp = (lvl) => 14 + lvl * 9;

function jumpTo(stop, hero) {
  game = fresh(hero || game.hero);
  game.stop = stop;
  const s = STOPS[stop];
  game.lvl = s.lvl; game.gold = 30 + stop * 137 % 900 + stop * 60;
  for (let i = 0; i <= stop; i++) { const f = FLAG_AT[STOPS[i].map]; if (f) game.flags[f] = true; }
  game.inventory = [{ id: 'herb', n: 2 + (stop % 4) }, { id: 'homing_feather', n: 1 + (stop % 2) }];
  game.extra = companions(stop);
}
function playStep(rng) {
  const next = Math.min(STOPS.length - 1, game.stop + 1);
  const hero = game.hero, gold = game.gold, extraGold = rng ? rng.int(40, 160) : 90;
  jumpTo(next === game.stop ? game.stop : next, hero);
  game.gold = Math.min(9999999, gold + extraGold);
  Save.addPlaytime(rng ? rng.int(900, 2100) : 1380);
}

// The subsystems. In the real game these live in their owners' modules; here they share one object.
const findStop = (chapter, map, lvl) => {
  let best = -1, bestD = 1e9;
  STOPS.forEach((s, i) => { if (s.chapter === chapter && s.map === map) { const d = Math.abs(s.lvl - lvl); if (d < bestD) { best = i; bestD = d; } } });
  if (best < 0) STOPS.forEach((s, i) => { const d = (s.chapter !== chapter ? 50 : 0) + Math.abs(s.lvl - lvl); if (d < bestD) { best = i; bestD = d; } });
  return Math.max(0, best);
};
let pend = {};
const settle = () => { if (pend.chapter != null || pend.map != null || pend.lvl != null) { game.stop = findStop(pend.chapter ?? STOPS[game.stop].chapter, pend.map ?? STOPS[game.stop].map, pend.lvl ?? game.lvl); } };
Save.register('chapter', { save: () => STOPS[game.stop].chapter, load: (d) => { pend.chapter = d; }, reset: () => { pend = {}; } });
Save.register('flags', { save: () => game.flags, load: (d) => { game.flags = d || {}; }, reset: () => { game.flags = {}; } });
Save.register('gold', { save: () => game.gold, load: (d) => { game.gold = Number(d) || 0; }, reset: () => { game.gold = 0; } });
Save.register('inventory', { save: () => game.inventory, load: (d) => { game.inventory = Array.isArray(d) ? d : []; }, reset: () => { game.inventory = []; } });
Save.register('party', {
  save: () => [{ id: 'hero', name: game.hero, lvl: game.lvl, hp: hp(game.lvl), mhp: hp(game.lvl), mp: game.lvl * 3 }, ...game.extra],
  load: (d) => {
    const list = Array.isArray(d) ? d : [];
    const h = list.find(m => m && m.id === 'hero') || list[0] || {};
    game.hero = typeof h.name === 'string' ? h.name : 'Bram';
    game.lvl = Number(h.lvl ?? h.level) || 1; pend.lvl = game.lvl;
    game.extra = list.filter(m => m && m !== h).map(m => ({ id: m.id, name: m.name, lvl: m.lvl }));
  },
  reset: () => { game.hero = 'Bram'; game.lvl = 1; game.extra = []; },
});
Save.register('map', { save: () => STOPS[game.stop].map, load: (d) => { pend.map = d; }, reset: () => { game.stop = 0; } });
Save.register('pos', { save: () => game.pos, load: (d) => { game.pos = d || { x: 0, z: 0 }; settle(); pend = {}; }, reset: () => { game.pos = { x: 12, z: 8, facing: 0 }; } });
Save.register('settings', { save: () => ({ textSpeed: game.textSpeed }), load: (d) => { game.textSpeed = (d && d.textSpeed) || 'normal'; }, reset: () => { game.textSpeed = 'normal'; } });

let grumpyOff = null;
function setGrumpy(on) {
  if (on && !grumpyOff) {
    grumpyOff = Save.register('grumpy', {
      save() { throw new Error('deliberate: the grumpy helper refuses to be written down'); },
      load() { throw new Error('deliberate: the grumpy helper refuses to be read'); },
    });
  } else if (!on && grumpyOff) { grumpyOff(); grumpyOff = null; }
  return !!grumpyOff;
}

// ── book helpers ─────────────────────────────────────────────────────────────────────────────────────────────
const SLOTS = [1, 2, 3, 'auto'];
const gameSig = () => JSON.stringify([game.hero, game.stop, game.lvl, game.gold, game.flags, game.extra]);
let syncedSig = null, syncedWith = null;

function seedBook() {
  Save.newGame();
  jumpTo(19, 'Toffee'); Save.setPlaytime(6 * 3600 + 40 * 60 + 2); Save.write(3, { reason: 'seed' });
  jumpTo(4, 'Bram'); Save.setPlaytime(1 * 3600 + 12 * 60 + 9); Save.write(1, { reason: 'seed' });
  jumpTo(5, 'Bram'); Save.setPlaytime(1 * 3600 + 31 * 60 + 40); Save.write('auto', { reason: 'seed' });
}
function wipeBook() {
  for (const k of Save.rawKeys()) if (k.startsWith('dqv.save.') || k.startsWith('dqv.demo.junk.')) Save.rawDel(k);
  try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith('dqv.demo.junk.')) localStorage.removeItem(k); } } catch (_) {}
}

// ── DOM ─────────────────────────────────────────────────────────────────────────────────────────────────────
const stage = document.getElementById('stage');
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let uiKit = 'own';

function win(id, tab) {
  const w = el('div', 'dqw', stage); if (id) w.id = id;
  // once it has opened, a window stays settled: shake/flash must not replay the opening
  w.addEventListener('animationend', (ev) => { if (ev.target === w && ev.animationName === 'dqw-open') w.classList.add('opened'); });
  if (tab) el('div', 'tab', w, esc(tab));
  return w;
}
function fitStage() {
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  stage.style.transformOrigin = '50% 50%';
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fitStage); fitStage();

const hdr = win('hdr');
const slotEls = SLOTS.map((s, i) => {
  const w = win(null); w.classList.add('slot'); if (s === 'auto') w.classList.add('auto');
  w.style.top = (92 + i * 110) + 'px';
  w.addEventListener('pointerenter', () => { if (!ui.modal) { setFocus('slots', i); } });
  w.addEventListener('click', () => { if (!ui.modal) { setFocus('slots', i); press('right'); } });
  return w;
});
const tale = win('tale', 'The tale so far');
const CMDS = [
  ['write', 'Write it down'], ['read', 'Read it back'],
  ['play', 'Play a while'], ['new', 'Start a new tale'],
  ['export', 'Copy the code'], ['import', 'Paste a code'],
  ['clear', 'Tear out page'], ['undo', 'Put it back'],
];
const MIS = [
  ['ink', 'Spill ink'], ['inkBoth', 'Smudge both copies'],
  ['ruin', 'Ruin all three'], ['tear', 'Tear it in half'],
  ['midwrite', 'Stop mid-write'], ['stuff', 'Stuff the bag'],
  ['old', 'A very old book'], ['future', 'Book from the future'],
  ['grumpy', 'Grumpy helper'], ['lock', 'Lock the shelf'],
  ['chaos', 'Chaos x200'], ['tidy', 'Tidy up the book'],
];
const cmdWin = win('cmd', 'What now?');
const cmdGrid = el('div', 'menu', cmdWin);
const cmdEls = CMDS.map(([id, label], i) => menuOpt(cmdGrid, label, () => setFocus('cmd', i), () => { setFocus('cmd', i); press('confirm'); }));
const misWin = win('mis', 'Mischief, to test the book');
const misGrid = el('div', 'menu', misWin);
const misEls = MIS.map(([id, label], i) => menuOpt(misGrid, label, () => setFocus('mis', i), () => { setFocus('mis', i); press('confirm'); }));
const msgWin = win('msg');
function menuOpt(parent, label, hover, click) {
  const o = el('div', 'opt', parent, `<div class="cur"></div><span>${esc(label)}</span>`);
  o.addEventListener('pointerenter', () => { if (!ui.modal) hover(); });
  o.addEventListener('click', () => { if (!ui.modal) click(); });
  return o;
}

// Borrow F4's window widget if it has landed (checked via the progress ledger first, so a missing file is never
// requested: a 404 would be a console error). Any surprise -> keep our own windows.
(async () => {
  try {
    if (new URLSearchParams(location.search).get('ui') === 'own') return;
    const prog = await fetch('/docs/progress.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
    const f4 = prog && prog.pieces && prog.pieces.F4;
    if (!f4 || f4.status === 'todo') return;
    const mod = await import('/src/ui/window.js');
    const make = mod.createWindow || mod.makeWindow || (mod.UIWindow && mod.UIWindow.create) || (mod.Window && mod.Window.create) || (mod.default && (mod.default.createWindow || mod.default.create));
    const probe = typeof make === 'function' ? make({ title: 'probe' }) : null;
    const node = probe && (probe instanceof HTMLElement ? probe : probe.el instanceof HTMLElement ? probe.el : null);
    if (!node || !node.className) return;
    for (const w of stage.querySelectorAll('.dqw')) w.classList.add(...String(node.className).split(/\s+/).filter(Boolean));
    uiKit = 'window.js';
  } catch (_) { uiKit = 'own'; }
})();

// ── UI state + rendering ─────────────────────────────────────────────────────────────────────────────────────

const anim = { hopT: -9, worryT: -9, reliefT: -9, pageT: -9 };
Object.assign(gloop, {
  hop() { anim.hopT = App.clock.time; anim.pageT = App.clock.time; },
  worry() { anim.worryT = App.clock.time; },
  relief() { anim.reliefT = App.clock.time; anim.pageT = App.clock.time; },
});

function animate(t) {
  const breathe = Math.sin(t * 2.4);
  let y = 0, sx = 1 + breathe * 0.03, sy = 1 - breathe * 0.035, rz = 0, rx = 0;
  const h = t - anim.hopT;
  if (h >= 0 && h < 0.9) {
    const k = h / 0.9;
    if (k < 0.18) { const q = k / 0.18; sy -= 0.22 * Math.sin(q * Math.PI / 2); sx += 0.16 * Math.sin(q * Math.PI / 2); }
    else if (k < 0.78) { const q = (k - 0.18) / 0.6; y = Math.sin(q * Math.PI) * 0.3; sy += 0.12 * Math.sin(q * Math.PI); sx -= 0.07 * Math.sin(q * Math.PI); }
    else { const q = (k - 0.78) / 0.22; sy -= 0.18 * Math.sin(q * Math.PI); sx += 0.12 * Math.sin(q * Math.PI); }
  }
  const w = t - anim.worryT;
  if (w >= 0 && w < 0.8) rz = Math.sin(w * 38) * 0.14 * (1 - w / 0.8);
  const r = t - anim.reliefT;
  if (r >= 0 && r < 1.2) { rx = -Math.sin(Math.min(1, r / 1.2) * Math.PI) * 0.18; sy -= Math.sin(Math.min(1, r / 1.2) * Math.PI) * 0.06; }
  body.position.y = y; body.scale.set(sx, sy, sx); body.rotation.set(rx, Math.sin(t * 0.7) * 0.18 - 0.25, rz);
  gShadow.scale.setScalar(1 - Math.min(0.45, y * 0.45));
  const p = t - anim.pageT;
  leaf.rotation.z = p >= 0 && p < 0.5 ? Math.PI * (p / 0.5) : 0;
  leaf.visible = p >= 0 && p < 0.5;
  for (const c of clouds) c.position.x = (((c.userData.x0 + 260 + t * 1.1) % 520) + 520) % 520 - 260;
}

// ── scene + boot ────────────────────────────────────────────────────────────────────────────────────────────
Scenes.register('book', {
  opaque: true,
  enter() {},
  update() {},
  render() {
    try { animate(App.clock.time); } catch (e) { reportError('F5 animate', e); }
    App.render(scene, camera);
    tickMsg();
    if (!render._t || performance.now() - render._t > 200) { render._t = performance.now(); refresh(); }
  },
  onInput(btn) { return uiInput(btn); },
});
const render = {};

App.start({ version: '0.1.0-f5-demo' });
Scenes.push('book');

Save.init();

{
  const latest = Save.latest();

  syncedSig = gameSig(); syncedWith = latest ? latest.slot : null;
  ui.slot = latest ? Math.max(0, SLOTS.indexOf(latest.slot)) : 0;
}
Save.enableAutosave({ events: ['map.enter'], minGapMs: 800 });
refresh();
say(`Welcome back. Which tale shall we carry on? / Pick a page, then choose what to do with it.`);

Debug.provide('demo', () => ({
  uiKit, focus: ui.focus, selected: selSlot(), command: CMDS[ui.cmd][0], mischief: MIS[ui.mis][0], modal: ui.modal ? ui.modal.type : null,

Debug.expose('read', (slot = selSlot()) => doRead(slot));

Debug.expose('exportCode', (slot = selSlot()) => { const e = doExport(slot); return e.ok ? e.code : e; });

Debug.expose('enter', (mapId = 'saltmarrow') => { Bus.emit('map.enter', { id: mapId }); return Save.state().autosave; });
Debug.expose('refresh', () => { refresh(); return true; });
