<script type="module">
// P14 — the battle rules engine (src/battle/battle.js), played. Dragon Quest V's way: Bram takes commands; everybody else
// fights by their Tactics ("Fight Wisely" until you say otherwise; "Follow Orders" per member). The stage is the house
// meadow (src/world/scenery.js) with P16's real monsters (src/art/monsters.js); sound is P28's SFX and P27's score.
// Rules data: tests/battle/data.js (the docs/DATA-SHAPES.md shapes), areas and parties: tests/battle/areas.js.
import * as THREE from 'three';
import { App } from '/src/engine/app.js';
import { Scenes } from '/src/engine/states.js';
import { Debug, reportError } from '/src/engine/debug.js';
import { PAL, lerp, smooth, applyCssVars } from '/src/art/palette.js';
import { mulberry, vnoise } from '/src/art/tex.js';
import { Toon, makeLightRig, makeAOMask } from '/src/art/toon.js';
import { createKit, buildSky, ringHill, buildGround, paintMasks, curvePoints, OAK, POPLAR, BUSH } from '/src/world/scenery.js';
import { Monsters } from '/src/art/monsters.js';
import { Audio } from '/src/audio/audio.js';
import { Sfx } from '/src/audio/sfx.js';
import { Music } from '/src/audio/music.js';
import { createBattle, TACTICS } from '/src/battle/battle.js';
import { makeRng } from '/src/battle/formulas.js';
import { newCompanion } from '/src/data/growth.js';
import DATA from '/tests/battle/data.js';

applyCssVars();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const guard = (where, fn) => { try { return fn(); } catch (e) { reportError('P14 ' + where, e); return undefined; } };

// ------------------------------------------------------------------------------------------------ design units
function fitUnits() { document.getElementById('ui-root').style.setProperty('--u', Math.min(innerWidth / 1280, innerHeight / 720) + 'px'); }
fitUnits(); addEventListener('resize', fitUnits);

// ================================================================================================= the stage (3D)
function heightAt(x, z) {
  const r = Math.hypot(x, z * 1.15);
  let h = 1.0 * vnoise(x * 0.07 + 3, z * 0.07 + 7, 3) + 0.45 * vnoise(x * 0.18, z * 0.18, 5) - 0.7;
  h *= smooth(6, 18, r);
  h += 2.6 * smooth(-16, -44, z) * (0.55 + 0.45 * vnoise(x * 0.05 + 2, 1.3, 9));
  const e = Math.hypot(x, z), a = Math.atan2(z, x);
  const lump = 0.6 * vnoise(Math.cos(a) * 3 + 5, Math.sin(a) * 3 + 5, 17) + 0.4 * vnoise(Math.cos(a) * 7, Math.sin(a) * 7, 19);
  h += (3 + 6 * lump) * smooth(36, 88, e);
  return h;
}
const LANE = [[18, 30], [10, 16], [4.5, 6], [0.8, -0.5], [-3.5, -7], [-10, -15], [-16, -21], [-26, -30]];
const G = { scene: null, camera: null, rig: null, sky: null, kit: null, models: new Map(), dist: 5, look: 0.4, shake: 0, push: 0, preset: 'day', built: false, buildMs: 0 };

function buildStage() {
  const t0 = performance.now();
  const scene = G.scene = new THREE.Scene();
  G.camera = new THREE.PerspectiveCamera(42, App.aspect(), 0.3, 1400);
  G.rig = makeLightRig({ scene, preset: 'day', extent: 18 });
  const ao = makeAOMask({ span: 96, size: 1024, center: [0, 0] });
  const kit = G.kit = createKit({ scene, heightAt, ao });
  G.sky = buildSky(scene, G.rig);
  ringHill(scene, 'mid', 118, 150, 205, 5, 21, 71, PAL.hill.midLow, PAL.hill.mid, 0.2);
  ringHill(scene, 'far', 240, 300, 380, 12, 78, 81, PAL.hill.farLow, PAL.hill.far, 0.25, { fogged: false, peaky: 1.8 });
  const masks = paintMasks({ N: 1024, span: 96, strokes: [{ pts: curvePoints(LANE, 0.35), w: 3.2, falloff: 1.1, channel: 0 }] });
  const pathAt = (x, z) => masks.sample(0, x, z);
  const step = (name, fn) => guard('stage ' + name, fn);
  const r = mulberry(1414), oaks = [], poplars = [], bushes = [];
  const clear = (x, z, pad) => pathAt(x, z) < 0.05 && Math.hypot(x, z * 1.4) > pad;
  for (let i = 0; i < 160 && oaks.length < 26; i++) {
    const x = (r() - 0.5) * 64, z = -9 - r() * 26;
    if (!clear(x, z, 11) || oaks.some((o) => Math.hypot(o.x - x, o.z - z) < 4.6)) continue;
    oaks.push({ x, z, s: 0.85 + r() * 0.45, r: r() * 6.28, c: 0.92 + r() * 0.16 });
  }
  for (let i = 0; i < 60 && poplars.length < 6; i++) {
    const x = (r() - 0.5) * 50, z = -12 - r() * 18;
    if (!clear(x, z, 12) || [...oaks, ...poplars].some((o) => Math.hypot(o.x - x, o.z - z) < 3.6)) continue;
    poplars.push({ x, z, s: 0.9 + r() * 0.3, r: r() * 6.28, c: 0.95 + r() * 0.1 });
  }
  for (const [x, z] of [[-7.5, -6.5], [8.5, -5.5], [-10.5, -2.5], [11.5, -9], [-5.5, -10.5], [13, 1.5], [-13, 3], [6.5, -11]]) {
    if (pathAt(x, z) <= 0.1) bushes.push({ x, z, s: 0.75 + r() * 0.5, r: r() * 6.28, c: 0.95 + r() * 0.1 });
  }
  step('rocks', () => { for (const [x, z, s, seed] of [[-6.2, -4.2, 0.7, 3], [7.4, -2.8, 0.55, 4], [-9.5, 6.5, 0.9, 5], [10.5, 5.2, 0.6, 6]]) kit.rock(x, z, s, seed); });
  step('trees', () => { kit.forest('oak', OAK, oaks, { detail: 1, spherize: 0.72, trunkH: 1.7 }); kit.forest('poplar', POPLAR, poplars, { detail: 1, spherize: 0.6, trunkH: 1.3, light: PAL.foliage.light }); });
  step('bushes', () => kit.forest('bush', BUSH, bushes, { detail: 1, spherize: 0.6, trunkH: 0, light: PAL.foliage.light, wind: 0.02, windBase: 0.2, shadows: false, aoR: 1.1, aoS: 0.55 }));
  step('belt', () => kit.forestBelt({ radius: 44, rows: 3, rowGap: 6.5, seed: 1414, threshold: 0.36, step: 0.07 }));
  step('flush', () => kit.flush());
  const onMeadow = (x, z) => pathAt(x, z) < 0.3 && Math.hypot(x, z) < 38;
  step('tufts', () => kit.tufts({ count: 1000, radius: 36, seed: 1415, accept: (x, z) => onMeadow(x, z) && Math.hypot(x, z * 1.6) > 3.2,
    rimOf: (x, z) => { const p = pathAt(x, z); return smooth(0.08, 0.3, p) * (1 - smooth(0.3, 0.42, p)); } }));
  const hues = [PAL.flower.white, PAL.flower.yellow, PAL.flower.pink, PAL.flower.blue];
  const clusters = [{ x: -4.2, z: 3.4, hue: PAL.flower.yellow, n: 12 }, { x: 5.8, z: 2.2, hue: PAL.flower.white, n: 14 }, { x: -6.5, z: -2, hue: PAL.flower.pink, n: 12 }, { x: 9, z: -1, hue: PAL.flower.yellow, n: 12 }];
  for (let i = 0; i < 22; i++) clusters.push({ x: (r() - 0.5) * 56, z: (r() - 0.5) * 50, hue: hues[(r() * hues.length) | 0] });
  step('flowers', () => kit.flowers(clusters, { accept: (x, z) => onMeadow(x, z) && pathAt(x, z) < 0.15 && Math.hypot(x, z * 1.6) > 2.8 }));
  step('ground', () => buildGround(scene, { heightAt, masks, ao, inner: 40, step: 1.0, outer: 132, rings: 9 }));
  step('butterflies', () => kit.butterflies([{ x: -4.5, z: 2.5, hue: PAL.flower.yellow }, { x: 6.2, z: -3.5, hue: PAL.char.white }]));
  G.built = true;
  G.buildMs = Math.round(performance.now() - t0);
}

/** Light the meadow for the place: the rig preset (the sky dome, the fog and the sun all follow it). */
function applyLight(preset) {
  guard('light', () => {
    G.rig.apply(preset);                    // P02's sky dome follows the rig's preset on its own (weather.js ENV.sync)
    G.preset = preset;
  });
}

/** Terrain → light: the house meadow everywhere (the matched backdrops per terrain are P15's), lit for the place. */
const LIGHT = { cave: 'dusk', manor: 'dusk', abbey: 'dusk', deep: 'night', sea: 'dusk', ruins: 'dusk', quarry: 'dusk' };
const TERRAIN = {
  long_lane: 'meadow', long_lane_alone: 'meadow', saltmarrow_coast: 'meadow', whispering_wood: 'meadow', cobwell_manor: 'manor',
  coddleston_downs: 'meadow', whistling_caves: 'cave', gogglestone_caves: 'cave', marbleford_downs: 'meadow', sogglemarsh: 'meadow',
  frittering_sands: 'meadow', bellhollow_belfry: 'manor', pelican_coast: 'meadow', ambergarde_road: 'meadow', sighing_grotto: 'sea',
  glasswing_grotto: 'cave', grey_ruins: 'ruins', quiet_quarry: 'quarry', highfeather: 'meadow', whistfell_abbey: 'abbey', quiet_deep: 'deep',
};
/**
 * The species P16 has not modelled yet stand in as the nearest shape it has, so a fight is never a CSS blob; the
 * nameplate still says who it really is, and __DQ.state().stage marks it `standIn`. (NEEDS P16: models for these.)
 */
const STAND_IN = {
  squidgeon: 'flapjack', thunderpuff: 'flapjack', vesperling: 'flapjack', wyrmsley: 'flapjack',
  dune_buggy: 'grumbleglop', barrowmole: 'grumpleroot', tidewarden: 'grumbleglop',
  candelabracadabra: 'clankworthy', jinglebottom: 'clankworthy', sir_cumference: 'clankworthy', hexcalibur: 'clankworthy', iron_governess: 'clankworthy',
  lady_mothbonnet: 'boohoo', sexton_sootbell: 'boohoo', mortmain: 'boohoo', mortmain_scripted: 'boohoo', mortmain_enfolded: 'boohoo',
  hush: 'boohoo', hark: 'boohoo', malgrim_cocoon: 'gloopold', malgrim_unravelling: 'boohoo', grimalkitten: 'pip', sunspot_cub: 'pip',
  mirthquake: 'boulderdash', hoarfax: 'sunmane',
};
const modelId = (species) => (Monsters.has(species) ? species : STAND_IN[species] && Monsters.has(STAND_IN[species]) ? STAND_IN[species] : 'gloop');
const isStandIn = (species) => !Monsters.has(species);

/** Lay the enemies out in a gentle arc facing the camera, and fit the camera to them. */
function stageEnemies(snapEnemies, { drop = true } = {}) {
  for (const v of G.models.values()) guard('dispose', () => v.m.dispose());
  G.models.clear();
  const list = snapEnemies.filter((e) => e.alive);
  const built = list.map((e) => {
    const m = Monsters.build(modelId(e.species));
    const scale = e.boss ? Math.max(1.5, 1.7 / Math.max(0.35, m.height)) : 1;
    m.root.scale.setScalar(scale);
    return { e, m, scale, r: m.radius * scale, h: m.height * scale };
  });
  const gap = 0.5;
  let W = 0; built.forEach((b, i) => { W += b.r * 2 + (i ? gap : 0); });
  let x = -W / 2, top = 0;
  built.forEach((b, i) => {
    if (i) x += gap;
    const cx = x + b.r; x += b.r * 2;
    const t = W > 0 ? cx / (W / 2 + 1e-6) : 0;

    const hover = (b.m._template && b.m._template.spec && b.m._template.spec.hover) || 0;
    top = Math.max(top, b.h + hover * b.scale);

  });

  // monsters live in the band between — big enough to read every face, never clipped by a window.
  const tanH = Math.tan(THREE.MathUtils.degToRad(G.camera.fov / 2)), tanW = tanH * App.aspect();

const BAND_NDC = 0.10;      // the middle of the monster band, in screen coords (a touch above the frame's centre)
function placeCamera(dt) {

function tickStage(dt) {

  const local = where === 'top' ? v.m.top() : where === 'center' ? v.m.center() : new THREE.Vector3(0, 0, 0);
  const p = local.clone().multiplyScalar(v.scale).add(v.m.root.position);

// ------------------------------------------------------------------------------------------------ message queue
function enqueue(events) {

  if (UI.instant) flush();
}

function beginNext() {
  const ev = UI.queue.shift();
  guard('event ' + ev.t, () => applyEvent(ev));
  logEvent(ev);
  const lines = ev.lines || (ev.text ? [ev.text] : []);
  if (!lines.length) return;
  // the join question gets the window to itself (critic a2r1: it was asked over Bobble's level-up lines)
  if (ev.t === 'recruit_offer' || ev.t === 'victory' || ev.t === 'wipe') UI.lines = [];
  // a level-up is a ceremony, not a list of stat lines in the message window (SYSTEMS §10.2): the panel takes them
  UI.cur = { ev, lines: ev.t === 'levelup' && !UI.instant ? [lines[0]] : lines, idx: 0, phase: 'type' };
  UI.typed = 0;
  pushLine('');
}

function tick(dt) {
  if (UI.panel) { tickLevelPanel(dt / 1000); return; }
  if (UI.waiting) return;
  const speed = UI.fast ? 5 : 1;
  while (!UI.cur && UI.queue.length && !UI.waiting) beginNext();
  const c = UI.cur;
  if (!c) { if (UI.busy && !UI.waiting) { UI.busy = false; idle(); } return; }
  if (c.phase === 'gap') { UI.hold -= dt * speed; if (UI.hold <= 0) { c.phase = 'type'; pushLine(''); } return; }
  if (c.phase === 'type') {
    const line = c.lines[c.idx];
    const before = Math.floor(UI.typed);
    UI.typed += dt * CPS * speed;
    const n = Math.min(line.length, Math.floor(UI.typed));
    if (n > before && line[n - 1] !== ' ') guard('glyph', () => { if (Audio.ready) Sfx.glyph('narrator'); });
    setLastLine(line.slice(0, n));
    if (n >= line.length) {
      c.idx++; UI.typed = 0;
      if (c.idx < c.lines.length) { c.phase = 'gap'; UI.hold = c.ev.t === 'levelup' ? 110 : 170; }
      else { c.phase = 'hold'; UI.hold = HOLD[c.ev.t] || 300; }
    }
    return;
  }
  UI.hold -= dt * speed;
  if (UI.hold <= 0) {
    UI.cur = null;

    else if (c.ev.t === 'levelup') openLevelPanel(c.ev);
  }
}

function flush() {

    const c = UI.cur;
    setLastLine(c.lines[c.idx]);
    for (let i = c.idx + 1; i < c.lines.length; i++) pushLine(c.lines[i]);
    UI.cur = null;
    if (c.ev.t === 'recruit_offer') { openRecruit(c.ev); break; }
  }

}

  node.innerHTML = `<div class="dq-title">${esc(ev.name)} · Level ${ev.level}</div>`
    + ev.gainsOrdered.map((g, i) => `<div class="r hide" data-i="${i}"><span class="lab">${esc(g.label)}</span><span class="tot">${g.total}</span><span class="up ${g.gain > 0 ? (g.gain >= 5 ? 'big' : '') : 'none'}">${g.gain > 0 ? '+' + g.gain : '—'}</span></div>`).join('');
  return true;
}
function tickLevelPanel(dt) {
  const P = UI.panel; if (!P) return;
  P.t += dt;
  const node = $('lvpanel');
  if (P.phase === 'stats') {
    const want = Math.min(P.ev.gainsOrdered.length, Math.floor(P.t / 0.22));
    while (P.shown < want) {
      const row = node.querySelector(`.r[data-i="${P.shown}"]`);
      if (row) row.classList.remove('hide');
      const g = P.ev.gainsOrdered[P.shown];
      if (g && g.gain > 0) sfx(g.gain >= 5 ? 'level_up_sparkle' : 'cursor', { vol: g.gain >= 5 ? 0.9 : 0.7 });
      P.shown++;
    }
    if (P.shown >= P.ev.gainsOrdered.length && P.t > 0.22 * P.shown + 0.7) {
      if (P.ev.learned && P.ev.learned.length) { P.phase = 'spell'; P.t = 0; showSpellCard(P.ev.learned[0]); }
      else { closeLevelPanel(); }
    }
    return;
  }
  if (P.phase === 'spell' && P.t > 1.8) {
    P.card++;
    if (P.ev.learned[P.card]) { P.t = 0; showSpellCard(P.ev.learned[P.card]); } else closeLevelPanel();
  }
}
function showSpellCard(sp) {
  const node = $('lvpanel');

  node.innerHTML = `<div class="dq-title">A new spell!</div><div class="card"><div class="nm">${esc(sp.name)}</div>
    <div class="mp">${sp.mp} MP</div><div class="bl">${esc(sp.blurb || '')}</div></div>`;
  sfx('level_up_sparkle');
  sting('item_get');
}
function closeLevelPanel() {
  UI.panel = null; UI.waiting = null;
  const node = $('lvpanel');

}

function logEvent(ev) {

  log.appendChild(d);
  while (log.children.length > 60) log.firstChild.remove();
}

const tacticShort = (t) => (TACTICS.find((x) => x.id === t) || {}).name || '';
function renderParty() {

      + (UI.order.wagon.length ? `<div class="dq-win dq-shown wagonbox"><div class="wl">WAGON${snap.wagonReachable ? '' : ' · OUTSIDE'}</div>${UI.order.wagon.map(row).join('')}</div>` : '');
  }
  for (const id of UI.order.party.concat(UI.order.wagon)) {

function renderOverlay() {
  const ov = $('overlay');
  if (!UI.battle || !G.camera) return;

  const pickId = UI.menu && UI.menu.kind === 'target' && UI.menu.pending && UI.menu.side !== 'party' ? UI.menu.opts[UI.menu.idx] && UI.menu.opts[UI.menu.idx].v : null;

    if (!top || !base) continue;

// ------------------------------------------------------------------------------------------------ menus
function hideMenu() { UI.menu = null; $('cmd').classList.remove('dq-shown'); $('msg').classList.add('wide'); }

function showMenu(m) {
  const node = $('cmd');
  const was = node.classList.contains('dq-shown');

    `<div class="opt${i === m.idx ? ' sel' : ''}${o.dis ? ' dis' : ''}">${esc(o.label)}${o.r != null && o.r !== '' ? `<span class="r">${esc(o.r)}</span>` : ''}</div>`).join('')}</div>
    <div class="hint">${esc((m.opts[m.idx] && m.opts[m.idx].hint) || m.hint || '')}</div>`;
  if (moved) sfx('cursor');
}

function openCommand(actor) {
  UI.activeId = actor.id; renderParty();
  const bag = UI.battle.snapshot().bag;
  const opts = [
    { label: 'Attack', v: 'attack' }, { label: 'Spells', v: 'spells', dis: !actor.spells.some((s) => !s.field) },
    { label: 'Defend', v: 'defend' }, { label: 'Items', v: 'items', dis: !Object.keys(bag).some((k) => DATA.items[k] && DATA.items[k].battle && bag[k] > 0) },
    { label: 'Tactics', v: 'tactics', hint: 'Tell your friends how to fight. Only you give orders, unless you switch Follow Orders on.' },
    { label: 'Wagon', v: 'wagon', dis: !actor.canSwap.ok },
    { label: 'Flee', v: 'flee' }, { label: 'Fight!', v: 'fight', hint: 'Let everyone fight on their own this round.' },
  ];
  showMenu({ kind: 'command', actor, opts, grid: true, idx: UI.cmdIdx[actor.id] || 0, title: `${actor.name}` });
}

/** Nobody on Follow Orders can act (Bram is worn out, or asleep): the fight goes on, and you can still run or change Tactics. */
function openPartyMenu() {
  showMenu({ kind: 'party', actor: null, idx: 0, grid: false, title: 'Your friends fight on',
    opts: [{ label: 'Fight on', v: 'go' }, { label: 'Tactics', v: 'tactics' }, { label: 'Flee', v: 'flee' }] });
}

function openTactics(prev) {
  const list = UI.battle.tactics();
  const opts = list.filter((t) => !t.guest).map((t) => ({ label: t.name, v: t.id, r: t.leader ? 'Orders' : TACTICS.find((x) => x.id === t.tactic).name, dis: !t.canChange,
    hint: t.leader ? `${t.name} always does what you say.` : `${t.name}: ${TACTICS.find((x) => x.id === t.tactic).blurb}` }));
  const others = list.filter((t) => t.canChange);
  if (others.length > 1) opts.push({ label: 'Everybody', v: 'all', r: '', hint: 'The same Tactics for all your friends.' });
  showMenu({ kind: 'tacticWho', actor: prev && prev.actor, prev, idx: Math.min(1, opts.length - 1), title: 'Tactics', opts });
}

function openTacticChoice(who, prev) {
  const cur = who === 'all' ? null : (UI.battle.tactics().find((t) => t.id === who) || {}).tactic;
  const name = who === 'all' ? 'Everybody' : UI.battle.tactics().find((t) => t.id === who).name;
  const opts = TACTICS.map((t) => ({ label: t.name, v: t.id, r: t.id === cur ? '●' : '', hint: `${name} ${t.blurb}` }));
  showMenu({ kind: 'tactic', actor: prev.actor, who, prev, idx: Math.max(0, TACTICS.findIndex((t) => t.id === cur)), title: name, opts });
}

function refuse(text, back) { sfx('buzzer'); hideMenu(); UI.pendingMenu = back; enqueue([{ t: 'message', text }]); }

function doCommand(actorId, cmd, back) {
  const b = UI.battle;
  const r = b.command(actorId, cmd);
  if (!r.ok) { refuse(r.text, back); return r; }
  sfx('confirm');
  hideMenu();
  const n = b.needsCommand();
  if (n) openCommand(n); else enqueue(b.resolveRound());
  return r;
}

function choose() {
  const m = UI.menu; if (!m) return;
  const o = m.opts[m.idx]; if (!o) return;
  const b = UI.battle, snap = b.snapshot();
  const foes = snap.enemies.filter((e) => e.alive);
  const actorId = m.actor && m.actor.id;
  const targetMenu = (pending, pool, title, side) => { sfx('confirm'); showMenu({ kind: 'target', actor: m.actor, pending, prev: m, idx: 0, title, side,
    opts: pool.map((p) => ({ label: p.name, v: p.id, r: side === 'party' ? `H ${p.hp}` : '' })) }); };
  switch (m.kind) {
    case 'command':
      UI.cmdIdx[actorId] = m.idx;
      if (o.v === 'attack') return foes.length === 1 ? doCommand(actorId, { type: 'attack', target: foes[0].id }, m) : targetMenu({ type: 'attack' }, foes, 'Attack which one?');
      if (o.v === 'defend') return doCommand(actorId, { type: 'defend' }, m);
      if (o.v === 'flee') return doCommand(actorId, { type: 'flee' }, m);
      if (o.v === 'fight') { sfx('confirm'); hideMenu(); b.autoCommands('auto'); return enqueue(b.resolveRound()); }
      if (o.v === 'tactics') { sfx('confirm'); return openTactics(m); }
      if (o.v === 'spells') {
        if (o.dis) return refuse(`${m.actor.name} doesn't know any spells yet.`, m);
        sfx('confirm');
        return showMenu({ kind: 'spell', actor: m.actor, prev: m, idx: 0, title: `Spells · MP ${m.actor.mp}`,
          opts: m.actor.spells.map((s) => ({ label: s.name, v: s.id, r: s.mp, dis: !s.usable, s, hint: (DATA.spells[s.id] || {}).blurb || '' })) });
      }
      if (o.v === 'items') {
        if (o.dis) return refuse('The bag has nothing useful for a fight.', m);
        sfx('confirm');
        return showMenu({ kind: 'item', actor: m.actor, prev: m, idx: 0, title: 'The bag',
          opts: Object.entries(snap.bag).filter(([k, n]) => DATA.items[k] && n > 0).map(([k, n]) => ({ label: DATA.items[k].name, v: k, r: '×' + n, dis: !DATA.items[k].battle })) });
      }
      if (o.v === 'wagon') {
        if (!m.actor.canSwap.ok) return refuse(m.actor.canSwap.text, m);
        sfx('confirm');
        return showMenu({ kind: 'swapOut', actor: m.actor, prev: m, idx: 0, title: 'Who climbs up?',
          opts: snap.party.filter((p) => !p.leader).map((p) => ({ label: p.name, v: p.id, r: `H ${p.hp}` })) });
      }
      return;
    case 'party':
      if (o.v === 'go') { sfx('confirm'); hideMenu(); return enqueue(b.resolveRound()); }
      if (o.v === 'tactics') { sfx('confirm'); return openTactics(m); }
      if (o.v === 'flee') { const r = b.command(null, { type: 'flee' }); if (!r.ok) return refuse(r.text, m); sfx('confirm'); hideMenu(); return enqueue(b.resolveRound()); }
      return;
    case 'tacticWho':
      if (o.dis) return refuse(o.hint, m);
      sfx('confirm'); return openTacticChoice(o.v, m);
    case 'tactic': {
      const r = b.setTactic(m.who, o.v);
      if (!r.ok) return refuse(r.text, m.prev);
      sfx('confirm');
      syncFromSnapshot(); renderParty();
      // back to whoever needs a command now (switching Follow Orders on can add one; switching it off can remove one)
      hideMenu();
      const n = b.needsCommand();
      UI.pendingMenu = null;
      UI.afterMessages = () => { const nn = b.needsCommand(); if (nn) openCommand(nn); else openPartyMenu(); };
      return enqueue([{ t: 'message', text: r.text }]);
    }
    case 'spell': {
      const s = o.s;
      if (!s.usable) return refuse(s.field ? `${s.name} only works out on the road.` : `${m.actor.name} hasn't the puff for it.`, m);
      const sp = DATA.spells[s.id];
      if (sp.target === 'enemy') return foes.length === 1 ? doCommand(actorId, { type: 'spell', id: s.id, target: foes[0].id }, m) : targetMenu({ type: 'spell', id: s.id }, foes, `${s.name} on which one?`);
      if (['ally', 'fallen', 'self'].includes(sp.target)) {
        const pool = snap.party.filter((p) => (sp.target === 'fallen' ? !p.alive : p.alive));
        if (!pool.length) return refuse(sp.target === 'fallen' ? 'Nobody needs rousing.' : 'There is nobody to help.', m);
        return targetMenu({ type: 'spell', id: s.id }, pool, `${s.name} on whom?`, 'party');
      }
      return doCommand(actorId, { type: 'spell', id: s.id }, m);
    }
    case 'item': {
      const it = DATA.items[o.v];
      if (!it.battle) return refuse(`The ${it.name} won't help in a fight.`, m);
      if (it.battle.target === 'enemies') return doCommand(actorId, { type: 'item', id: it.id }, m);
      const pool = snap.party.filter((p) => (it.battle.effect === 'revive' ? !p.alive : p.alive));
      if (!pool.length) return refuse('Nobody needs it right now.', m);
      return targetMenu({ type: 'item', id: it.id }, pool, `The ${it.name} for whom?`, 'party');
    }
    case 'recruit': return answerRecruit(o.v === 'yes');
    case 'swapOut': {
      sfx('confirm');
      return showMenu({ kind: 'swap', actor: m.actor, out: o.v, prev: m, idx: 0, title: 'Who climbs down?',
        opts: snap.wagon.filter((p) => p.alive).map((p) => ({ label: p.name, v: p.id, r: `Lv ${p.lvl}` })) });
    }
    case 'swap': return doCommand(actorId, { type: 'swap', target: o.v, out: m.out }, m.prev.prev);
    case 'target': return doCommand(actorId, { ...m.pending, target: o.v }, m.prev);
    case 'end':
      sfx('confirm'); hideMenu();
      if (o.v === 'again') return startBattle({});
      if (o.v === 'inn') return restAtInn();
      if (o.v === 'boss') return startBattle({ boss: true });
      if (o.v === 'boss2') return startBattle({ boss: 2 });
      if (o.v === 'next') { UI.areaIdx = nextStoryArea(UI.areaIdx); restAtInn(true); UI.bag = null; return startBattle({ carry: true }); }
  }
}

const nextStoryArea = (i) => { let j = (i + 1) % AREAS.length; while (AREAS[j].stress) j = (j + 1) % AREAS.length; return j; };

function openEnd() {
  const a = AREAS[UI.areaIdx], r = UI.battle.result;
  const opts = [{ label: 'Walk on', v: 'again' }, { label: 'Rest at the inn', v: 'inn' }];
  if (a.boss) opts.push({ label: 'The boss', v: 'boss' });
  if (a.boss2) opts.push({ label: 'The last boss', v: 'boss2' });
  opts.push({ label: 'Next place', v: 'next' });
  showMenu({ kind: 'end', actor: null, opts, idx: 0, hint: `${UI.fights} fights · ${UI.gold} G · ${Object.entries(UI.bag || {}).map(([k, n]) => `${DATA.items[k].name} ×${n}`).join(', ') || 'no herbs'}`,
    title: r ? ({ victory: 'Victory!', defeat: 'Back at the church', fled: 'Got away!', scripted: 'Not this time' }[r.outcome]) : 'Done' });
  if (r && r.outcome !== 'defeat') music('overworld', { fade: 1.5 });
}

/** MONSTER-BIBLE §7: the monster gets up, looks at you, and asks. The question is the last thing on screen. */
function openRecruit(ev) {
  carryResult();
  UI.offer = ev.monster;
  UI.waiting = 'recruit';
  const m = DATA.monsters[ev.monster.species] || {};
  showMenu({ kind: 'recruit', actor: null, idx: 0, grid: false, title: 'Shall it come along?',
    opts: [{ label: 'Yes', v: 'yes' }, { label: 'No', v: 'no' }], hint: m.nameSuggest ? `It would like to be called ${m.nameSuggest}.` : '' });
}

function answerRecruit(yes) {
  const o = UI.offer; if (!o) return;
  UI.offer = null; UI.waiting = null;
  hideMenu();
  const mon = DATA.monsters[o.species];
  const out = [];
  if (yes) {
    sfx('confirm');
    const n = (UI.recruit.joined[o.species] || 0) + 1;
    UI.recruit = { ...UI.recruit, joined: { ...UI.recruit.joined, [o.species]: n } };
    const base = mon.nameSuggest || mon.name;
    const name = n > 1 ? `${base} ${['', '', 'II', 'III', 'IV', 'V'][n] || n}` : base;
    const hero = UI.carry.hero ? UI.carry.hero.lvl : UI.level;
    UI.friends.push(newCompanion(mon, { id: `${o.species}_${n}`, name, lvl: Math.max(1, hero - 2) }));
    out.push({ t: 'message', text: `${name} joined the party!` }, { t: 'message', text: `${name} hops up into the wagon, very pleased with itself. It will Fight Wisely.` });
    sfx('item_get');
  } else {
    sfx('cancel');
    UI.recruit = { ...UI.recruit, misses: { ...UI.recruit.misses, [o.species]: (UI.recruit.misses[o.species] || 0) + 1 } };
    out.push({ t: 'message', text: `The ${o.name} waves you off cheerfully and wanders home.` });
    const v = G.models.get('join'); if (v) guard('leave', () => v.m.play('defeat', { vanish: true }));
  }
  UI.queue.unshift(...out);           // …then the level-ups that were waiting behind the question
  UI.busy = true;
  if (UI.instant) flush();
}

function restAtInn(quiet) {
  const a = AREAS[UI.areaIdx];
  const lvl = UI.carry.hero ? UI.carry.hero.lvl : UI.level;
  const inn = Math.round((12 * lvl) / 5) * 5;
  UI.gold = Math.max(0, UI.gold - Math.min(UI.gold, inn));
  for (const k of Object.values(UI.carry)) { k.hp = undefined; k.mp = undefined; }
  // the shop next door: top the bag back up to what the area expects, while the purse allows
  const bag = UI.bag || {};
  let spent = 0;
  for (const [h, n] of Object.entries(a.bag || {})) while ((bag[h] || 0) < n && UI.gold >= (HERB_PRICE[h] || 999)) { UI.gold -= HERB_PRICE[h]; spent += HERB_PRICE[h]; bag[h] = (bag[h] || 0) + 1; }
  UI.bag = bag;
  if (quiet) return;
  sfx('inn_sleep');
  startBattle({ quiet: true });
  UI.queue.unshift({ t: 'message', text: `A night at the inn (${inn} G)${spent ? ` and ${spent} G of herbs` : ''}. Everybody is in the pink again.` });
}

function cancel() {
  const m = UI.menu; if (!m) return;
  if (m.kind === 'recruit') return answerRecruit(false);
  if (m.prev) { sfx('cancel'); return showMenu(m.prev); }
  if (m.kind === 'command') { const u = UI.battle.undoCommand(); if (u.ok && u.actor) { sfx('cancel'); openCommand(u.actor); } }
}

function move(dx, dy) {
  const m = UI.menu; if (!m) return;
  const n = m.opts.length;
  const before = m.idx;
  m.idx = m.grid ? Math.max(0, Math.min(n - 1, m.idx + dx + dy * 2)) : (m.idx + dy + dx + n) % n;
  if (m.idx !== before) sfx('cursor');
  showMenu(m);
}

function press(btn) {
  unlockAudio();
  if (UI.panel) { if (btn === 'confirm' && UI.panel.t > 0.9) { if (UI.panel.phase === 'stats' && UI.panel.ev.learned.length) { UI.panel.phase = 'spell'; UI.panel.t = 0; showSpellCard(UI.panel.ev.learned[0]); } else closeLevelPanel(); } return true; }
  if (UI.busy && !UI.waiting) { if (btn === 'confirm') UI.fast = true; return false; }
  switch (btn) {
    case 'up': move(0, -1); return true; case 'down': move(0, 1); return true;
    case 'left': move(-1, 0); return true; case 'right': move(1, 0); return true;
    case 'confirm': choose(); return true; case 'cancel': cancel(); return true;
  }
  return false;
}

const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Enter: 'confirm', Space: 'confirm', KeyZ: 'confirm', Escape: 'cancel', KeyX: 'cancel', Backspace: 'cancel' };
addEventListener('keydown', (e) => {
  guard('keys', () => {
    unlockAudio();
    if (KEYS[e.code]) { e.preventDefault(); press(KEYS[e.code]); return; }
    switch (e.code) {
      case 'KeyF': if (!UI.busy && UI.menu && UI.menu.kind === 'command') { UI.menu.idx = 7; choose(); } break;
      case 'KeyT': if (!UI.busy && UI.menu && ['command', 'party'].includes(UI.menu.kind)) openTactics(UI.menu); break;
      case 'KeyN': startBattle({}); break;
      case 'KeyB': if (AREAS[UI.areaIdx].boss) startBattle({ boss: true }); break;
      case 'BracketRight': UI.areaIdx = (UI.areaIdx + 1) % AREAS.length; startBattle({ fresh: true }); break;
      case 'BracketLeft': UI.areaIdx = (UI.areaIdx - 1 + AREAS.length) % AREAS.length; startBattle({ fresh: true }); break;
      case 'KeyL': UI.levelIdx = (UI.levelIdx + 1) % 3; startBattle({ fresh: true }); break;
      case 'KeyI': if (!UI.busy && UI.battle && UI.battle.over) restAtInn(); break;
      case 'KeyE': UI.logOn = !UI.logOn; $('side').hidden = !UI.logOn; $('side').classList.toggle('dq-shown', UI.logOn); break;
    }
  });
});
addEventListener('keyup', (e) => { if (KEYS[e.code] === 'confirm') UI.fast = false; });

// ================================================================================================= boot
Scenes.register('battle-stage', {
  opaque: true,
  enter() {
    guard('build', buildStage);
    App.onResize(() => { if (G.camera) { G.camera.aspect = App.aspect(); G.camera.updateProjectionMatrix(); } });
    guard('first battle', () => startBattle({ areaId: 'long_lane', level: 1, seed: 11 }));
  },
  update(dt) { frameTick(dt); guard('stage tick', () => tickStage(dt)); },
  render() {
    if (!G.scene) return;

    G.sky.clouds.rotation.y = t * 0.0035;
    G.kit.update(t, 1 / 60, G.camera);
    App.render(G.scene, G.camera);
  },
});
App.start({ version: 'P14-demo-5-tactics' });
Scenes.push('battle-stage');

// ================================================================================================= __DQ (via Debug)
const stateUi = () => ({ menu: UI.menu ? { kind: UI.menu.kind, options: UI.menu.opts.map((o) => o.label), idx: UI.menu.idx, title: UI.menu.title } : null,

Debug.provide('battle', () => { const s = UI.battle && UI.battle.snapshot(); return s ? { turn: s.round, phase: s.phase, leader: s.leader,
  enemies: s.enemies.map((e) => ({ id: e.id, name: e.name, hp: e.hp, maxHp: e.maxHp, alive: e.alive, telegraphing: !!e.telegraphing, bigCooldown: e.bigCooldown })) } : null; });
Debug.provide('party', () => { const s = UI.battle && UI.battle.snapshot(); return s ? s.party.map((p) => ({ id: p.id, name: p.name, hp: p.hp, mhp: p.maxHp, mp: p.mp, lvl: p.lvl, tactic: p.tactic, leader: p.leader })) : []; });

  levels: Object.fromEntries(Object.entries(UI.carry).map(([k, v]) => [k, v.lvl])), exp: Object.fromEntries(Object.entries(UI.carry).map(([k, v]) => [k, v.exp])),
  tactics: Object.fromEntries(Object.entries(UI.carry).map(([k, v]) => [k, v.tactic])), recruitOffer: UI.offer, bossWipes: UI.bossWipes || 0 }));
Debug.provide('ui', stateUi);

Debug.provide('battleErrors', () => (UI.battle ? UI.battle.errors.length : 0));
Debug.provide('stage', () => ({ built: G.built, buildMs: G.buildMs, preset: G.preset, dist: Math.round(10 * G.dist) / 10,
  models: [...G.models.entries()].map(([id, v]) => ({ id, species: v.species, model: modelId(v.species), standIn: isStandIn(v.species), gone: v.gone })) }));
Debug.provide('sound', () => ({ unlocked: SND.unlocked, ready: guard('ready', () => Audio.ready), music: SND.musicReady ? guard('music state', () => Music.state().theme) : null, theme: SND.theme, played: SND.played.slice(-12) }));

/**
 * __DQ.battle(...) — the ARCHITECTURE accessor forwards ONE argument (NEEDS F1: forward them all), so it takes
 *   ['gloop', 'gloop']                                   monsters here, in the area we are in
 *   'cobwell_manor'                                      that area, a fresh party at its level
 *   {area: 'cobwell_manor', boss: true, level: 7, seed}   everything
 * __DQ.fight(area, opts) is the same thing in two arguments.
 */
function startFrom(a, opts = {}) {
  if (Array.isArray(a)) startBattle({ ...opts, enemies: a.map((id) => (typeof id === 'string' ? { id, partyLevel: AREAS[UI.areaIdx].areaLevel, areaLevel: AREAS[UI.areaIdx].areaLevel } : id)) });
  else if (a && typeof a === 'object') { const { area, ...rest } = a; startBattle({ areaId: area, ...rest, ...opts }); }
  else startBattle({ areaId: a, ...opts });
  const snap = UI.battle.snapshot();
  return { area: AREAS[UI.areaIdx].id, boss: UI.isBoss, phase: snap.phase, party: snap.party.map((p) => ({ name: p.name, lvl: p.lvl, tactic: p.tactic })),
    enemies: snap.enemies.map((e) => ({ id: e.id, name: e.name, hp: e.hp })), battle: { turn: snap.round, phase: snap.phase } };
}
Debug.implement('battle', (a) => startFrom(a));
Debug.expose('fight', (area, opts) => startFrom(area, opts));
Debug.implement('press', (btn) => { press(btn); return stateUi(); });
Debug.expose('listAreas', () => AREAS.map((a) => ({ id: a.id, name: a.name, levels: a.levels, boss: a.boss ? a.boss.enemies : null })));
/** command({type:'attack', target:'e1'}) for whoever needs one; command('hero', {...}); command('resolve'). */
Debug.expose('command', (a, b) => {
  const bt = UI.battle; if (!bt) return { ok: false, text: 'no battle' };
  if (a === 'resolve') { hideMenu(); enqueue(bt.resolveRound()); return { ok: true }; }
  const n = bt.needsCommand();
  const id = typeof a === 'string' ? a : n && n.id;
  const cmd = typeof a === 'string' ? b : a;
  if (!id && !(cmd && cmd.type === 'flee')) return { ok: false, text: 'nobody needs a command' };
  return doCommand(id || null, cmd, UI.menu);
});
/** Tactics: tactic('linnet', 'orders') · tactic('all', 'watch_back') · tactic() lists them. */
Debug.expose('tactic', (who, t) => { const bt = UI.battle; if (!bt) return null; if (who == null) return bt.tactics(); const r = bt.setTactic(who, t); syncFromSnapshot(); renderParty(); if (UI.menu && UI.menu.kind === 'command' && !UI.busy) { const n = bt.needsCommand(); if (n) openCommand(n); else openPartyMenu(); } return r; });
/** Resolve up to n rounds instantly. policy: what Bram (and anyone on Follow Orders) does: 'auto' | 'mash' | 'smart'. */
Debug.expose('autoplay', (n = 99, policy = 'auto') => {
  const bt = UI.battle; if (!bt) return null;
  const was = UI.instant; UI.instant = true; hideMenu(); flush();
  let k = 0;
  while (!bt.over && k++ < n) enqueue(bt.autoRound(policy));
  flush(); UI.instant = was;
  if (!UI.busy && !UI.waiting) idle();
  return { phase: bt.phase, round: bt.round, outcome: bt.result ? bt.result.outcome : null };
});
Debug.expose('answer', (yes = true) => { if (!UI.offer) return false; answerRecruit(!!yes); return true; });
/** Watch the rest of the fight play itself at reading pace (the child's own policy for Bram: 'mash' | 'auto' | 'smart'). */
Debug.expose('playOut', (policy = 'auto') => { UI.autopilot = policy; if (!UI.busy && !UI.waiting && !UI.panel) idle(); return policy; });
Debug.expose('rest', () => { restAtInn(); return UI.gold; });
Debug.expose('log', (n = 30) => (UI.battle ? UI.battle.log.slice(-n).map((e) => `${e.t}${e.move ? ':' + e.move : ''}${e.actor ? '@' + e.actor : ''} ${e.text || ''}`.trim()) : []));
Debug.expose('instant', (v = true) => { UI.instant = !!v; if (UI.instant) flush(); return UI.instant; });
Debug.expose('assist', (s) => { UI.S = Number(s) || 0; return UI.S; });
Debug.expose('level', (i) => { UI.levelIdx = Math.max(0, Math.min(2, i)); return UI.levelIdx; });
Debug.expose('rngSeed', (n) => { UI.rng = makeRng(n); return n; });
Debug.expose('idle', () => !UI.busy || !!UI.waiting);
Debug.expose('eventLog', (on = true) => { UI.logOn = !!on; $('side').hidden = !on; $('side').classList.toggle('dq-shown', !!on); return UI.logOn; });
Debug.expose('audio', () => { unlockAudio(); return SND.unlocked; });
/**
 * What Tactics are worth, measured in the page: n boss fights where the child only ever presses Attack for Bram —
 * once with everybody else on "Fight Wisely" (the way DQV plays), once with everybody switched to "Follow Orders" and
 * mashed (the way this demo used to work). -> {tactics, orders} win rates.
 */
Debug.expose('mashTest', (areaId, { n = 30, boss = 1, seed = 11, level } = {}) => {
  const area = AREAS.find((a) => a.id === (areaId || AREAS[UI.areaIdx].id));
  const spec = area && (boss === 2 ? area.boss2 : area.boss);
  if (!spec) return null;
  const L = level ?? spec.level;
  const run = (tactics) => {
    const rng = makeRng(seed);
    let wins = 0; const rounds = [];
    for (let i = 0; i < n; i++) {
      const { members, bag } = walkArea(area, L, rng, { spec });
      const r = simFight(rng, members, spec.enemies, { bag, gold: 500, ambush: 'none', wagonReachable: false, tactics }, 'mash');
      if (r.res && r.res.outcome === 'victory') { wins++; rounds.push(r.res.rounds); }
    }
    return { win: Math.round(100 * wins / n) + '%', rounds: rounds.length ? Math.round(10 * rounds.reduce((a, b) => a + b, 0) / rounds.length) / 10 : null, presses: rounds.length ? null : null };
  };
  return { boss: spec.enemies.join('+'), level: L, n, tactics: run(undefined), everyoneOnOrders: run('orders') };
});
/**
 * Agents cannot hear, so the fight can be rendered: `node tools/audio-probe.mjs --url …/demos/P14.html --ids fight,battle`.
 *   'fight'          the last fight actually played here: P27's battle (or boss) theme with every P28 effect landing
 *                    where it landed on screen — the real rhythm of the real fight, through the same mixer
 *   'battle' | 'boss' | 'victory' | 'levelup' | any CANON §9 theme id   the score alone
 *   any Sfx id ('sword_hit', 'monster_defeat', …)                       that effect alone
 */
/**
 * Play a fight on a virtual clock (no waiting) so `renderAudio('fight')` has a real fight's timings to render: the
 * queue, the typing, the holds and the Tactics AI all run exactly as they do on screen, 60 steps a second.
 */
function playFightForSound(seconds) {
  const area = AREAS[UI.areaIdx];
  SND.vt = 0; SND.log = []; SND.t0 = 0;
  startBattle({ areaId: area.id, carry: true, quiet: true });
  UI.autopilot = 'mash';
  const step = 1 / 60;
  for (let i = 0; i < Math.ceil(seconds * 60) && SND.vt < seconds; i++) {
    SND.vt += step;
    guard('sound tick', () => tick(step * 1000));
    if (!UI.busy && !UI.waiting && !UI.panel && UI.battle && !UI.battle.over) guard('sound idle', idle);
  }
  SND.vt = null; UI.autopilot = null;
  return SND.log.length;
}

async function renderTheFight(seconds) {
  const theme = SND.theme || 'battle';
  const [{ THEMES, ALIASES }, { instrumentsFor }, M] = await Promise.all([
    import('/src/audio/score/index.js'), import('/src/audio/instruments.js'), import('/src/audio/music.js')]);
  const th = THEMES[(ALIASES && ALIASES[theme]) || theme];
  const need = th && typeof instrumentsFor === 'function' ? instrumentsFor(th.events) : [];
  const shots = SND.log.filter((e) => e.t < seconds - 0.2 && !e.id.startsWith('sting:'));
  return Audio.renderOffline(async (octx, dest) => {
    if (need.length) { try { const { Sampler } = await import('/src/audio/sampler.js'); await Sampler.load(octx, need); } catch (e) { reportError('P14 samples', e); } }
    const m = M.createMusic();
    m.init({ ctx: octx, output: dest.bus('music'), reverbSend: dest.reverbSend, quality: 'high' });
    for (let k = 1; k * 0.2 < seconds + 0.25; k++) octx.suspend(k * 0.2).then(() => { try { m._pump(); } catch (_) { /* keep rendering */ } octx.resume(); }).catch(() => {});
    m.play(theme, { fade: 0, at: 0.02 });
    m._pump();
    for (const e of shots) Sfx.renderInto(e.id, dest, Math.max(0.05, e.t), { variant: e.variant });
    return m;
  }, seconds, { sampleRate: 48000 });
}
Debug.expose('renderAudio', (id = 'fight', seconds = 12) => {
  if (id === 'fight') { if (SND.log.filter((e) => e.t < seconds).length < 6) guard('sound fight', () => playFightForSound(seconds)); return renderTheFight(seconds); }
  if (Sfx.list().includes(id)) return Sfx.render(id, seconds);
  return Music.renderOffline(id, seconds);
});
Debug.expose('soundLog', () => SND.log.slice(-40));

/** Does the level you arrive at matter? n boss fights instantly at the boss's level + each delta, first try, S = 0. */
Debug.expose('levels', (areaId, { n = 40, deltas = [-4, -2, 0, 4], policy = 'auto', fresh = false, boss = 1, seed = 7 } = {}) => {
  const area = AREAS.find((a) => a.id === (areaId || AREAS[UI.areaIdx].id));
  const spec = area && (boss === 2 ? area.boss2 : area.boss);
  if (!spec) return null;
  const rng = makeRng(seed);
  return deltas.map((d) => {
    const level = Math.max(1, Math.min(30, spec.level + d));
    let wins = 0; const rounds = [], left = [];
    for (let i = 0; i < n; i++) {
      const { members, bag } = walkArea(area, level, rng, { fresh, spec });
      const r = simFight(rng, members, spec.enemies, { bag, gold: 500, ambush: 'none', wagonReachable: false }, policy);
      if (r.res && r.res.outcome === 'victory') { wins++; rounds.push(r.res.rounds); left.push(r.left); }
    }
    const avg = (a) => (a.length ? Math.round(10 * a.reduce((x, y) => x + y, 0) / a.length) / 10 : null);
    return { delta: d, level, win: Math.round(100 * wins / n) + '%', rounds: avg(rounds), hpLeft: left.length ? Math.round(100 * left.reduce((x, y) => x + y, 0) / left.length) + '%' : null };
  });
});
