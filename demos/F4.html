<script type="module">
// F4 — the UI shell. A painted Aldenmoor sky (through the real engine: App + Scenes + Loop), then the three
// objects every Dragon Quest player knows by heart: the message window typing a warm line, the command window
// with its cursor, and the Yes/No prompt. Keys: arrows / WASD move, Enter / Space / Z confirm, Esc / X back.
// Input is the real F2 (input.js -> Scenes.input -> the scene's onInput -> UI.input); colours are the real F3 PAL.
import * as THREE from 'three';
import { App } from '/src/engine/app.js';
import { Scenes } from '/src/engine/states.js';
import { Debug, reportError } from '/src/engine/debug.js';
import { Input } from '/src/engine/input.js';
import { makeRng } from '/src/engine/rng.js';
import { PAL, css, mixHex, lerp, clamp01 } from '/src/art/palette.js';
import { Audio } from '/src/audio/audio.js';
import { UI } from '/src/ui/window.js';
import { MessageBox, Text } from '/src/ui/text.js';
import { Font } from '/src/ui/font.js';

// ── tiny paint helpers (every colour comes from PAL) ────────────────────────────────────────────────────────
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function vnoise1(x, seed) {
  const h = (i) => { let v = Math.imul(i ^ seed, 374761393); v = Math.imul(v ^ (v >>> 13), 1274126177); return ((v ^ (v >>> 16)) >>> 0) / 4294967296; };
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(h(i), h(i + 1), u);
}
const fbm1 = (x, seed) => 0.55 * vnoise1(x, seed) + 0.3 * vnoise1(x * 2.3, seed + 7) + 0.15 * vnoise1(x * 5.1, seed + 13);

const W = 1920, H = 1080;

function paintSky() {
  const c = canvas(W, H), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, H * 0.66);
  gr.addColorStop(0, mixHex(PAL.sky.zenith, PAL.sky.upper, 0.18));
  gr.addColorStop(0.5, PAL.sky.upper);
  gr.addColorStop(1, PAL.sky.horizon);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const sx = W * 0.8, sy = H * 0.12;
  const sg = g.createRadialGradient(sx, sy, 0, sx, sy, W * 0.5);
  sg.addColorStop(0, css(PAL.sky.sunGlow, 0.75)); sg.addColorStop(0.12, css(PAL.sky.sunGlow, 0.32)); sg.addColorStop(0.45, css(PAL.sky.sunGlow, 0.08)); sg.addColorStop(1, css(PAL.sky.sunGlow, 0));
  g.fillStyle = sg; g.fillRect(0, 0, W, H);
  const hz = g.createLinearGradient(0, H * 0.46, 0, H * 0.66);
  hz.addColorStop(0, css(PAL.sky.haze, 0)); hz.addColorStop(1, css(PAL.sky.haze, 0.7));
  g.fillStyle = hz; g.fillRect(0, H * 0.46, W, H * 0.3);
  // Highfeather: the castle in the clouds, faintly there from the very first minute (CANON §2)
  const cx = W * 0.3, cy = H * 0.215, pale = mixHex(PAL.sky.upper, PAL.cloud.mid, 0.55);
  g.save(); g.globalAlpha = 0.5; g.fillStyle = pale;
  const tower = (x, w, hgt, roof) => { g.fillRect(x - w / 2, cy - hgt, w, hgt); g.beginPath(); g.moveTo(x - w / 2 - 3, cy - hgt); g.lineTo(x, cy - hgt - roof); g.lineTo(x + w / 2 + 3, cy - hgt); g.fill(); };
  g.fillRect(cx - 70, cy - 36, 140, 36);
  tower(cx, 30, 92, 44); tower(cx - 48, 20, 62, 30); tower(cx + 50, 22, 68, 32); tower(cx - 84, 14, 44, 22); tower(cx + 86, 14, 48, 22);
  g.restore();
  cumulus(g, cx, cy + 18, 0.95, makeRng('highfeather'), { alpha: 0.9, tint: 0.25 });
  return c;
}

/** One painted cumulus (ART-DIRECTION §9m recipe, scaled), composited from its own canvas. */
function cumulus(dst, cx, base, s, rnd, o = {}) {
  const CW = Math.ceil(620 * s), CH = Math.ceil(300 * s);
  const c = canvas(CW, CH), g = c.getContext('2d');
  const ox = CW / 2, by = CH - 16 * s;
  const span = (300 + rnd.next() * 110) * s, x0 = ox - span / 2, n = 5 + (rnd.next() * 2 | 0);
  const puffs = [];
  for (let i = 0; i < n; i++) { const t = (i + 0.5) / n; puffs.push({ x: x0 + t * span + (rnd.next() - 0.5) * 14 * s, y: by - (24 + rnd.next() * 10) * s, r: (34 + rnd.next() * 14) * s }); }
  const m = 3 + (rnd.next() * 3 | 0);
  for (let i = 0; i < m; i++) { const t = (i + 0.5) / m; puffs.push({ x: x0 + span * 0.15 + t * span * 0.7 + (rnd.next() - 0.5) * 24 * s, y: by - (62 + rnd.next() * 22 + Math.sin(t * 3.14) * 24) * s, r: (40 + rnd.next() * 16 + Math.sin(t * 3.14) * 14) * s }); }
  for (let i = 0; i < 1 + (rnd.next() * 2 | 0); i++) puffs.push({ x: ox + (rnd.next() - 0.5) * span * 0.35, y: by - (118 + rnd.next() * 26) * s, r: (40 + rnd.next() * 16) * s });
  for (const p of puffs.slice()) if (p.r > 38 * s) for (let k = 0; k < 2; k++) { const a = -2.6 + rnd.next() * 2.0; puffs.push({ x: p.x + Math.cos(a) * p.r * 0.78, y: p.y + Math.sin(a) * p.r * 0.78, r: p.r * (0.32 + rnd.next() * 0.16) }); }
  puffs.sort((p, q) => q.y - p.y);
  g.save(); g.beginPath(); g.rect(0, 0, CW, by); g.clip();
  for (const p of puffs) {
    const hgt = clamp01((by - p.y) / (150 * s));
    const outer = hgt > 0.35 ? mixHex(PAL.cloud.mid, PAL.cloud.warm, (hgt - 0.35) * 0.9) : mixHex(PAL.cloud.shade, PAL.cloud.mid, hgt / 0.35);
    const inner = mixHex(PAL.cloud.mid, PAL.cloud.lit, 0.35 + 0.65 * hgt);
    const gr = g.createRadialGradient(p.x - p.r * 0.38, p.y - p.r * 0.42, p.r * 0.05, p.x - p.r * 0.12, p.y - p.r * 0.12, p.r * 1.02);
    gr.addColorStop(0, PAL.cloud.lit); gr.addColorStop(0.35, inner); gr.addColorStop(0.72, mixHex(inner, PAL.cloud.warm, 0.4)); gr.addColorStop(1, outer);
    g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
  }
  g.globalCompositeOperation = 'source-atop';
  const bg = g.createLinearGradient(0, by - 46 * s, 0, by);
  bg.addColorStop(0, css(PAL.cloud.core, 0)); bg.addColorStop(1, css(PAL.cloud.core, 0.55));
  g.fillStyle = bg; g.fillRect(0, by - 46 * s, CW, 46 * s);
  if (o.tint) { g.fillStyle = css(PAL.sky.haze, o.tint); g.fillRect(0, 0, CW, CH); }
  g.restore();
  const draw = (x) => { dst.save(); dst.globalAlpha = o.alpha ?? 1; dst.filter = `blur(${Math.max(0.6, 1.3 * s).toFixed(2)}px)`; dst.drawImage(c, x - ox, base - by); dst.restore(); };
  draw(cx);
  if (o.wrap) { draw(cx - dst.canvas.width); draw(cx + dst.canvas.width); }
}

function paintClouds(seed, list) {
  const c = canvas(W, H), g = c.getContext('2d'), rnd = makeRng(seed);
  for (const cl of list) cumulus(g, cl.x * W, cl.y * H, cl.s, rnd, { wrap: true, alpha: cl.a ?? 1, tint: cl.tint || 0 });
  return c;
}

function ridge(g, y0, amp, seed, freq, colTop, colBot, opts = {}) {
  const pts = [];
  for (let x = -10; x <= W + 10; x += 6) {
    let t = fbm1(x / W * freq + seed * 0.13, seed);
    if (opts.peaky) t = Math.pow(t, opts.peaky);
    pts.push([x, y0 - t * amp]);
  }
  const top = Math.min(...pts.map(p => p[1]));
  const gr = g.createLinearGradient(0, top, 0, opts.bottom ?? H);
  gr.addColorStop(0, colTop); gr.addColorStop(1, colBot);
  g.beginPath(); g.moveTo(-10, H + 10);
  for (const [x, y] of pts) g.lineTo(x, y);
  g.lineTo(W + 10, H + 10); g.closePath();
  g.fillStyle = gr; g.fill();
  if (opts.rim) { g.save(); g.clip(); g.strokeStyle = opts.rim; g.lineWidth = opts.rimW || 6; g.beginPath(); for (const [x, y] of pts) g.lineTo(x, y + 3); g.stroke(); g.restore(); }
  return (x) => { const i = Math.max(0, Math.min(pts.length - 1, Math.round((x + 10) / 6))); return pts[i][1]; };
}

function tree(g, x, y, r, rnd) {
  const blobs = [];
  const n = 4 + (rnd.next() * 3 | 0);
  for (let i = 0; i < n; i++) { const a = -Math.PI * (0.1 + 0.8 * i / (n - 1)); blobs.push({ x: x + Math.cos(a) * r * 0.55, y: y - r * 1.05 + Math.sin(a) * r * 0.5, r: r * (0.5 + rnd.next() * 0.18) }); }
  blobs.push({ x, y: y - r * 1.25, r: r * 0.62 });
  g.fillStyle = css(PAL.outline.leaf, 0.35); g.beginPath(); g.ellipse(x + r * 0.2, y + 2, r * 0.9, r * 0.22, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = PAL.foliage.trunk; g.fillRect(x - r * 0.1, y - r * 0.5, r * 0.2, r * 0.52);
  g.fillStyle = PAL.outline.leaf;
  for (const b of blobs) { g.beginPath(); g.arc(b.x, b.y, b.r + 2.6, 0, Math.PI * 2); g.fill(); }
  for (const b of blobs) {
    const gr = g.createRadialGradient(b.x - b.r * 0.4, b.y - b.r * 0.5, b.r * 0.1, b.x, b.y, b.r * 1.05);
    gr.addColorStop(0, PAL.foliage.sun); gr.addColorStop(0.35, PAL.foliage.light); gr.addColorStop(0.8, PAL.foliage.mid); gr.addColorStop(1, PAL.foliage.dark);
    g.fillStyle = gr; g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill();
  }
}

function house(g, x, y, w, roof, rnd) {
  const hgt = w * 0.55;
  g.fillStyle = css(PAL.outline.char, 0.25); g.fillRect(x - w / 2 - 2, y - 2, w + 6, 5);
  g.fillStyle = PAL.plaster.mid; g.fillRect(x - w / 2, y - hgt, w, hgt);
  g.fillStyle = PAL.plaster.light; g.fillRect(x - w / 2, y - hgt, w * 0.55, hgt);
  g.fillStyle = PAL.outline.char; g.fillRect(x - w * 0.08, y - hgt * 0.55, w * 0.16, hgt * 0.55);
  g.fillStyle = roof === 'tile' ? PAL.tile.mid : PAL.thatch.light;
  g.beginPath(); g.moveTo(x - w * 0.66, y - hgt + 2); g.lineTo(x, y - hgt - w * 0.5); g.lineTo(x + w * 0.66, y - hgt + 2); g.closePath(); g.fill();
  g.fillStyle = css(roof === 'tile' ? PAL.tile.dark : PAL.thatch.mid, 0.8);
  g.beginPath(); g.moveTo(x, y - hgt - w * 0.5); g.lineTo(x + w * 0.66, y - hgt + 2); g.lineTo(x + w * 0.1, y - hgt + 2); g.closePath(); g.fill();
}

function paintLand() {
  const c = canvas(W, H), g = c.getContext('2d'), rnd = makeRng('f4-land');
  // far lavender mountains, pre-hazed
  ridge(g, H * 0.575, H * 0.2, 91, 7.5, mixHex(PAL.hill.far, PAL.sky.haze, 0.35), mixHex(PAL.hill.far, PAL.sky.haze, 0.6), { peaky: 2.2, bottom: H * 0.6 });
  ridge(g, H * 0.6, H * 0.21, 81, 5.2, mixHex(PAL.hill.far, PAL.cloud.lit, 0.15), mixHex(PAL.hill.farLow, PAL.sky.haze, 0.35), { peaky: 2.4, bottom: H * 0.62 });
  // mid blue-green downs
  ridge(g, H * 0.655, H * 0.095, 71, 4.1, mixHex(PAL.hill.mid, PAL.sky.haze, 0.22), mixHex(PAL.hill.midLow, PAL.sky.haze, 0.18), { bottom: H * 0.7 });
  // near hills with a village
  const nearY = ridge(g, H * 0.715, H * 0.085, 61, 2.6, PAL.hill.near, PAL.hill.nearLow, { bottom: H * 0.82, rim: css(PAL.grass.tip, 0.35), rimW: 5 });
  const vx = W * 0.64;
  for (const [dx, w, roof] of [[-70, 30, 'thatch'], [-25, 36, 'tile'], [30, 28, 'thatch'], [72, 34, 'tile']]) house(g, vx + dx, nearY(vx + dx) + 10, w, roof, rnd);
  // church spire
  const chx = vx + 120, chy = nearY(chx) + 10;
  g.fillStyle = PAL.stone.light; g.fillRect(chx - 10, chy - 62, 20, 62); g.fillStyle = PAL.tile.dark;
  g.beginPath(); g.moveTo(chx - 14, chy - 60); g.lineTo(chx, chy - 96); g.lineTo(chx + 14, chy - 60); g.fill();
  for (let i = 0; i < 16; i++) { const x = rnd.float(0, W); if (Math.abs(x - vx) < 190) continue; tree(g, x, nearY(x) + rnd.float(8, 30), rnd.float(14, 22), rnd); }
  // meadow
  const meadowY = ridge(g, H * 0.8, H * 0.05, 51, 1.7, PAL.grass.light, PAL.grass.deep, { rim: css(PAL.grass.tip, 0.45), rimW: 6 });
  for (let i = 0; i < 90; i++) {
    const x = rnd.float(0, W), y = rnd.float(H * 0.8, H), r = rnd.float(30, 120);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const col = rnd.chance(0.5) ? PAL.grass.sun : PAL.grass.clump;
    gr.addColorStop(0, css(col, 0.28)); gr.addColorStop(1, css(col, 0));
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // the lane, winding up to the village
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  const lane = (wid, col) => {
    g.strokeStyle = col; g.lineWidth = wid; g.beginPath();
    g.moveTo(W * 0.46, H + 40);
    g.bezierCurveTo(W * 0.52, H * 0.92, W * 0.4, H * 0.86, W * 0.5, H * 0.8);
    g.bezierCurveTo(W * 0.56, H * 0.77, W * 0.62, H * 0.76, vx - 10, nearY(vx - 10) + 16);
    g.stroke();
  };
  lane(58, css(PAL.dirt.dark, 0.35)); lane(46, PAL.dirt.base); lane(26, css(PAL.dirt.light, 0.9));
  g.restore();
  for (let i = 0; i < 9; i++) { const x = rnd.float(0, W); if (Math.abs(x - W * 0.47) < 160) continue; tree(g, x, meadowY(x) + rnd.float(20, 60), rnd.float(26, 40), rnd); }
  // flowers
  const fcols = [PAL.flower.white, PAL.flower.yellow, PAL.flower.pink, PAL.flower.white, PAL.flower.blue];
  for (let i = 0; i < 520; i++) {
    const x = rnd.float(0, W), y = rnd.float(H * 0.84, H);
    const s = lerp(1.6, 4.2, (y - H * 0.84) / (H * 0.16));
    g.fillStyle = css(PAL.grass.clump, 0.35); g.beginPath(); g.arc(x + 1, y + 1.5, s, 0, Math.PI * 2); g.fill();
    g.fillStyle = fcols[i % fcols.length]; g.beginPath(); g.arc(x, y, s, 0, Math.PI * 2); g.fill();
  }
  return c;
}

// ── the backdrop scene (App + Scenes, so __DQ.freeze / advance and the ui clock all agree) ───────────────────
function makeBackdrop() {
  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(0, 1, 1, 0, -10, 10);
  const quads = [];
  const t3 = { scene: new THREE.Scene(), cam: new THREE.PerspectiveCamera(38, 16 / 9, 0.1, 100), items: [], visible: false };
  let clockS = 0;
  const texOf = (cv, repeatX) => {
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
    if (repeatX) t.wrapS = THREE.RepeatWrapping;
    return t;
  };
  const quad = (tex, z, transparent, drift = 0) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: tex, transparent, depthTest: false, depthWrite: false }));
    m.position.set(0.5, 0.5, z); m.renderOrder = z; scene.add(m); quads.push({ m, tex, drift, off: 0 });
  };
  return {
    name: 'backdrop', opaque: true,
    enter() {
      const t0 = performance.now();
      quad(texOf(paintSky()), 0, false);
      quad(texOf(paintClouds('f4-far', [
        { x: 0.08, y: 0.5, s: 0.62, tint: 0.3, a: 0.9 }, { x: 0.36, y: 0.47, s: 0.5, tint: 0.35, a: 0.85 }, { x: 0.57, y: 0.52, s: 0.7, tint: 0.3, a: 0.9 },
        { x: 0.83, y: 0.49, s: 0.55, tint: 0.35, a: 0.85 }]), true), 1, true, 0.0035);
      quad(texOf(paintClouds('f4-near', [
        { x: 0.12, y: 0.34, s: 1.35 }, { x: 0.55, y: 0.4, s: 1.7 }, { x: 0.9, y: 0.26, s: 1.15 }, { x: 0.72, y: 0.12, s: 0.8, tint: 0.1 }]), true), 2, true, 0.009);
      quad(texOf(paintLand()), 3, true);
      this.buildMs = Math.round(performance.now() - t0);
      // canvas-rendered text living in 3D (font.js): a place card and battle numbers
      t3.cam.position.set(0, 0, 10); t3.cam.lookAt(0, 0, 0);
      const place = Font.sprite('Puddlewick Vale', { size: 110, fill: 'ink', fill2: 'title-ink', outline: 'win-bot', height: 1.25 });
      place.position.set(0, 1.9, 0); t3.scene.add(place); t3.items.push({ sp: place, kind: 'title' });
      const nums = [['17', { fill: 'ink', outline: 'ink-shadow' }, -3.2, 0], ['34', { fill: 'gold', fill2: 'orange', outline: 'win-bot' }, 0, 0.35], ['Miss', { fill: 'grey', outline: 'ink-shadow' }, 3.2, 0.7]];
      for (const [txt, st, x, delay] of nums) {
        const sp = Font.sprite(txt, { size: 120, ...st, height: txt === '34' ? 1.5 : 1.05 });
        sp.position.set(x, -0.6, 0); t3.scene.add(sp); t3.items.push({ sp, kind: 'pop', x, delay });
      }
    },
    update(dt) {
      clockS += dt;
      for (const q of quads) if (q.drift) q.off = (q.off + dt * q.drift) % 1;
    },
    render() {
      const A = App.aspect(), IA = 16 / 9;
      for (const q of quads) {
        if (A > IA) { q.tex.repeat.set(1, IA / A); q.tex.offset.set(q.off, (1 - IA / A) * 0.5); }
        else { q.tex.repeat.set(A / IA, 1); q.tex.offset.set((1 - A / IA) * 0.5 + q.off, 0); }
      }
      App.render(scene, cam);
      if (t3.visible) {
        t3.cam.aspect = A; t3.cam.updateProjectionMatrix();
        const t = UI.time;
        for (const it of t3.items) {
          const b = it.sp.userData.baseScale;
          if (it.kind === 'title') { it.sp.position.y = 1.9 + Math.sin(t * 1.3) * 0.06; continue; }
          const ph = ((t - it.delay) % 1.9 + 1.9) % 1.9;
          const pop = ph < 0.12 ? lerp(0.4, 1.15, ph / 0.12) : ph < 0.26 ? lerp(1.15, 1, (ph - 0.12) / 0.14) : 1;
          it.sp.scale.set(b.x * pop, b.y * pop, 1);
          it.sp.position.y = -0.6 + Math.min(ph, 0.9) * 0.55;
          it.sp.material.opacity = ph > 1.3 ? Math.max(0, 1 - (ph - 1.3) / 0.4) : 1;
        }
        App.render(t3.scene, t3.cam);
      }
    },
    onInput(btn) { UI.input(btn); },
    t3,
  };
}

// ── boot ────────────────────────────────────────────────────────────────────────────────────────────────────
// ?input=raw boots WITHOUT F2, to prove window.js's raw-keyboard fallback on a bare page.
const RAW_INPUT = new URLSearchParams(location.search).get('input') === 'raw';
App.start({ version: '0.1.0-f4-demo', beforeUpdate: RAW_INPUT ? undefined : Input.update });
if (!RAW_INPUT) Input.init();
Audio.init();
UI.install();
Scenes.register('backdrop', makeBackdrop);
Scenes.push('backdrop');

// ── the director ────────────────────────────────────────────────────────────────────────────────────────────
const box = new MessageBox({ id: 'message' });
let G = 0;
let stage = 'boot';
let gold = 30;
const party = [
  { name: 'Bram', hp: 24, mhp: 24, mp: 6, mmp: 6, lvl: 3 },
  { name: 'Bobble', hp: 17, mhp: 19, mp: 0, mmp: 0, lvl: 2 },
];

function partyContent() {
  return UI.cols(party.map(p => [
    UI.h('div.dq-pname', p.name),
    UI.row(UI.label('H'), String(p.hp)),
    UI.row(UI.label('M'), String(p.mp)),
    UI.row(UI.label('Lv'), String(p.lvl)),
  ]));
}
const goldContent = () => UI.row(UI.label('G'), String(gold));

async function flowDialogue(g) {
  stage = 'dialogue';
  const ok = () => g === G;
  await UI.wait(0.35); if (!ok()) return;
  await box.say([
    '{name}Halvard:{/name} "Up you get, lad. The wagon\'s packed, and Parsnip is in his harness."',
    '{name}Halvard:{/name} "He has {gold}opinions{/gold} about waiting. Boots on, if you would."',
  ], { voice: 'halvard' });
  if (!ok()) return;
  await box.say('{name}Bobble:{/name} "Frankly, Bobble has been ready since yesterday. Bobble is extremely {wave}punctuated{/wave}."', { voice: 'bobble' });
  if (!ok()) return;
  await box.say('{name}Halvard:{/name} "Very good, Bubble. Mind the step."', { voice: 'halvard' });
  if (!ok()) return;
  await box.say('{name}Bobble:{/name} "{wait:250}{shake}{big}BOBBLE.{/big}{/shake}"', { voice: 'bobble' });
  if (!ok()) return;
  await box.close(); if (!ok()) return;
  await UI.wait(0.3); if (!ok()) return;
  flowCommand(g);
}

async function sayAndBack(g, line) {
  await Promise.all(['command', 'party', 'gold'].map(id => UI.get(id) && UI.get(id).close()));
  if (g !== G) return false;
  await box.say(line, { voice: 'narrator' });
  if (g !== G) return false;
  await box.close();
  return g === G;
}

async function flowCommand(g, jump) {
  stage = 'command';
  const ok = () => g === G;
  let initial = 'talk';
  for (;;) {
    const cmd = UI.get('command') && !UI.get('command').destroyed ? UI.get('command') : UI.menu({
      id: 'command', left: 34, top: 30, columns: 2, colGap: 30, origin: '0% 0%',
      items: ['Talk', 'Spells', 'Status', 'Items', 'Equip', 'Search'], initial,
    });
    const pw = UI.get('party') || UI.window({ id: 'party', left: 468, top: 30, slim: true, origin: '50% 0%', content: partyContent(), className: 'dq-party' });
    const gw = UI.get('gold') || UI.window({ id: 'gold', left: 34, top: 222, width: 208, slim: true, origin: '0% 0%', content: goldContent() });
    cmd.open(); await UI.wait(0.05); if (!ok()) return;
    pw.open(); await UI.wait(0.04); if (!ok()) return;
    gw.open();
    let it;
    if (jump) { cmd.setIndex(cmd.items.find(x => x.id === jump).index, { snap: true }); it = cmd.items[cmd.index]; cmd.focus(); await UI.wait(0.2); jump = null; }
    else it = await cmd.choose();
    if (!ok()) return;
    if (!it) break;
    initial = it.id;
    if (it.id === 'items') { if (!(await flowItems(g, cmd))) return; continue; }
    if (it.id === 'status') { if (!(await flowStatus(g))) return; continue; }
    const lines = {
      talk: 'Bram says good morning to a butterfly. The butterfly has places to be.',
      spells: 'Bram doesn\'t know any spells yet. He has been practising the face for it.',
      equip: 'Bram is wearing everything he owns, and most of it is {green}cloak{/green}.',
      search: 'Bram searches the grass.{wait:350} A beetle searches him back.',
    };
    if (!(await sayAndBack(g, lines[it.id]))) return;
  }
  await Promise.all(['party', 'gold'].map(id => UI.get(id) && UI.get(id).close()));
  if (!ok()) return;
  flowInn(g);
}

async function flowItems(g, cmd) {
  stage = 'items';
  const bag = UI.menu({
    id: 'items', title: 'Bram', left: 300, top: 150, width: 430, maxRows: 5, origin: '0% 0%', destroyOnClose: true,
    items: [
      { label: 'Herb', right: '×3' }, { label: 'Nutcake', right: '×1' }, { label: 'Antidote Drop', right: '×1' },
      { label: 'Homing Feather', right: '×2' }, { label: 'Papa\'s Boots', color: 'gold' }, '-',
      { label: 'Wooden Sword', right: 'E' }, { label: 'Travelling Cloak', right: 'E' },
    ],
  });
  for (;;) {
    const it = await bag.choose();
    if (g !== G) return false;
    if (!it) { stage = 'command'; return true; }
    stage = 'item-use';
    const use = UI.menu({ id: 'item-use', left: 752, top: 214, slim: true, origin: '0% 0%', destroyOnClose: true,
      items: ['Use', 'Give', { label: 'Drop', disabled: it.id === 'papa_s_boots' }] });
    const act = await use.choose();
    if (g !== G) return false;
    stage = 'items';
    if (!act) continue;
    use.close();
    bag.close();
    const said = it.id === 'papa_s_boots'
      ? 'Bram hugs Papa\'s boots. They smell of the road, and of Papa.'
      : act.id === 'use' ? `Bram looks at the ${it.label}. Bram is already {green}in the pink{/green}, so it goes back in the bag.`
      : act.id === 'give' ? `Bram offers the ${it.label} to Bobble. Bobble is honoured, and puts it straight back.`
      : `Bram puts the ${it.label} down,{wait:300} and then picks it up again. Better safe.`;
    return sayAndBack(g, said);
  }
}

async function flowStatus(g) {
  stage = 'status';
  await UI.get('gold')?.close();
  const stat = (k, v) => UI.row(UI.label(k), String(v));
  const win = UI.window({
    id: 'status', title: 'Status', left: 300, top: 150, origin: '0% 0%', destroyOnClose: true,
    content: UI.cols([
      [UI.h('div.dq-pname', 'Bram'), stat('Level', 3), stat('HP', '24/24'), stat('MP', '6/6'), UI.divider(), stat('Strength', 9), stat('Agility', 7), stat('Wisdom', 5)],
      [UI.h('div.dq-pname', 'Bobble'), stat('Level', 2), stat('HP', '17/19'), stat('MP', '0/0'), UI.divider(), stat('Strength', 6), stat('Agility', 11), stat('Wisdom', 3)],
    ]),
  });
  await win.untilButton(['confirm', 'cancel']);
  if (g !== G) return false;
  await win.close();
  stage = 'command';
  return g === G;
}

async function flowInn(g) {
  stage = 'inn';
  const ok = () => g === G;
  await UI.wait(0.35); if (!ok()) return;
  await box.say('{name}Mr Pye:{/name} "Eight gold the pair of you. A bit more if the {gold}pudding{/gold} snores."', { voice: 'narrator', wait: false });
  if (!ok()) return;
  stage = 'yesno';
  const yes = await UI.yesNo();
  if (!ok()) return;
  stage = 'inn-answer';
  if (yes) {
    gold -= 8;
    await box.say('{name}Mr Pye:{/name} "Sleep well. Mind the third stair."', { voice: 'narrator' });
  } else {
    await box.say('{name}Mr Pye:{/name} "Suit yourself. The bench outside is free, and very honest about it."', { voice: 'narrator' });
  }
  if (!ok()) return;
  await box.close(); if (!ok()) return;
  stage = 'rest';
  await UI.wait(1.2); if (!ok()) return;
  flowDialogue(g);
}

async function showcase(name = 'dialogue') {
  const g = ++G;
  const scene = Scenes.get('backdrop');
  if (scene && scene.t3) scene.t3.visible = name === 'text3d';
  for (const w of UI.all()) { if (w === box) w.close({ instant: true }); else w.destroy(); }
  if (name === 'dialogue') flowDialogue(g);
  else if (name === 'command') flowCommand(g);
  else if (name === 'items' || name === 'status') flowCommand(g, name);
  else if (name === 'yesno' || name === 'inn') flowInn(g);
  else if (name === 'text3d') {
    stage = 'text3d';
    box.say('Text can live in the world too: {gold}place names{/gold}, {orange}battle numbers{/orange}, and the odd {grey}Miss{/grey}.', { voice: 'narrator' });
  }
  return { ok: true, stage: name };
}

// ── __DQ controls ───────────────────────────────────────────────────────────────────────────────────────────
Debug.expose('showcase', showcase);
Debug.expose('stage', () => stage);
Debug.expose('ui', () => UI.describe());
Debug.expose('typeSpeed', (n) => Text.setSpeed(n));
Debug.expose('uiScale', (n) => UI.setScale(n));
/** The cursor element's transform for a menu id (to prove it moves / rests). */
Debug.expose('cursorTransform', (id) => { const el = document.querySelector(`[data-dq="${id}"] .dq-cursor`); return el ? el.style.transform : null; });
/** Step the (frozen) sim in small chunks, letting promise chains run between steps, until expr is true. */
Debug.expose('advanceUntil', async (expr, stepMs = 16, maxMs = 4000) => {
  const fn = typeof expr === 'function' ? expr : new Function(`return (${expr});`);
  for (let t = 0; t <= maxMs; t += stepMs) {
    let ok = false;
    try { ok = !!fn(); } catch (_) { ok = false; }
    if (ok) return { ok: true, ms: t };
    window.__DQ.advance(stepMs);
    await new Promise((r) => setTimeout(r, 0));
  }
  return { ok: false, ms: maxMs };
});
Debug.provide('dialogue', () => { const t = UI.describe().text; return t ? { open: t.open, text: t.text, page: t.page, pages: t.pages, typing: t.typing } : null; });
Debug.provide('demo', () => ({ stage, gold, buildMs: Scenes.get('backdrop') ? Scenes.get('backdrop').buildMs : null, fonts: Font.stats() }));

/** Layout + parser checks that don't depend on timing. */
Debug.expose('selfTest', () => {
  const out = { ok: true, checks: {} };
  const check = (name, v) => { out.checks[name] = v; if (!v || v.ok === false) out.ok = false; };
  const t = new MessageBox({ id: 'selftest' });
  try {
    const long = 'Barty: "Little master! You are grown like a marrow in a wet July, and I have made the soup with the good beans, not the sulky ones, and there is bread, and there is more bread, and nobody is to argue with me about the bread, because I am old and I have a ladle."';
    t.tw.set(long);
    const w = t.textEl.clientWidth;
    let maxLines = 0, overflow = 0;
    for (let i = 0; i < t.tw.pages.length; i++) {
      t.tw.showPage(i);
      maxLines = Math.max(maxLines, t.tw.page.lines);
      for (const ln of t.tw.page.el.querySelectorAll('.dq-tline')) overflow = Math.max(overflow, ln.scrollWidth - w);
    }
    check('pagination', { ok: t.tw.pages.length >= 2 && maxLines <= 3 && overflow <= 1, pages: t.tw.pages.length, maxLines, overflowPx: overflow });
    const g = Text.parse('{gold}Ab{/gold}{shake}C{/}{p}%HERO%{n}{wait:200}x{{', { HERO: 'Bram' });
    const chars = g.filter(x => x.ch).map(x => x.ch).join('');
    check('parse', { ok: chars === 'AbCBramx{' && g.some(x => x.pb) && g.some(x => x.br) && g.some(x => x.pause === 0.2) && g[0].cls.includes('dq-c-gold') && g[2].cls.includes('dq-fx-shake') && !g[3].cls, chars });
    const lines = Font.wrap('We are Adalbert Ludovic Fitzhugh, Ninth of Coddleston, Keeper of the Shallow Ford', 420, { size: 30 });
    check('wrap', { ok: lines.length >= 2 && lines.every(l => Font.measure(l, 30).width <= 421), lines });
    check('fits34', { ok: Font.fits('Linnet: "That\'s the door, Rowan."') && !Font.fits('x'.repeat(35)) });
  } catch (e) { check('threw', { ok: false, error: String(e && e.message || e) }); }
  t.destroy();
  return out;
});

showcase('dialogue');
</script></body></html>
