<script type="importmap">

<script type="module">
// F3 — art foundation showcase. Every colour comes from PAL, every surface from Tex, every material from Toon, and the
// light / fog / contact shadows from the standard rig. The scene itself (cottage, shed, beds, tree, washing line, the
// Gloop) is demo-only set dressing built the way ART-DIRECTION §12-15 describes, so builders can see the recipes land.
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { App } from '/src/engine/app.js';
import { Scenes } from '/src/engine/states.js';
import { Debug, reportError } from '/src/engine/debug.js';
import { PAL, C3, css, mixHex, lerp, smooth, applyCssVars, swatches, luma } from '/src/art/palette.js';
import { Tex, mulberry, vnoise, blur, mkCanvas, ctx2 } from '/src/art/tex.js';
import { Toon, makeToon, withOutline, outlineMaterial, hullGeometry, spherizeNormals, normalsUp, makeLightRig,
  makeBlobShadows, makeAOMask, worldPlanar, aoPatch, OUTLINE, TOON_PRESETS } from '/src/art/toon.js';

applyCssVars();
document.documentElement.style.setProperty('--f3-shadow', css(PAL.ui.shadow, 0.45));
document.documentElement.style.setProperty('--f3-inner', css(PAL.ui.border, 0.35));
document.documentElement.style.setProperty('--f3-dim', css(PAL.ui.shadow, 0.55));

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
// terrain: a nearly flat village green in a gentle bowl
// ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
function heightAt(x, z) {
  const r = Math.hypot(x, z);
  let h = 1.1 * vnoise(x * 0.06 + 3, z * 0.06 + 7, 3) + 0.45 * vnoise(x * 0.17, z * 0.17, 5) - 0.75;
  h *= 0.06 + 0.94 * smooth(12, 26, r);
  const rimA = Math.atan2(z, x), lump = 0.6 * vnoise(Math.cos(rimA) * 3 + 5, Math.sin(rimA) * 3 + 5, 17) + 0.4 * vnoise(Math.cos(rimA) * 7, Math.sin(rimA) * 7, 19);
  h += (6.5 + 7 * lump) * smooth(30, 78, r);
  return h;
}
const PATH = [[1.4, 16], [1.7, 11.5], [0.6, 7.6], [-0.7, 4.2], [-0.9, 1.0], [-0.3, -2.2], [-0.3, -5.0]];
const SPUR = [[-0.4, -2.6], [2.2, -3.4], [4.6, -4.6]];
const MASK_SPAN = 40, MASK_N = 640, MPX = MASK_N / MASK_SPAN;
const pathMask = (() => {
  const c = mkCanvas(MASK_N), g = ctx2(c);
  g.fillStyle = PAL.mask.off; g.fillRect(0, 0, MASK_N, MASK_N);
  g.strokeStyle = PAL.mask.on; g.lineCap = 'round'; g.lineJoin = 'round';
  const stroke = (pts, w) => {
    const curve = new THREE.CatmullRomCurve3(pts.map(([x, z]) => new THREE.Vector3(x, 0, z))).getPoints(120);
    g.lineWidth = w * MPX; g.beginPath();
    curve.forEach((p, i) => { const X = (p.x + MASK_SPAN / 2) * MPX, Y = (p.z + MASK_SPAN / 2) * MPX; i ? g.lineTo(X, Y) : g.moveTo(X, Y); });
    g.stroke();
  };
  stroke(PATH, 2.1); stroke(SPUR, 1.3);
  const d = g.getImageData(0, 0, MASK_N, MASK_N).data, a = new Float32Array(MASK_N * MASK_N);
  for (let i = 0; i < a.length; i++) a[i] = d[i * 4] / 255;
  blur(a, MASK_N, MASK_N, 6, 3);
  return a;
})();
const pathAt = (x, z) => {
  const i = Math.round((x + MASK_SPAN / 2) * MPX), j = Math.round((z + MASK_SPAN / 2) * MPX);
  if (i < 0 || j < 0 || i >= MASK_N || j >= MASK_N) return 0;
  return pathMask[j * MASK_N + i];
};

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
// merge-per-material kit (ART-DIRECTION §13)
// ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
const buckets = new Map();
function prep(geo, color = PAL.mask.on) {
  let g = geo.index ? geo.toNonIndexed() : geo;
  for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
  if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
  if (!g.attributes.normal) g.computeVertexNormals();
  const c = C3(color), n = g.attributes.position.count, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return g;
}
function addTo(bucket, geo, matrix, color) { const g = prep(geo, color); g.applyMatrix4(matrix); if (!buckets.has(bucket)) buckets.set(bucket, []); buckets.get(bucket).push(g); return g; }
function boxUV(w, h, d, s = 1, segs = [1, 1, 1]) {
  const g = new THREE.BoxGeometry(w, h, d, ...segs), uv = g.attributes.uv, n = g.attributes.normal;
  for (let i = 0; i < uv.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i));
    const [U, V] = ax > 0.5 ? [d, h] : ay > 0.5 ? [w, d] : [w, h];
    uv.setXY(i, uv.getX(i) * U / s, uv.getY(i) * V / s);
  }
  return g;
}
function scaleUV(g, s) { const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) / s, uv.getY(i) / s); return g; }
/** Set a lathe/cylinder's U to an INTEGER number of repeats around (no seam) and V to world height / worldSize. */
function wrapUV(g, uRepeats, vScale) { const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * Math.max(1, Math.round(uRepeats)), uv.getY(i) * vScale); return g; }
const M4 = (x = 0, y = 0, z = 0, ry = 0, rx = 0, rz = 0, s = 1) => new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ')), new THREE.Vector3(s, s, s));

const AO = makeAOMask({ span: MASK_SPAN, size: 640, center: [0, 0] });
const FOOT = [];                                   // solid footprints: tufts and flowers stay out
const footBox = (x, z, w, d, rot, pad = 0.15) => FOOT.push({ x, z, w: w / 2 + pad, d: d / 2 + pad, c: Math.cos(rot), s: Math.sin(rot) });
const footDisc = (x, z, r) => FOOT.push({ x, z, r });
const blocked = (x, z) => FOOT.some(f => {
  const dx = x - f.x, dz = z - f.z;
  if (f.r) return dx * dx + dz * dz < f.r * f.r;
  const lx = dx * f.c - dz * f.s, lz = dx * f.s + dz * f.c;
  return Math.abs(lx) < f.w && Math.abs(lz) < f.d;
});

function gableRoof(base, W, D, H0, pitch, ovx, ovz, t, kind, gable = 'plaster', gableColor) {
  const run = D / 2 + ovz, L = run / Math.cos(pitch), ridgeY = H0 + (D / 2) * Math.tan(pitch);
  const texS = Tex.worldSize(kind);
  for (const side of [0, 1]) {
    const slab = boxUV(W + 2 * ovx, t, L, texS);
    const cy = ridgeY - (L / 2) * Math.sin(pitch) + (t / 2) * Math.cos(pitch), cz = (L / 2) * Math.cos(pitch) + (t / 2) * Math.sin(pitch);
    const m = new THREE.Matrix4().makeRotationX(pitch).setPosition(0, cy, cz);
    if (side) m.premultiply(new THREE.Matrix4().makeRotationY(Math.PI));
    addTo(kind, slab, base.clone().multiply(m));
    if (kind === 'thatch') {
      const roll = new THREE.CylinderGeometry(t * 0.62, t * 0.62, W + 2 * ovx + 0.1, 10); scaleUV(roll, 0.35);
      const ey = ridgeY - L * Math.sin(pitch) + (t * 0.45) * Math.cos(pitch), ez = L * Math.cos(pitch) + (t * 0.45) * Math.sin(pitch);
      const rm = new THREE.Matrix4().makeRotationZ(Math.PI / 2).setPosition(0, ey, ez);
      if (side) rm.premultiply(new THREE.Matrix4().makeRotationY(Math.PI));
      addTo('thatch', roll, base.clone().multiply(rm));
    }
  }
  const shape = new THREE.Shape(); shape.moveTo(-D / 2, 0); shape.lineTo(D / 2, 0); shape.lineTo(0, ridgeY - H0); shape.closePath();
  for (const sx of [-1, 1]) {
    const gab = scaleUV(new THREE.ExtrudeGeometry(shape, { depth: 0.14, bevelEnabled: false }), Tex.worldSize(gable));
    addTo(gable, gab, base.clone().multiply(M4(sx * (W / 2) + (sx < 0 ? 0 : -0.14), H0, 0, Math.PI / 2)), gableColor);
  }
  if (kind === 'thatch') {
    const ridge = new THREE.CylinderGeometry(t * 0.95, t * 0.95, W + 2 * ovx + 0.2, 12); scaleUV(ridge, 0.4);
    addTo('thatch', ridge, base.clone().multiply(M4(0, ridgeY + t * 0.55, 0, 0, 0, Math.PI / 2)));
  } else {
    const ridge = new THREE.CylinderGeometry(0.17, 0.17, W + 2 * ovx + 0.1, 10); scaleUV(ridge, 0.5);
    addTo('tile', ridge, base.clone().multiply(M4(0, ridgeY + t * 0.75, 0, 0, 0, Math.PI / 2)), PAL.tile.ridge);
  }
  return ridgeY;
}

function buildCottage(o) {
  const y = Math.min(heightAt(o.x - o.W / 2, o.z), heightAt(o.x + o.W / 2, o.z), heightAt(o.x, o.z)) - 0.05;
  const base = M4(o.x, y, o.z, o.rot);
  const { W, D, H } = o, P = 0.5, beam = PAL.wood.beam;
  const add = (b, g, m, c) => addTo(b, g, base.clone().multiply(m), c);
  add('stone', boxUV(W + 0.2, P + 0.1, D + 0.2, Tex.worldSize('stone')), M4(0, (P + 0.1) / 2 - 0.05, 0));
  const wg = addTo('plaster', boxUV(W, H, D, Tex.worldSize('plaster'), [2, 4, 2]), base.clone().multiply(M4(0, P + H / 2, 0)));
  { const p = wg.attributes.position, c = wg.attributes.color, gr = C3(PAL.plaster.grime), wh = C3(PAL.mask.on), t = new THREE.Color();
    for (let i = 0; i < p.count; i++) { t.copy(gr).lerp(wh, smooth(0, 1.0, p.getY(i) - y - P)); c.setXYZ(i, t.r, t.g, t.b); } }
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) add('wood', boxUV(0.22, H, 0.22, 1.2), M4(sx * W / 2, P + H / 2, sz * D / 2), beam);
  for (const sz of [-1, 1]) add('wood', boxUV(W + 0.14, 0.22, 0.24, 1.2), M4(0, P + H - 0.05, sz * D / 2), beam);
  for (const sx of [-1, 1]) add('wood', boxUV(0.24, 0.22, D + 0.14, 1.2), M4(sx * W / 2, P + H - 0.05, 0), beam);
  for (const sz of [-1, 1]) add('wood', boxUV(W + 0.1, 0.16, 0.22, 1.2), M4(0, P + 0.08, sz * D / 2), beam);
  // a diagonal brace each side of the door: the half-timbered read
  for (const s of [-1, 1]) add('wood', boxUV(0.16, 1.6, 0.14, 1.2), M4(o.doorX + s * 1.35, P + H * 0.5, D / 2 + 0.02, 0, 0, s * 0.62), beam);
  const dx = o.doorX;
  add('wood', boxUV(1.14, 1.9, 0.16, 1.2), M4(dx, P + 0.95, D / 2 + 0.02), beam);
  add('wood', boxUV(0.88, 1.74, 0.12, 1.0), M4(dx, P + 0.87, D / 2 + 0.07), PAL.paint.doorRed);
  add('paint', new THREE.SphereGeometry(0.06, 8, 6), M4(dx + 0.3, P + 0.9, D / 2 + 0.15), PAL.paint.iron);
  add('stone', boxUV(1.4, 0.2, 0.7, 1.2), M4(dx, 0.1, D / 2 + 0.45));
  const win = (lx, ly, face) => {
    const fm = face === 'front' ? M4(lx, ly, D / 2) : face === 'back' ? M4(lx, ly, -D / 2, Math.PI) : face === 'left' ? M4(-W / 2, ly, lx, -Math.PI / 2) : M4(W / 2, ly, lx, Math.PI / 2);
    const a = (b, g, m, c) => add(b, g, fm.clone().multiply(m), c);
    a('wood', boxUV(0.96, 0.9, 0.14, 1.2), M4(0, 0, 0.04), beam);
    a('paint', new THREE.BoxGeometry(0.72, 0.66, 0.1), M4(0, 0, 0.08), PAL.paint.glass);
    a('wood', boxUV(0.07, 0.66, 0.08, 1), M4(0, 0, 0.14), beam); a('wood', boxUV(0.72, 0.07, 0.08, 1), M4(0, 0, 0.14), beam);
    for (const s of [-1, 1]) a('paint', new THREE.BoxGeometry(0.4, 0.8, 0.06), M4(s * 0.7, 0, 0.1, s * 0.25), o.shutter);
    a('wood', boxUV(1.0, 0.2, 0.3, 0.8), M4(0, -0.55, 0.16), PAL.wood.light);
    const r = mulberry(Math.abs(lx * 100 + ly * 7 + o.x * 13) | 0);
    for (let k = 0; k < 6; k++) a('paint', new THREE.IcosahedronGeometry(0.085, 0), M4(-0.38 + k * 0.15, -0.4 + r() * 0.05, 0.16 + (r() - 0.5) * 0.12), [PAL.flower.pink, PAL.flower.yellow, PAL.flower.white, PAL.flower.red][r() * 4 | 0]);
    for (let k = 0; k < 4; k++) a('paint', new THREE.IcosahedronGeometry(0.1, 0), M4(-0.33 + k * 0.22, -0.46, 0.2), PAL.foliage.mid);
  };
  for (const wx of o.frontWindows) win(wx, P + 1.25, 'front');
  for (const wx of o.sideWindows) { win(wx, P + 1.25, 'left'); win(wx, P + 1.25, 'right'); }
  win(0, P + 1.25, 'back');
  const ridgeY = gableRoof(base, W, D, P + H, o.pitch, 0.45, 0.6, 0.16, 'tile');
  add('brick', boxUV(0.8, 2.3, 0.8, Tex.worldSize('brick')), M4(W * 0.3, ridgeY - 0.45, -D * 0.2));
  add('brick', boxUV(0.96, 0.18, 0.96, Tex.worldSize('brick')), M4(W * 0.3, ridgeY + 0.74, -D * 0.2));
  AO.box(o.x, o.z, W + 0.2, D + 0.2, o.rot, 1.3, 0.75); footBox(o.x, o.z, W + 0.4, D + 1.6, o.rot);
}

function buildShed(o) {
  const y = heightAt(o.x, o.z) - 0.05, base = M4(o.x, y, o.z, o.rot);
  const { W, D, H } = o, P = 0.22;
  const add = (b, g, m, c) => addTo(b, g, base.clone().multiply(m), c);
  add('stone', boxUV(W + 0.2, P + 0.1, D + 0.2, Tex.worldSize('stone')), M4(0, (P + 0.1) / 2 - 0.05, 0));
  add('wood', boxUV(W, H, 0.12, 1.0), M4(0, P + H / 2, -D / 2 + 0.06), PAL.wood.light);
  for (const s of [-1, 1]) add('wood', boxUV(0.12, H, D, 1.0), M4(s * (W / 2 - 0.06), P + H / 2, 0), PAL.wood.light);
  for (const s of [-1, 1]) add('wood', boxUV(0.2, H + 0.1, 0.2, 1.2), M4(s * W / 2, P + H / 2, D / 2), PAL.wood.beam);
  add('wood', boxUV(W + 0.2, 0.2, 0.22, 1.2), M4(0, P + H - 0.05, D / 2), PAL.wood.beam);
  // log pile: bark cylinders with pale cut ends
  const r = mulberry(77);
  const rows = [[5, 0.2], [4, 0.54], [3, 0.88]];
  for (const [n, ly] of rows) for (let i = 0; i < n; i++) {
    const lr = 0.17 + r() * 0.03, lx = (i - (n - 1) / 2) * 0.38 + (r() - 0.5) * 0.04, len = D * 0.72;
    const log = wrapUV(new THREE.CylinderGeometry(lr, lr, len, 12, 1, true), 1, len / Tex.worldSize('bark'));
    const m = M4(lx, P + ly, -0.05, 0, Math.PI / 2, 0);
    add('bark', log, m);
    for (const e of [1, -1]) {
      add('paint', new THREE.CircleGeometry(lr, 12), M4(lx, P + ly, -0.05 + e * (len / 2), e > 0 ? 0 : Math.PI), PAL.wood.light);
      add('paint', new THREE.RingGeometry(lr * 0.35, lr * 0.47, 12), M4(lx, P + ly, -0.05 + e * (len / 2 + 0.02), e > 0 ? 0 : Math.PI), PAL.wood.mid);
    }
  }
  add('wood', boxUV(0.6, 0.12, 0.8, 1), M4(W * 0.28, P + 0.06, D * 0.28, 0.4), PAL.wood.weathered);
  gableRoof(base, W, D, P + H, 0.72, 0.35, 0.5, 0.3, 'thatch', 'wood', PAL.wood.weathered);
  AO.box(o.x, o.z, W + 0.2, D + 0.2, o.rot, 1.1, 0.7); footBox(o.x, o.z, W + 0.3, D + 0.3, o.rot);
}

// raised garden beds: wooden edging, a heaped surface of one material
const BEDS = [
  { id: 'sand',   x: -6.4, z: 3.0,  rot: 0.55,  w: 3.0, d: 2.7, mound: 0.28, label: 'Sand' },
  { id: 'snow',   x: -3.9, z: 7.0,  rot: 0.18,  w: 2.8, d: 2.6, mound: 0.46, label: 'Snow' },
  { id: 'cobble', x: 6.7,  z: 1.9,  rot: -0.42, w: 2.8, d: 2.6, mound: 0.02, label: 'Cobbles' },
  { id: 'brick',  x: 6.9,  z: -2.3, rot: -0.75, w: 2.6, d: 2.4, mound: 0.0,  label: 'Bricks' },
];
const POND = { x: 4.0, z: 6.4, r: 1.55 };
function buildBed(b) {
  const y = heightAt(b.x, b.z) - 0.04, base = M4(b.x, y, b.z, b.rot), add = (k, g, m, c) => addTo(k, g, base.clone().multiply(m), c);
  const { w, d } = b, EH = 0.32;
  for (const s of [-1, 1]) {
    add('wood', boxUV(w + 0.16, EH, 0.16, 1.0), M4(0, EH / 2, s * d / 2), PAL.wood.weathered);
    add('wood', boxUV(0.16, EH, d, 1.0), M4(s * w / 2, EH / 2, 0), PAL.wood.weathered);
  }
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) add('wood', boxUV(0.22, EH + 0.12, 0.22, 1.2), M4(sx * w / 2, (EH + 0.12) / 2, sz * d / 2), PAL.wood.beam);
  const top = new THREE.PlaneGeometry(w - 0.1, d - 0.1, 16, 16); top.rotateX(-Math.PI / 2);
  const p = top.attributes.position, uv = top.attributes.uv, ws = Tex.worldSize(b.id) * 0.6;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) / (w / 2), v = p.getZ(i) / (d / 2);
    const k = (1 - Math.pow(Math.abs(u), 3)) * (1 - Math.pow(Math.abs(v), 3));
    p.setY(i, 0.24 + b.mound * k + (b.id === 'snow' ? 0.12 : 0.03) * (vnoise(p.getX(i) * 1.6 + b.x, p.getZ(i) * 1.6, 13) - 0.3) * k);
    uv.setXY(i, (p.getX(i) + 7) / ws, (p.getZ(i) + 3) / ws);
  }
  top.computeVertexNormals();
  add(b.id, top, M4());
  AO.box(b.x, b.z, w + 0.2, d + 0.2, b.rot, 0.9, 0.6); footBox(b.x, b.z, w, d, b.rot);
  return { base, y };

function buildStoneWalls() {
  // one continuous swept band per wall: battered faces, a rounded cap, stone UVs running along the arc
  const R = 12.5, T = 0.6, WS = Tex.worldSize('stone');
  const prof = [[-T / 2, -0.25], [-T / 2, 0.0], [-T * 0.44, 0.62], [-T * 0.3, 0.76], [0, 0.82], [T * 0.3, 0.76], [T * 0.44, 0.62], [T / 2, 0.0], [T / 2, -0.25]];

    let vAcc = [0]; for (let k = 1; k < prof.length; k++) vAcc.push(vAcc[k - 1] + Math.hypot(prof[k][0] - prof[k - 1][0], prof[k][1] - prof[k - 1][1]));
    for (let k = 0; k < prof.length - 1; k++) {                                   // one strip per profile edge: crisp creases
      const base = pos.length / 3;
      for (let i = 0; i <= N; i++) {
        const a = lerp(a0, a1, i / N), rx = Math.sin(a), rz = Math.cos(a), cx = rx * R, cz = rz * R;
        const hk = 0.78 + 0.16 * vnoise(a * 9, 3.3, 7), y0 = heightAt(cx, cz);

          pos.push(cx + rx * o, yy, cz + rz * o);
          uv.push(a * R / WS, vAcc[kk] / WS);
        }

      for (let i = 0; i < N; i++) { const a = base + i * 2, b = a + 1, c = a + 2, d = a + 3; idx.push(a, b, c, b, d, c); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
    g.computeVertexNormals();
    addTo('stone', g, new THREE.Matrix4());
    for (let i = 0; i <= 6; i++) { const a = lerp(a0, a1, i / 6); AO.disc(Math.sin(a) * R, Math.cos(a) * R, 1.0, 0.5); footDisc(Math.sin(a) * R, Math.cos(a) * R, 0.6); }
    for (let i = 0; i < 12; i++) { const a = lerp(a0, a1, (i + 0.5) / 12); AO.disc(Math.sin(a) * R, Math.cos(a) * R, 0.9, 0.5); }
  };

  }
}

// foliage (ART-DIRECTION §12): merged icosphere blobs, spherized normals, vertex gradient, hull outline, proxy shadow
// ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
function canopyGeometry(blobs, dark, light, detail = 1, spherize = 0.6) {
  let cx = 0, cy = 0, cz = 0, ws = 0; for (const b of blobs) { cx += b[0] * b[3]; cy += b[1] * b[3]; cz += b[2] * b[3]; ws += b[3]; } cx /= ws; cy /= ws; cz /= ws;
  let R = 0; for (const b of blobs) R = Math.max(R, Math.hypot(b[0] - cx, b[1] - cy, b[2] - cz) + b[3]);
  const cd = C3(dark), cl = C3(light), tmp = new THREE.Color(), v = new THREE.Vector3();
  const parts = blobs.map(([x, y, z, r, d]) => {
    const g = new THREE.IcosahedronGeometry(r, d ?? detail); g.translate(x, y, z);
    const p = g.attributes.position, cols = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      const t = smooth(-0.85, 0.9, (v.y - cy) / R), dd = Math.hypot(v.x - cx, v.y - cy, v.z - cz) / R;
      tmp.copy(cd).lerp(cl, t).multiplyScalar(lerp(0.6, 1.0, smooth(0.3, 0.92, dd)));
      cols[i * 3] = tmp.r; cols[i * 3 + 1] = tmp.g; cols[i * 3 + 2] = tmp.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(cols, 3)); g.deleteAttribute('uv');
    return g;
  });

  return spherizeNormals(merged, new THREE.Vector3(cx, cy, cz), spherize);   // per-blob sphere normals bent toward the canopy centre
}
function trunkGeometry(h = 1.6, flare = 1) {
  const pts = [[0.36 * flare, 0], [0.24 * flare, 0.2], [0.18, 0.6], [0.16, h * 0.8], [0.12, h]].map(([r, y]) => new THREE.Vector2(r, y));
  return wrapUV(new THREE.LatheGeometry(pts, 10), 1, h / Tex.worldSize('bark'));
}
const OAK = [[0, 2.75, 0, 1.3], [1.0, 2.35, 0.3, 0.88], [-0.9, 2.4, 0.45, 0.88], [0.1, 2.3, -1.0, 0.9], [0.45, 2.2, 0.95, 0.8], [0.35, 3.6, 0.2, 0.85], [-0.5, 3.35, -0.3, 0.78]];
const POPLAR = [[0, 2.0, 0, 0.85], [0.1, 2.9, 0.05, 0.8], [-0.05, 3.7, 0, 0.66], [0, 4.35, 0.05, 0.46], [0.45, 2.4, 0.3, 0.55], [-0.45, 2.6, -0.25, 0.55]];
const BUSH = [[0, 0.5, 0, 0.66], [0.62, 0.36, 0.15, 0.48], [-0.58, 0.38, 0.1, 0.5], [0.05, 0.4, 0.58, 0.45]];
const SHADOW_PROXY_MAT = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });

function forest(scene, name, blobs, list, { detail = 1, spherize = 0.72, trunkH = 1.7, dark = PAL.foliage.dark, light = PAL.foliage.sun, wind = 0.016, windBase = 1.6, outline = true, shadows = true }) {
  if (!list.length) return;
  const cg = canopyGeometry(blobs, dark, light, detail, spherize);
  const Q = new URLSearchParams(location.search), qn = (k, d) => (Q.has(k) ? +Q.get(k) : d);
  spherize = qn('spherize', spherize);
  const leafMat = makeToon({ vertexColors: true }, Object.assign({}, TOON_PRESETS.canopy, { wind, windBase },
    Q.has('csoft') ? { soft: qn('csoft') } : {}, Q.has('cmidEdge') ? { midEdge: qn('cmidEdge') } : {}, Q.has('cedge') ? { edge: qn('cedge') } : {}, Q.has('cmid') ? { mid: qn('cmid') } : {}));
  const canopy = new THREE.InstancedMesh(cg, leafMat, list.length); canopy.name = name + '-canopy'; canopy.receiveShadow = true;
  const hull = outline ? new THREE.InstancedMesh(hullGeometry(cg, OUTLINE.canopy), outlineMaterial(PAL.outline.leaf, { wind, windBase }), list.length) : null;
  if (hull) { hull.instanceMatrix = canopy.instanceMatrix; hull.name = name + '-hull'; }
  const big = [...blobs].sort((a, b) => b[3] - a[3]).slice(0, 3).map(b => [b[0], b[1], b[2], b[3] * 0.78, 1]);   // shrunk: no hard self-shadow lines across the lit side
  const proxy = shadows ? new THREE.InstancedMesh(canopyGeometry(big, dark, light, 0, 0), SHADOW_PROXY_MAT, list.length) : null;
  if (proxy) { proxy.castShadow = true; proxy.instanceMatrix = canopy.instanceMatrix; proxy.name = name + '-shadowProxy'; }
  const trunk = trunkH ? new THREE.InstancedMesh(trunkGeometry(trunkH + 0.4), Toon.surface('bark'), list.length) : null;
  if (trunk) { trunk.castShadow = true; trunk.receiveShadow = true; trunk.instanceMatrix = canopy.instanceMatrix; trunk.name = name + '-trunk'; }
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), col = new THREE.Color();
  list.forEach((t, i) => {
    q.setFromAxisAngle(up, t.r); m4.compose(new THREE.Vector3(t.x, heightAt(t.x, t.z) - 0.1, t.z), q, new THREE.Vector3(t.s, t.s * (0.95 + (t.c - 0.9)), t.s));
    canopy.setMatrixAt(i, m4); col.setRGB(t.c, t.c, t.c * 0.95); canopy.setColorAt(i, col);
    if (t.ao) AO.disc(t.x, t.z, t.ao * t.s, 0.65);
  });
  for (const m of [canopy, hull, proxy, trunk]) if (m) scene.add(m);
}

// sky dome, clouds, layered hills (ART-DIRECTION §11 — P02 owns the real sky; this is the demo backdrop)
// ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
function buildSky(scene, rig) {
  const U = { uZenith: { value: C3(PAL.sky.zenith) }, uUpper: { value: C3(PAL.sky.upper) }, uHorizon: { value: C3(PAL.sky.horizon) },
    uHaze: { value: C3(PAL.sky.haze) }, uSunGlow: { value: C3(PAL.sky.sunGlow) }, uSunDir: { value: rig.dir } };
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false, uniforms: U,
    vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform vec3 uZenith, uUpper, uHorizon, uHaze, uSunGlow, uSunDir; varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir); float h = d.y;
        vec3 c = mix(uHorizon, uUpper, smoothstep(0.0, 0.28, h));
        c = mix(c, uZenith, smoothstep(0.22, 0.9, h));

  scene.add(sky);
  const rnd = mulberry(1301), geos = [];

    list.forEach((t, i) => { q.setFromEuler(new THREE.Euler((fr() - 0.5) * 0.5, fr() * 6.28, (fr() - 0.5) * 0.5)); m4.compose(new THREE.Vector3(t.x, heightAt(t.x, t.z), t.z), q, new THREE.Vector3(t.s, t.s, t.s)); mesh.setMatrixAt(i, m4); mesh.setColorAt(i, col.copy(C3(t.hue))); });
    mesh.name = 'flowers'; scene.add(mesh); S.counts.flowers = list.length; }

  // ground last: the AO mask is complete now. World-planar grass + the worn path + painted contact AO.
  {
    const RINGS = 46, SEGS = 120, RMAX = 120, pos = [], idx = [];
    for (let i = 0; i <= RINGS; i++) {
      const r = RMAX * Math.pow(i / RINGS, 1.9);
      for (let j = 0; j < SEGS; j++) { const a = j / SEGS * Math.PI * 2; const x = Math.cos(a) * r, z = Math.sin(a) * r; pos.push(x, heightAt(x, z), z); }
    }
    for (let i = 0; i < RINGS; i++) for (let j = 0; j < SEGS; j++) {
      const a = i * SEGS + j, b = i * SEGS + (j + 1) % SEGS, c = (i + 1) * SEGS + j, d = (i + 1) * SEGS + (j + 1) % SEGS;
      idx.push(a, b, c, b, d, c);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(pos.filter((_, k) => k % 3 !== 1).map(v => v / 10), 2));
    g.setIndex(idx); g.computeVertexNormals();
    const pathTex = (() => { const d = new Uint8Array(MASK_N * MASK_N); for (let i = 0; i < d.length; i++) d[i] = Math.min(255, pathMask[i] * 255);
      const t = new THREE.DataTexture(d, MASK_N, MASK_N, THREE.RedFormat); t.minFilter = t.magFilter = THREE.LinearFilter; t.needsUpdate = true; return t; })();
    const pathPatch = (sh) => {
      sh.uniforms.tPath = { value: pathTex }; sh.uniforms.tDirtMap = { value: Tex.dirt() };
      sh.uniforms.uPathRect = { value: new THREE.Vector4(-MASK_SPAN / 2, -MASK_SPAN / 2, MASK_SPAN, MASK_SPAN) };
      sh.uniforms.uDry = { value: C3(PAL.grass.dry) }; sh.uniforms.uLip = { value: C3(PAL.dirt.dark) };
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform sampler2D tPath, tDirtMap; uniform vec4 uPathRect; uniform vec3 uDry, uLip;')
        .replace('#include <color_fragment>', `
  {
    vec2 pUv = ( vDqWorld.xz - uPathRect.xy ) / uPathRect.zw;
    float pIn = step( 0.0, pUv.x ) * step( pUv.x, 1.0 ) * step( 0.0, pUv.y ) * step( pUv.y, 1.0 );
    float pm = texture2D( tPath, pUv ).r * pIn;
    float edgeN = ( texture2D( tDqNoise, vDqWorld.xz * 0.21 + vec2( 0.13, 0.41 ) ).r - 0.5 ) * 0.16 + ( texture2D( tDqNoise, vDqWorld.xz * 0.85 ).g - 0.5 ) * 0.10;
    float pd = pm + edgeN;
    float aa = fwidth( pd ) * 0.8 + 0.003;
    float isPath = smoothstep( 0.5 - aa, 0.5 + aa, pd );
    float rim = smoothstep( 0.24, 0.5, pd ) * ( 1.0 - isPath );
    diffuseColor.rgb = mix( diffuseColor.rgb, mix( diffuseColor.rgb, uDry, 0.65 ), rim * 0.85 );
    vec3 dirt = texture2D( tDirtMap, vDqWorld.xz / 3.3 ).rgb;
    dirt = mix( dirt, dirt * 1.1, smoothstep( 0.72, 0.97, pm ) );
    dirt = mix( dirt, uLip * 0.92, ( 1.0 - smoothstep( 0.5, 0.58, pd ) ) * 0.45 );
    diffuseColor.rgb = mix( diffuseColor.rgb, dirt, isPath );
  }
  #include <color_fragment>`);
    };
    pathPatch.key = 'f3path';
    const mat = makeToon({ map: Tex.grass() }, 'ground', [worldPlanar({ scale: 1 / Tex.worldSize('grass'), breakup: 1, macro: 0.1, tint: PAL.grass.sun, tintAmount: 0.4 }), pathPatch, aoPatch(AO)], 'dqground');
    const mesh = new THREE.Mesh(g, mat); mesh.name = 'ground'; mesh.receiveShadow = true; scene.add(mesh);
  }

  gloop = buildGloop(); gloop.position.set(1.9, heightAt(1.9, 4.2), 4.2); gloop.rotation.y = 0.3; scene.add(gloop);
  blobs = makeBlobShadows(4); scene.add(blobs.mesh);
  S.buildMs = Math.round(performance.now() - t0);
}

function placeCam() {
  const v = S.view;
  tgt.set(v.target[0], heightAt(v.target[0], v.target[2]) + v.target[1], v.target[2]);
  const r = THREE.MathUtils.degToRad(v.orbit), ph = THREE.MathUtils.degToRad(v.pitch);
  if (camera.fov !== v.fov) { camera.fov = v.fov; camera.updateProjectionMatrix(); }
  camera.position.set(tgt.x + Math.sin(r) * Math.cos(ph) * v.dist, tgt.y + Math.sin(ph) * v.dist + 0.5, tgt.z + Math.cos(r) * Math.cos(ph) * v.dist);
  camera.lookAt(tgt.x, tgt.y + v.lookUp, tgt.z);
}

Scenes.register('showcase', {
  opaque: true,
  enter() {
    try { build(); } catch (e) { reportError('F3 build', e); }
    App.onResize(() => { if (camera) { camera.aspect = App.aspect(); camera.updateProjectionMatrix(); } });
  },
  update() {},
  render() {
    if (!scene) return;
    const t = App.clock.time;
    Toon.tick(t);
    if (S.orbitAuto) S.view.orbit = S.orbitBase + (t - S.t0) * S.orbitSpeed;
    placeCam();
    rig.follow(tgt);
    skyParts.sky.position.copy(camera.position);
    skyParts.clouds.rotation.y = t * 0.004;
    Tex.water().offset.set(t * 0.012, -t * 0.02);
    if (gloop) {
      const hop = Math.abs(Math.sin(t * 2.6)), squash = 1 - hop;
      gloop.scale.set(1 + squash * 0.1, 0.9 + hop * 0.12, 1 + squash * 0.1);
      gloop.rotation.y = 0.3 + Math.sin(t * 0.7) * 0.35;
      blobs.set(0, gloop.position.x, heightAt(gloop.position.x, gloop.position.z), gloop.position.z, 1.05 + squash * 0.12); blobs.commit();
    }
    App.render(scene, camera);
  },
});

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
// DOM: palette swatch strip + tileable texture sheet
// ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
function buildPalette() {
  const el = document.getElementById('palette');
  const rows = [
    ['grass', 'dirt', 'stone', 'wood', 'thatch', 'tile', 'plaster', 'brick', 'bark', 'sand', 'snow', 'water'],
    ['sky', 'cloud', 'light', 'hill', 'foliage', 'flower', 'cloth', 'char', 'slime', 'paint', 'shadow', 'outline'],
  ];
  const all = swatches();
  for (const fams of rows) {
    const row = document.createElement('div'); row.className = 'row';
    for (const f of fams) {
      const fam = document.createElement('div'); fam.className = 'fam';
      const chips = document.createElement('div'); chips.className = 'chips';
      for (const s of all.filter(s => s.family === f && s.name !== 'page')) { const c = document.createElement('div'); c.className = 'chip'; c.style.background = s.hex; c.title = s.path + ' ' + s.hex; chips.appendChild(c); }
      const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = f === 'slime' ? 'gloop' : f;
      fam.append(chips, lab); row.appendChild(fam);
    }
    el.appendChild(row);
  }
}
function buildSheet() {
  const el = document.getElementById('sheet'); el.innerHTML = '';
  const win = document.createElement('div'); win.className = 'dqwin';
  const h = document.createElement('h2'); h.textContent = 'Tileable textures — each tile repeated 2 × 2 (look for seams)'; win.appendChild(h);
  const items = Tex.materials().map(n => [n, Tex.dump(n)]);
  items.push(['cloth', Tex.dump(Tex.cloth(PAL.cloth.cream, { stripe: PAL.cloth.red }))], ['grassMask', Tex.dump('grassMask')], ['dirtMask', Tex.dump('dirtMask')], ['noise', Tex.dump('noise')]);
  for (const [n, url] of items) {
    const cell = document.createElement('div'); cell.className = 'cell';
    const sw = document.createElement('div'); sw.className = 'sw'; sw.style.backgroundImage = `url(${url})`;
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = n;
    cell.append(sw, nm); win.appendChild(cell);
  }
  el.appendChild(win);
}

// ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
// boot + critic controls
// ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
App.start({ version: '0.1.0-f3-demo' });
buildPalette();
Scenes.push('showcase');

Debug.implement('cameraOrbit', (deg) => { if (deg === undefined) return S.view.orbit; S.orbitAuto = false; S.view.orbit = +deg; return S.view.orbit; });
Debug.implement('cameraZoom', (n) => { if (n === undefined) return S.view.dist; S.view.dist = Math.max(3, +n); return S.view.dist; });
Debug.implement('timeOfDay', (h) => {
  if (h === undefined) return S.hours ?? 12;
  const H = S.hours = ((+h % 24) + 24) % 24;
  let a = 'day', b = 'day', k = 0;
  if (H > 16.5 && H < 19.5) { b = 'dusk'; k = smooth(16.5, 18.5, H); }
  else if (H >= 19.5) { a = 'dusk'; b = 'night'; k = smooth(19.5, 21, H); }
  else if (H < 5) { a = b = 'night'; }
  else if (H < 8) { a = 'night'; b = 'day'; k = smooth(5, 8, H); }
  if (a === b) rig.apply(a); else rig.blend(a, b, k);
  const skyOf = (name) => (name === 'day' ? PAL.sky : PAL[name]), kk = smooth(0, 1, k);
  for (const key of ['zenith', 'upper', 'horizon', 'haze', 'sunGlow']) {
    skyParts.uniforms['u' + key[0].toUpperCase() + key.slice(1)].value.copy(C3(skyOf(a)[key])).lerp(C3(skyOf(b)[key]), kk);
  }
  const night = (a === 'night' ? 1 - kk : 0) + (b === 'night' ? kk : 0), dusk = (a === 'dusk' ? 1 - kk : 0) + (b === 'dusk' ? kk : 0);
  skyParts.clouds.material.color.copy(C3(PAL.mask.on)).lerp(C3(PAL.dusk.sunGlow), dusk * 0.5).lerp(C3(PAL.night.hemiSky), night * 0.8);
  waterMesh.material.color.copy(C3(PAL.mask.on)).lerp(C3(PAL.dusk.sunGlow), dusk * 0.35).lerp(C3(PAL.night.hemiSky), night * 0.7);
  return S.hours;
});
Debug.expose('view', (name, over = {}) => { S.orbitAuto = false; S.viewName = VIEWS[name] ? name : 'wide'; S.view = Object.assign({}, VIEWS[S.viewName], over); placeCam(); return S.viewName; });
Debug.expose('orbit', (on = true, speed) => { S.orbitAuto = !!on; if (speed !== undefined) S.orbitSpeed = +speed; S.orbitBase = S.view.orbit; S.t0 = App.clock.time; return S.orbitAuto; });
Debug.expose('toon', (k, v) => Toon.tune(k, v));
Debug.expose('outline', (b) => Toon.setOutlines(b));
Debug.expose('light', (sunI, hemiI) => { if (sunI != null) rig.sun.intensity = sunI; if (hemiI != null) rig.hemi.intensity = hemiI; return [rig.sun.intensity, rig.hemi.intensity]; });
Debug.expose('preset', (name) => rig.apply(name));
Debug.expose('texNames', () => Tex.list());
Debug.expose('texDump', (name) => Tex.dump(name));
Debug.expose('texInfo', () => Tex.info());
Debug.expose('sheet', (on = true) => { const el = document.getElementById('sheet'); if (on && !el.childElementCount) buildSheet(); el.hidden = !on; return !el.hidden; });
Debug.expose('ui', (on = true) => { for (const id of ['title', 'palette']) document.getElementById(id).hidden = !on; return on; });
Debug.expose('views', () => Object.keys(VIEWS));
/** Poke a property on every scene object whose name starts with `prefix` (debug: castShadow, receiveShadow, visible). */
Debug.expose('shadows', (on = true) => { App.renderer.shadowMap.enabled = !!on; scene.traverse(o => { const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : []; ms.forEach(m => m.needsUpdate = true); }); return !!on; });
Debug.expose('poke', (prefix, key, value) => { let n = 0; scene.traverse(o => { if (o.name && o.name.startsWith(prefix)) { o[key] = value; if (o.material && key === 'receiveShadow') o.material.needsUpdate = true; n++; } }); return n; });
/** Numeric tileability check: wrap-edge colour jump vs the largest interior jump (<= ~1 means no seam). */
Debug.expose('seams', () => {
  const out = {};
  for (const n of Tex.materials()) {
    const img = Tex.get(n).image, W = img.width, H = img.height, d = img.getContext('2d').getImageData(0, 0, W, H).data;
    const colDiff = (x0, x1) => { let s = 0; for (let y = 0; y < H; y++) for (let k = 0; k < 3; k++) s += Math.abs(d[(y * W + x0) * 4 + k] - d[(y * W + x1) * 4 + k]); return s / (H * 3); };
    const rowDiff = (y0, y1) => { let s = 0; for (let x = 0; x < W; x++) for (let k = 0; k < 3; k++) s += Math.abs(d[(y0 * W + x) * 4 + k] - d[(y1 * W + x) * 4 + k]); return s / (W * 3); };
    let mx = 0, my = 0; for (let x = 0; x < W - 1; x++) mx = Math.max(mx, colDiff(x, x + 1)); for (let y = 0; y < H - 1; y++) my = Math.max(my, rowDiff(y, y + 1));
    out[n] = { x: +(colDiff(W - 1, 0) / mx).toFixed(2), y: +(rowDiff(H - 1, 0) / my).toFixed(2) };
  }
  return out;
});
Debug.expose('lumaCheck', () => ({ litGrass: +luma(PAL.grass.mid).toFixed(3), sun: PAL.light.sun, hemiSky: PAL.light.hemiSky }));
Debug.provide('art', () => ({
  view: S.viewName, orbit: +S.view.orbit.toFixed(1), orbitAuto: S.orbitAuto, buildMs: S.buildMs, counts: S.counts,
  rig: rig ? rig.state() : null, toon: Toon.stats(), textures: Object.entries(Tex.info()).filter(([, v]) => v.built).map(([k, v]) => `${k}:${v.ms}ms`),
  palette: swatches().length,
}));
