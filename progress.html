<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Building Dragon Quest V — live</title>
<style>
:root{--ink:#f4efe2;--dim:#a9b4cf;--win:#12245e;--win2:#050b28;--edge:#eef3ff;--gold:#ffd75e;--good:#7ee08a;--warn:#ffb64d;--bad:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;background:#05070f radial-gradient(1200px 700px at 50% -10%,#12224e 0%,#05070f 70%);
 color:var(--ink);font:15px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:30px;margin:0 0 2px;letter-spacing:.5px;text-shadow:0 2px 0 #000a}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
.bar{height:18px;border-radius:9px;background:#0a1130;border:2px solid var(--edge);overflow:hidden;box-shadow:0 3px 0 #0008}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4a7fe0,#7ee08a);transition:width .6s}
.win{background:linear-gradient(180deg,var(--win),var(--win2));border:3px solid var(--edge);border-radius:12px;
 box-shadow:0 6px 0 #0009,inset 0 0 0 2px #ffffff22;padding:14px 16px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.card{background:linear-gradient(180deg,#16296b,#070e2e);border:2px solid #cddaff;border-radius:10px;padding:10px 12px;
 box-shadow:0 4px 0 #0008;position:relative;overflow:hidden}
.card.passed{border-color:var(--good);box-shadow:0 4px 0 #0008,0 0 22px #7ee08a44}
.card.iterating{border-color:var(--warn)}
.card.building{border-color:#8ab4ff}
.card.todo{opacity:.5}
.id{font:700 11px/1 ui-monospace,monospace;color:var(--gold);letter-spacing:1px}
.nm{font-size:14px;margin:4px 0 7px;min-height:2.6em}
.sc{position:absolute;right:10px;top:8px;font:800 19px/1 ui-monospace,monospace}
.mini{height:7px;border-radius:4px;background:#0a1130;overflow:hidden;border:1px solid #ffffff33}
.mini i{display:block;height:100%;background:linear-gradient(90deg,#e05a5a,#ffb64d 55%,#7ee08a 85%)}
.gap{font-size:11.5px;color:var(--dim);margin-top:7px;font-style:italic;max-height:4.5em;overflow:hidden}
.meta{font:11px ui-monospace,monospace;color:#8fa0c8;margin-top:6px;display:flex;justify-content:space-between}
.log{font:12px/1.65 ui-monospace,monospace;max-height:280px;overflow:auto;color:#c8d4f0}
.log b{color:var(--gold)}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin:10px 0 0}
.stats b{color:var(--ink);font-size:19px;display:block;font-family:ui-monospace,monospace}
a{color:#9dc4ff}
</style></head><body><div class="wrap">
<h1>⚔︎ Dragon Quest V — build in progress</h1>
<div class="sub" id="sub">loading…</div>
<div class="bar"><i id="pbar" style="width:0%"></i></div>
<div class="stats" id="stats"></div>
<div class="win"><div style="font-size:13px;color:#cfe0ff;margin-bottom:8px">
  ▶ Play the build: <a href="/index.html">/index.html</a> &nbsp;·&nbsp; a piece passes at <b>85</b> —
  "a child could not tell which was the commercial game".</div></div>
<div class="grid" id="grid"></div>
<div class="win"><div style="font-size:13px;color:var(--gold);margin-bottom:6px">Chronicle</div>
<div class="log" id="log"></div></div>
</div><script>
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
async function tick(){
 let d; try{ d=await (await fetch('/docs/progress.json?'+Date.now())).json(); }catch(e){ return; }
 const ps=Object.values(d.pieces||{});
 const done=ps.filter(p=>p.status==='passed').length;
 const avg=ps.length?Math.round(ps.reduce((a,p)=>a+(p.best||0),0)/ps.length):0;
 const rounds=ps.reduce((a,p)=>a+(p.rounds||0),0);
 document.getElementById('sub').textContent=
   `Wave ${d.wave||0}${d.waveTitle?' — '+d.waveTitle:''} · updated ${d.updated?new Date(d.updated).toLocaleTimeString():'—'}`;
 document.getElementById('pbar').style.width=(ps.length?done/ps.length*100:0)+'%';
 document.getElementById('stats').innerHTML=
   `<div><b>${done}/${ps.length}</b>pieces passed</div><div><b>${avg}</b>avg best score</div>`+
   `<div><b>${rounds}</b>critic rounds</div><div><b>${ps.filter(p=>p.status==='iterating').length}</b>in the forge</div>`;
 const order={iterating:0,building:1,passed:2,todo:3};
 ps.sort((a,b)=>(order[a.status]??9)-(order[b.status]??9)||a.id.localeCompare(b.id));
 document.getElementById('grid').innerHTML=ps.map(p=>{
  const s=p.best||0,col=s>=85?'var(--good)':s>=70?'var(--warn)':s>0?'var(--bad)':'#556';
  return `<div class="card ${p.status}"><div class="sc" style="color:${col}">${s||'·'}</div>
   <div class="id">${esc(p.id)} · ${esc(p.status)}</div><div class="nm">${esc(p.name||p.note||'')}</div>
   <div class="mini"><i style="width:${Math.min(100,s)}%"></i></div>
   ${p.gap?`<div class="gap">biggest gap: ${esc(p.gap)}</div>`:''}
   <div class="meta"><span>rounds ${p.rounds||0}</span><span>now ${p.score||0}</span></div></div>`;
 }).join('')||'<div style="color:#889">no pieces registered yet…</div>';
 document.getElementById('log').innerHTML=(d.events||[]).slice(-120).reverse()
   .map(e=>`<div><b>${e.at?new Date(e.at).toLocaleTimeString():''}</b> ${esc(e.t)}</div>`).join('');
}
tick(); setInterval(tick,3000);
</script></body></html>
